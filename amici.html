<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gestione Amici</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
    --tg-theme-bg-color: #ffffff;
    --tg-theme-text-color: #000000;
    --tg-theme-hint-color: #999999;
    --tg-theme-link-color: #2481cc;
    --tg-theme-button-color: #2481cc;
    --tg-theme-button-text-color: #ffffff;
    --tg-theme-secondary-bg-color: #f4f4f5;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--tg-theme-secondary-bg-color);
    margin: 0; padding: 0; color: var(--tg-theme-text-color);
}

/* HEADER */
.header {
    background-color: var(--tg-theme-bg-color);
    padding: 15px;
    border-bottom: 1px solid #e0e0e0;
    position: sticky; top: 0; z-index: 100;
    display: flex; justify-content: space-between; align-items: center;
}
.header h2 { font-size: 20px; font-weight: 700; }
.total-badge {
    background: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color);
    padding: 4px 12px; border-radius: 14px; font-size: 13px; font-weight: 600;
}

/* FORM SELEZIONE */
.form-section {
    background: var(--tg-theme-bg-color);
    padding: 15px;
    margin-bottom: 10px;
    border-bottom: 1px solid #e0e0e0;
}
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--tg-theme-hint-color); margin-bottom: 4px; text-transform: uppercase; }
select, input, textarea {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #e0e0e0;
    background: var(--tg-theme-secondary-bg-color); color: var(--tg-theme-text-color);
    font-size: 15px; outline: none; font-family: inherit;
}
textarea { resize: vertical; min-height: 64px; }
.btn-save {
    width: 100%; padding: 12px; background: #27ae60; color: white;
    border: none; border-radius: 8px; font-size: 16px; font-weight: 600;
    cursor: pointer; margin-top: 5px;
}
.btn-save:disabled { background: #ccc; }
.btn-cancel {
    width: 100%; padding: 10px; background: #95a5a6; color: white;
    border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
    cursor: pointer; margin-top: 8px; display: none;
}

/* LISTA (Layout Lista Contatti) */
.list-container { padding-bottom: 20px; }
.item {
    background-color: var(--tg-theme-bg-color);
    padding: 12px 15px;
    border-bottom: 1px solid #efeff4;
    display: flex; align-items: center;
    cursor: pointer; transition: background-color 0.2s;
}
.item:active { background-color: #f0f0f0; }
.number {
    font-weight: 700; font-size: 15px; color: #888;
    min-width: 25px; text-align: right; margin-right: 10px;
}
.content { flex-grow: 1; overflow: hidden; }
.name {
    font-weight: 600; font-size: 16px; margin-bottom: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.subtitle { font-size: 13px; color: var(--tg-theme-hint-color); }
.actions { display: flex; gap: 6px; margin-left: 10px; flex-shrink: 0; }
.btn-icon {
    width: 32px; height: 32px; border-radius: 8px; border: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; cursor: pointer;
}
.btn-info { background: #0088cc; color: white; }
.btn-edit { background: #f39c12; color: white; }
.btn-delete { background: #e74c3c; color: white; }

/* MODALE DETTAGLI (Stile Lista Contatti) */
.modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.6); z-index: 200;
    align-items: center; justify-content: center;
    backdrop-filter: blur(2px); padding: 15px;
}
.modal-overlay.active { display: flex; }
.modal {
    background: #ffffff; color: #333333;
    border-radius: 12px; padding: 25px;
    width: 100%; max-width: 450px; max-height: 85vh;
    overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    position: relative;
}
.modal h3 {
    margin-top: 0; text-align: center; color: #333333;
    border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; margin-bottom: 15px;
    font-size: 18px;
}
.info-grid { display: grid; grid-template-columns: 1fr; gap: 8px; font-size: 14px; }
.info-row { display: flex; border-bottom: 1px solid #f0f0f0; padding-bottom: 6px; }
.info-label { font-weight: bold; color: #555555; width: 130px; flex-shrink: 0; }
.info-value { color: #222222; word-break: break-word; flex-grow: 1; }
.info-section-title {
    font-size: 12px; color: #0088cc; font-weight: bold;
    text-transform: uppercase; margin-top: 12px; margin-bottom: 6px;
    border-bottom: 1px solid #e0e0e0; padding-bottom: 2px;
}
.info-section-title:first-child { margin-top: 0; }
.close-modal {
    position: absolute; top: 15px; right: 15px;
    background: none; border: none; font-size: 24px;
    color: #999999; cursor: pointer; line-height: 1;
}

.empty-state { text-align: center; padding: 40px; color: var(--tg-theme-hint-color); }
#loading {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.8); display: flex; align-items: center;
    justify-content: center; z-index: 1000; font-weight: bold; color: var(--tg-theme-link-color);
}
</style>
</head>
<body>

<div id="loading">⏳ Caricamento...</div>

<div class="header">
    <h2>👥 Gestione Amici</h2>
    <div class="total-badge" id="total-badge">Totale: 0</div>
</div>

<!-- FORM DI INSERIMENTO/MODIFICA -->
<div class="form-section">
    <div class="form-group">
        <label>Seleziona Nominativo</label>
        <select id="sel-nominativo" onchange="caricaDatiAmico()">
            <option value="">-- Cerca e seleziona --</option>
        </select>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div class="form-group">
            <label>ID Telegram / Utente</label>
            <input type="number" id="inp-id" placeholder="ID numerico" oninput="aggiornaStatoBottone()">
        </div>
        <div class="form-group">
            <label>Password Accesso</label>
            <input type="text" id="inp-pass" placeholder="Password" oninput="aggiornaStatoBottone()">
        </div>
    </div>

    <div class="form-group">
        <label>Note Amico</label>
        <textarea id="inp-note" placeholder="Note o dettagli sull'amico..." oninput="aggiornaStatoBottone()"></textarea>
    </div>

    <button type="button" class="btn-save" id="btn-save" onclick="salvaAmico()" disabled>💾 Salva Amico</button>
    <button type="button" class="btn-cancel" id="btn-cancel" onclick="annullaModifica()">✖ Annulla Modifica</button>
</div>

<!-- LISTA AMICI (GRIGLIA) -->
<div id="listContainer" class="list-container"></div>

<!-- MODALE DETTAGLI AMICO -->
<div class="modal-overlay" id="infoModal" onclick="chiudiInfoOverlay(event)">
    <div class="modal">
        <button type="button" class="close-modal" onclick="chiudiInfoAmico()">×</button>
        <h3>ℹ️ Dettagli Amico</h3>
        <div id="infoContent"></div>
    </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

document.documentElement.style.setProperty('--tg-theme-bg-color', tg.themeParams.bg_color || '#ffffff');
document.documentElement.style.setProperty('--tg-theme-text-color', tg.themeParams.text_color || '#000000');
document.documentElement.style.setProperty('--tg-theme-hint-color', tg.themeParams.hint_color || '#999999');
document.documentElement.style.setProperty('--tg-theme-secondary-bg-color', tg.themeParams.secondary_bg_color || '#f4f4f5');

let allFriends = [];
let allNominativi = [];
let editingFriendId = null;

function aggiornaStatoBottone() {
    const selVal = document.getElementById('sel-nominativo').value;
    const tgId = document.getElementById('inp-id').value.trim();
    const pass = document.getElementById('inp-pass').value.trim();
    const note = document.getElementById('inp-note').value.trim();
    const btn = document.getElementById('btn-save');

    btn.disabled = !(editingFriendId || selVal || tgId || pass || note);
}

// 1. CARICA DROPDOWN NOMINATIVI
async function init() {
    try {
        const resNom = await fetch('/api/nominativi?nocache=' + Date.now());
        if (!resNom.ok) throw new Error('Errore caricamento nominativi');
        allNominativi = await resNom.json();

        const select = document.getElementById('sel-nominativo');
        select.innerHTML = '<option value="">-- Cerca e seleziona --</option>';
        allNominativi.forEach(n => {
            const opt = document.createElement('option');
            opt.value = n.id;
            opt.textContent = n.nominativo || n.nome || `ID ${n.id}`;
            select.appendChild(opt);
        });

        await caricaListaAmici();
        document.getElementById('loading').style.display = 'none';
    } catch (e) {
        document.getElementById('loading').innerHTML = `Errore: ${e.message}`;
    }
}

// 2. QUANDO SELEZIONO UN NOMINATIVO
async function caricaDatiAmico() {
    const id = document.getElementById('sel-nominativo').value;
    const inpId = document.getElementById('inp-id');
    const inpPass = document.getElementById('inp-pass');
    const inpNote = document.getElementById('inp-note');

    aggiornaStatoBottone();

    if (!id) {
        if (!editingFriendId) {
            inpId.value = '';
            inpPass.value = '';
            inpNote.value = '';
        }
        return;
    }

    const select = document.getElementById('sel-nominativo');
    const nomeSelezionato = select.options[select.selectedIndex].text;

    const esistente = allFriends.find(f => (f.nome || '').trim().toLowerCase() === nomeSelezionato.trim().toLowerCase());
    if (esistente) {
        editingFriendId = esistente.id;
        inpId.value = esistente.telegram_id || '';
        inpPass.value = esistente.password || '';
        inpNote.value = esistente.note || '';
        document.getElementById('btn-save').textContent = '✏️ Aggiorna Amico';
        document.getElementById('btn-cancel').style.display = 'block';
    } else if (!editingFriendId) {
        const nomObj = allNominativi.find(n => String(n.id) === String(id));
        inpId.value = (nomObj && nomObj.user_id) ? nomObj.user_id : '';
        inpPass.value = (nomObj && nomObj.password) ? nomObj.password : '';
        inpNote.value = (nomObj && nomObj.informazioni) ? nomObj.informazioni : '';
    }
    aggiornaStatoBottone();
}

function annullaModifica() {
    editingFriendId = null;
    document.getElementById('sel-nominativo').value = '';
    document.getElementById('inp-id').value = '';
    document.getElementById('inp-pass').value = '';
    document.getElementById('inp-note').value = '';
    const btn = document.getElementById('btn-save');
    btn.textContent = '💾 Salva Amico';
    btn.disabled = true;
    document.getElementById('btn-cancel').style.display = 'none';
}

// 3. SALVA O AGGIORNA AMICO
async function salvaAmico() {
    const btn = document.getElementById('btn-save');
    btn.textContent = '⏳ Salvataggio...';
    btn.disabled = true;

    const select = document.getElementById('sel-nominativo');
    const nomeSelezionato = select.value ? select.options[select.selectedIndex].text : '';
    const telegram_id = document.getElementById('inp-id').value.trim();
    const password = document.getElementById('inp-pass').value.trim();
    const note = document.getElementById('inp-note').value.trim();

    const vecchioNome = editingFriendId
        ? (allFriends.find(f => Number(f.id) === Number(editingFriendId))?.nome || '')
        : '';

    try {
        const payload = {
            id: editingFriendId,
            telegram_id: telegram_id ? parseInt(telegram_id, 10) : null,
            password: password,
            nome: nomeSelezionato || vecchioNome,
            note: note
        };

        const res = await fetch('/api/salva_amico', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error('Errore salvataggio');

        annullaModifica();
        await caricaListaAmici();
        tg.showPopup({ title: '✅ Fatto', message: 'Amico salvato correttamente.' });
    } catch (e) {
        btn.disabled = false;
        btn.textContent = editingFriendId ? '✏️ Aggiorna Amico' : '💾 Salva Amico';
        tg.showPopup({ title: '❌ Errore', message: e.message });
    }
}

// 4. CARICA E RENDERIZZA LISTA AMICI
async function caricaListaAmici() {
    try {
        const res = await fetch('/api/amici?nocache=' + Date.now());
        if (!res.ok) throw new Error('Errore lista');
        allFriends = await res.json();

        document.getElementById('total-badge').textContent = 'Totale: ' + allFriends.length;
        renderList(allFriends);
    } catch (e) {
        document.getElementById('listContainer').innerHTML = `<div class="empty-state">Errore: ${e.message}</div>`;
    }
}

function renderList(items) {
    const container = document.getElementById('listContainer');
    container.innerHTML = '';

    if (items.length === 0) {
        container.innerHTML = '<div class="empty-state">Nessun amico configurato.<br>Seleziona un nominativo sopra per iniziare.</div>';
        return;
    }

    items.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'item';
        const nomeVisibile = item.nome || item.nominativo || 'Sconosciuto';
        const nomeSicuro = nomeVisibile.replace(/\\/g, '\\\\').replace(/'/g, "\\'");

        div.innerHTML = `
            <div class="number">${index + 1}</div>
            <div class="content">
                <div class="name">${nomeVisibile}</div>
                <div class="subtitle">ID: ${item.telegram_id || '-'}</div>
            </div>
            <div class="actions">
                <button type="button" class="btn-icon btn-info" onclick="event.stopPropagation(); apriInfoAmico(${item.id})" title="Dettagli">ℹ️</button>
                <button type="button" class="btn-icon btn-edit" onclick="event.stopPropagation(); editFriend(${item.id})" title="Modifica">✏️</button>
                <button type="button" class="btn-icon btn-delete" onclick="event.stopPropagation(); deleteFriend(${item.id}, '${nomeSicuro}')" title="Elimina">🗑️</button>
            </div>
        `;
        container.appendChild(div);
    });
}

// DETTAGLIO / NOTE AMICO (Stile Lista Contatti)
async function apriInfoAmico(id) {
    const amico = allFriends.find(f => Number(f.id) === Number(id));
    if (!amico) return;

    const nomeVisibile = amico.nome || amico.nominativo || '-';
    const nomCollegato = allNominativi.find(
        n => Number(n.id) === Number(amico.id) ||
        ((n.nominativo || n.nome || '').trim().toLowerCase() === nomeVisibile.trim().toLowerCase())
    );

    let moduliAttiviTesto = '-';
    try {
        const resPerm = await fetch(`/api/permessi/${amico.id}?nocache=` + Date.now());
        if (resPerm.ok) {
            const payloadPerm = await resPerm.json();
            const mappa = (payloadPerm && typeof payloadPerm.permessi === 'object' && payloadPerm.permessi !== null)
                ? payloadPerm.permessi
                : (payloadPerm || {});
            const attivi = Object.entries(mappa).filter(([, attivo]) => Boolean(attivo)).map(([mod]) => mod);
            moduliAttiviTesto = attivi.length > 0 ? `${attivi.length} (${attivi.join(', ')})` : 'Nessun modulo attivo';
        }
    } catch (e) {
        moduliAttiviTesto = '-';
    }

    const v = (val) => (val !== undefined && val !== null && String(val).trim() !== '') ? val : '-';
    const noteVal = (amico.note && String(amico.note).trim() !== '')
        ? amico.note
        : ((nomCollegato && nomCollegato.informazioni) ? nomCollegato.informazioni : '-');

    let html = '<div class="info-grid">';
    html += '<div class="info-section-title">Generale</div>';
    html += `<div class="info-row"><div class="info-label">Nominativo:</div><div class="info-value">${v(nomeVisibile)}</div></div>`;
    html += `<div class="info-row"><div class="info-label">ID Record:</div><div class="info-value">${v(amico.id)}</div></div>`;
    html += '<div class="info-section-title">Accesso & Permessi</div>';
    html += `<div class="info-row"><div class="info-label">ID Telegram:</div><div class="info-value">${v(amico.telegram_id)}</div></div>`;
    html += `<div class="info-row"><div class="info-label">Password:</div><div class="info-value">${v(amico.password)}</div></div>`;
    html += `<div class="info-row"><div class="info-label">Moduli Attivi:</div><div class="info-value">${v(moduliAttiviTesto)}</div></div>`;
    html += '<div class="info-section-title">Note / Informazioni</div>';
    html += `<div class="info-row" style="flex-direction:column;"><div class="info-label" style="width:100%;margin-bottom:4px;">Note:</div><div class="info-value" style="background:#f9f9f9;padding:8px;border-radius:4px;">${v(noteVal)}</div></div>`;
    html += '</div>';

    document.getElementById('infoContent').innerHTML = html;
    document.getElementById('infoModal').classList.add('active');
}

function chiudiInfoAmico() {
    document.getElementById('infoModal').classList.remove('active');
}

function chiudiInfoOverlay(event) {
    if (event.target && event.target.id === 'infoModal') {
        chiudiInfoAmico();
    }
}

// Azioni Lista
function editFriend(id) {
    const amico = allFriends.find(f => Number(f.id) === Number(id));
    if (!amico) return;

    editingFriendId = amico.id;
    document.getElementById('inp-id').value = amico.telegram_id || '';
    document.getElementById('inp-pass').value = amico.password || '';
    document.getElementById('inp-note').value = amico.note || '';

    const select = document.getElementById('sel-nominativo');
    const matchOpt = Array.from(select.options).find(
        o => o.text.trim().toLowerCase() === (amico.nome || '').trim().toLowerCase()
    );
    select.value = matchOpt ? matchOpt.value : '';

    const btn = document.getElementById('btn-save');
    btn.disabled = false;
    btn.textContent = '✏️ Aggiorna Amico';
    document.getElementById('btn-cancel').style.display = 'block';

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function deleteFriend(id, nome) {
    tg.showConfirm(`Eliminare l'amico ${nome}?`, async (ok) => {
        if (!ok) return;
        try {
            const res = await fetch(`/api/amici/${id}`, { method: 'DELETE' });
            if (!res.ok) throw new Error('Errore eliminazione');
            if (Number(editingFriendId) === Number(id)) {
                annullaModifica();
            }
            await caricaListaAmici();
        } catch (e) {
            tg.showPopup({ title: 'Errore', message: e.message });
        }
    });
}

// Avvio
init();
</script>
</body>
</html>
