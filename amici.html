<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gestione Amici</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
    --tg-theme-bg-color: #ffffff;
    --tg-theme-text-color: #000000;
    --tg-theme-hint-color: #999999;
    --tg-theme-link-color: #2481cc;
    --tg-theme-button-color: #2481cc;
    --tg-theme-button-text-color: #ffffff;
    --tg-theme-secondary-bg-color: #f4f4f5;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--tg-theme-secondary-bg-color);
    margin: 0; padding: 0; color: var(--tg-theme-text-color);
}

/* HEADER */
.header {
    background-color: var(--tg-theme-bg-color);
    padding: 15px;
    border-bottom: 1px solid #e0e0e0;
    position: sticky; top: 0; z-index: 100;
    display: flex; justify-content: space-between; align-items: center;
}
.header h2 { font-size: 20px; font-weight: 700; }
.total-badge {
    background: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color);
    padding: 4px 12px; border-radius: 14px; font-size: 13px; font-weight: 600;
}

/* FORM SELEZIONE */
.form-section {
    background: var(--tg-theme-bg-color);
    padding: 15px;
    margin-bottom: 10px;
    border-bottom: 1px solid #e0e0e0;
}
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--tg-theme-hint-color); margin-bottom: 4px; text-transform: uppercase; }
select, input {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #e0e0e0;
    background: var(--tg-theme-secondary-bg-color); color: var(--tg-theme-text-color);
    font-size: 15px; outline: none;
}
.btn-save {
    width: 100%; padding: 12px; background: #27ae60; color: white;
    border: none; border-radius: 8px; font-size: 16px; font-weight: 600;
    cursor: pointer; margin-top: 5px;
}
.btn-save:disabled { background: #ccc; }

/* LISTA (Layout Lista Contatti) */
.list-container { padding-bottom: 20px; }
.item {
    background-color: var(--tg-theme-bg-color);
    padding: 12px 15px;
    border-bottom: 1px solid #efeff4;
    display: flex; align-items: center;
    cursor: pointer; transition: background-color 0.2s;
}
.item:active { background-color: #f0f0f0; }
.number {
    font-weight: 700; font-size: 15px; color: #888;
    min-width: 25px; text-align: right; margin-right: 10px;
}
.content { flex-grow: 1; overflow: hidden; }
.name {
    font-weight: 600; font-size: 16px; margin-bottom: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.subtitle { font-size: 13px; color: var(--tg-theme-hint-color); }
.actions { display: flex; gap: 8px; margin-left: 10px; }
.btn-icon {
    width: 32px; height: 32px; border-radius: 8px; border: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; cursor: pointer;
}
.btn-edit { background: #f39c12; color: white; }
.btn-delete { background: #e74c3c; color: white; }

.empty-state { text-align: center; padding: 40px; color: var(--tg-theme-hint-color); }
#loading {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.8); display: flex; align-items: center;
    justify-content: center; z-index: 1000; font-weight: bold; color: var(--tg-theme-link-color);
}
</style>
</head>
<body>

<div id="loading">⏳ Caricamento...</div>

<div class="header">
    <h2>👥 Gestione Amici</h2>
    <div class="total-badge" id="total-badge">Totale: 0</div>
</div>

<!-- FORM DI INSERIMENTO/MODIFICA -->
<div class="form-section">
    <div class="form-group">
        <label>Seleziona Nominativo</label>
        <select id="sel-nominativo" onchange="caricaDatiAmico()">
            <option value="">-- Cerca e seleziona --</option>
        </select>
    </div>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div class="form-group">
            <label>ID Telegram / Utente</label>
            <input type="number" id="inp-id" placeholder="ID numerico">
        </div>
        <div class="form-group">
            <label>Password Accesso</label>
            <input type="text" id="inp-pass" placeholder="Password">
        </div>
    </div>

    <button class="btn-save" id="btn-save" onclick="salvaAmico()" disabled>💾 Salva Amico</button>
</div>

<!-- LISTA AMICI (GRIGLIA) -->
<div id="listContainer" class="list-container"></div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

// Adatta colori tema
document.documentElement.style.setProperty('--tg-theme-bg-color', tg.themeParams.bg_color || '#ffffff');
document.documentElement.style.setProperty('--tg-theme-text-color', tg.themeParams.text_color || '#000000');
document.documentElement.style.setProperty('--tg-theme-hint-color', tg.themeParams.hint_color || '#999999');
document.documentElement.style.setProperty('--tg-theme-secondary-bg-color', tg.themeParams.secondary_bg_color || '#f4f4f5');

let allFriends = [];
let selectedNominativoId = null;

// 1. CARICA DROPDOWN NOMINATIVI
async function init() {
    try {
        // Carica dropdown da /api/nominativi
        const resNom = await fetch('/api/nominativi?nocache=' + Date.now());
        if (!resNom.ok) throw new Error('Errore caricamento nominativi');
        const nominativi = await resNom.json();
        
        const select = document.getElementById('sel-nominativo');
        nominativi.forEach(n => {
            const opt = document.createElement('option');
            opt.value = n.id;
            opt.textContent = n.nome;
            select.appendChild(opt);
        });

        // Carica lista amici esistente
        await caricaListaAmici();
        document.getElementById('loading').style.display = 'none';
    } catch (e) {
        document.getElementById('loading').innerHTML = `Errore: ${e.message}`;
    }
}

// 2. QUANDO SELEZIONO UN NOMINATIVO
async function caricaDatiAmico() {
    const id = document.getElementById('sel-nominativo').value;
    selectedNominativoId = id ? parseInt(id) : null;
    const btn = document.getElementById('btn-save');
    const inpId = document.getElementById('inp-id');
    const inpPass = document.getElementById('inp-pass');

    if (!id) {
        inpId.value = '';
        inpPass.value = '';
        btn.disabled = true;
        return;
    }

    btn.disabled = false;
    inpId.value = ''; 
    inpPass.value = '';

    // Cerca se esiste già in autorizzati
    try {
        const res = await fetch(`/api/amici/${id}?nocache=` + Date.now());
        if (res.ok) {
            const data = await res.json();
            if (data.telegram_id) inpId.value = data.telegram_id;
            if (data.password) inpPass.value = data.password;
        }
    } catch (e) { console.error(e); }
}

// 3. SALVA AMICO
async function salvaAmico() {
    if (!selectedNominativoId) return;
    
    const btn = document.getElementById('btn-save');
    btn.textContent = '⏳ Salvataggio...';
    btn.disabled = true;

    const select = document.getElementById('sel-nominativo');
    const nome = select.options[select.selectedIndex].text;
    const telegram_id = document.getElementById('inp-id').value;
    const password = document.getElementById('inp-pass').value;

    try {
        const payload = {
            telegram_id: parseInt(selectedNominativoId), // Usiamo ID nominativo come PK
            password: password,
            nome: nome
        };

        const res = await fetch('/api/salva_amico', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error('Errore salvataggio');

        // Reset form e ricarica lista
        document.getElementById('sel-nominativo').value = "";
        document.getElementById('inp-id').value = "";
        document.getElementById('inp-pass').value = "";
        selectedNominativoId = null;
        btn.disabled = true;
        btn.textContent = '💾 Salva Amico';
        
        await caricaListaAmici();
        tg.showPopup({ title: '✅ Fatto', message: 'Amico salvato correttamente.' });
    } catch (e) {
        btn.disabled = false;
        btn.textContent = '💾 Salva Amico';
        tg.showPopup({ title: '❌ Errore', message: e.message });
    }
}

// 4. CARICA E RENDERIZZA LISTA AMICI
async function caricaListaAmici() {
    try {
        const res = await fetch('/api/amici?nocache=' + Date.now());
        if (!res.ok) throw new Error('Errore lista');
        allFriends = await res.json();
        
        document.getElementById('total-badge').textContent = 'Totale: ' + allFriends.length;
        renderList(allFriends);
    } catch (e) {
        document.getElementById('listContainer').innerHTML = `<div class="empty-state">Errore: ${e.message}</div>`;
    }
}

function renderList(items) {
    const container = document.getElementById('listContainer');
    container.innerHTML = '';

    if (items.length === 0) {
        container.innerHTML = '<div class="empty-state">Nessun amico configurato.<br>Seleziona un nominativo sopra per iniziare.</div>';
        return;
    }

    items.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'item';
        
        div.innerHTML = `
            <div class="number">${index + 1}</div>
            <div class="content">
                <div class="name">${item.nome || 'Sconosciuto'}</div>
                <div class="subtitle">ID: ${item.telegram_id || '-'}</div>
            </div>
            <div class="actions">
                <button class="btn-icon btn-edit" onclick="editFriend(${item.id})">✏️</button>
                <button class="btn-icon btn-delete" onclick="deleteFriend(${item.id}, '${item.nome}')">🗑️</button>
            </div>
        `;
        container.appendChild(div);
    });
}

// Azioni Lista
function editFriend(id) {
    // Seleziona nella dropdown e carica dati
    const select = document.getElementById('sel-nominativo');
    select.value = id;
    caricaDatiAmico();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function deleteFriend(id, nome) {
    tg.showConfirm(`Eliminare l'amico ${nome}?`, async (ok) => {
        if (!ok) return;
        try {
            const res = await fetch(`/api/amici/${id}`, { method: 'DELETE' });
            if (!res.ok) throw new Error('Errore eliminazione');
            await caricaListaAmici();
        } catch (e) {
            tg.showPopup({ title: 'Errore', message: e.message });
        }
    });
}

// Avvio
init();
</script>
</body>
</html>
