<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download APK</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body { font-family: -apple-system, Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 15px; }
h2 { text-align: center; color: #333; margin-bottom: 20px; }
.card { background: white; border-radius: 10px; padding: 15px; margin: 10px 0; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
.card h3 { margin: 0 0 10px 0; font-size: 16px; color: #222; }
.btn { display: block; background: #0088cc; color: white; text-align: center; padding: 12px; border-radius: 6px; text-decoration: none; font-weight: bold; }
.btn:active { background: #006699; }
.empty { text-align: center; color: #888; padding: 30px; }
</style>
</head>
<body>
<h2>📥 Download APK</h2>
<div id="lista"></div>
<script>
const tg = window.Telegram.WebApp;
tg.expand();
const params = new URLSearchParams(window.location.search);
const raw = params.get('files');
let files = [];
try { files = raw ? JSON.parse(decodeURIComponent(raw)) : []; } catch(e) { files = []; }
const container = document.getElementById('lista');
if (!Array.isArray(files) || files.length === 0) {
  container.innerHTML = '<div class="empty">Nessun file disponibile.</div>';
} else {
  container.innerHTML = files.map(f => '<div class="card"><h3>' + f.nome + '</h3><a class="btn" href="' + f.url + '" target="_blank">Scarica</a></div>').join('');
}
</script>
</body>
</html>
