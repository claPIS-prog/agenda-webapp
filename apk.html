<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestione APK</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body { font-family: -apple-system, Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 15px; }
.container { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
h2 { text-align: center; margin-top: 0; color: #333; }
.counter { text-align: center; background: #0088cc; color: white; padding: 8px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; margin: 0 auto 15px; display: inline-block; }
.counter-wrapper { text-align: center; }
.input-row { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
.input-row input, .input-row select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; box-sizing: border-box; }
.input-row input[readonly] { background: #f0f0f0; color: #666; }
.btn-add { width: 100%; padding: 12px; background: #4caf50; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
.btn-add:active { background: #388e3c; }
.item { background: #f9f9f9; padding: 12px; margin: 8px 0; border-radius: 6px; border-left: 4px solid #0088cc; }
.item strong { color: #222; font-size: 15px; display: block; margin-bottom: 4px; }
.item small { color: #666; display: block; font-size: 13px; margin: 2px 0; word-break: break-all; }
.item .scaduta { color: #c62828; font-weight: bold; }
.item .valida { color: #2e7d32; font-weight: bold; }
.item-actions { display: flex; gap: 6px; margin-top: 8px; }
.btn { padding: 6px 12px; border: none; border-radius: 4px; font-size: 13px; cursor: pointer; font-weight: bold; flex: 1; text-align: center; text-decoration: none; display: inline-block; }
.btn-link { background: #0088cc; color: white; }
.btn-link:active { background: #006699; }
.btn-del { background: #f44336; color: white; }
.btn-del:active { background: #d32f2f; }
.empty { text-align: center; color: #888; padding: 30px; }
.error { text-align: center; color: #c62828; padding: 20px; background: #ffebee; border-radius: 6px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 6px; z-index: 200; opacity: 0; transition: opacity 0.3s; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
<h2>📦 Gestione APK</h2>
<div class="counter-wrapper"><div class="counter" id="counter">Totale: 0</div></div>
<div class="input-row">
<input type="text" id="nome_file" placeholder="Nome file (es. app_v1.apk)">
<select id="credenziale_select">
  <option value="">-- Seleziona Servizio (da Credenziali) --</option>
</select>
<input type="text" id="link" readonly placeholder="Link automatico (da Credenziali)">
<input type="text" id="file_token" placeholder="Token/File ID (per cancellazione remota)">
<input type="date" id="scadenza" placeholder="Scadenza Upload APK">
<button class="btn-add" onclick="aggiungi()">➕ Aggiungi</button>
</div>
<div id="lista"><div class="empty">Caricamento...</div></div>
</div>
<div class="toast" id="toast"></div>
<script>
const tg = window.Telegram.WebApp; tg.expand();
let items = [];
let credenziali = [];

async function carica() {
  try {
    const [resApk, resCred] = await Promise.all([
      fetch('/api/apk'),
      fetch('/api/credenziali')
    ]);
    if (!resApk.ok || !resCred.ok) throw new Error('Errore server');
    items = await resApk.json();
    credenziali = await resCred.json();
    
    const sel = document.getElementById('credenziale_select');
    sel.innerHTML = '<option value="">-- Seleziona Servizio (da Credenziali) --</option>' + 
      credenziali.map(c => `<option value="${c.id}" data-percorso="${c.percorso || ''}" data-nome="${c.nominativo || ''}">${c.nominativo}</option>`).join('');
      
    render();
  } catch (e) {
    document.getElementById('lista').innerHTML = '<div class="error">Errore: ' + e.message + '</div>';
  }
}

document.getElementById('credenziale_select').addEventListener('change', function() {
  const opt = this.options[this.selectedIndex];
  const percorso = opt.getAttribute('data-percorso') || '';
  document.getElementById('link').value = percorso;
});

function render() {
  aggiornaContatore(items.length);
  if (items.length === 0) {
    document.getElementById('lista').innerHTML = '<div class="empty">Nessun APK salvato.</div>';
    return;
  }
  const oggi = new Date().toISOString().split('T')[0];
  document.getElementById('lista').innerHTML = items.map(i => {
    const data = new Date(i.creato_il).toLocaleString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
    const serv = i.credenziale_nominativo ? ` (${i.credenziale_nominativo})` : '';
    let scadenzaHtml = '<small>Data Upload: ' + data + '</small>';
    if (i.scadenza) {
      const classe = i.scadenza < oggi ? 'scaduta' : 'valida';
      const icona = i.scadenza < oggi ? '⚠️' : '✅';
      scadenzaHtml += `<small class="${classe}">${icona} Scadenza Upload: ${i.scadenza}</small>`;
    } else {
      scadenzaHtml += '<small>⚠️ Scadenza non impostata</small>';
    }
    return '<div class="item"><strong>' + (i.nome_file || 'Senza nome') + serv + '</strong>' +
      '<small>Link: <a href="' + (i.link || '#') + '" target="_blank" style="color:#0088cc;">' + (i.link || '-') + '</a></small>' +
      scadenzaHtml +
      '<div class="item-actions">' +
      '<a href="' + (i.link || '#') + '" target="_blank" class="btn btn-link">📥 Apri/Scarica</a>' +
      '<button class="btn btn-del" onclick="cancella(' + i.id + ')">🗑️ Cancella (Remoto)</button>' +
      '</div></div>';
  }).join('');
}

function aggiornaContatore(totale) { document.getElementById('counter').textContent = 'Totale: ' + totale; }

async function aggiungi() {
  const nome = document.getElementById('nome_file').value.trim();
  const sel = document.getElementById('credenziale_select');
  const credenzialeNome = sel.options[sel.selectedIndex].getAttribute('data-nome') || '';
  const link = document.getElementById('link').value.trim();
  const token = document.getElementById('file_token').value.trim();
  const scadenza = document.getElementById('scadenza').value;
  
  if (!nome || !link) { mostraToast('⚠️ Nome e Servizio sono obbligatori'); return; }
  
  try {
    const res = await fetch('/api/apk', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dati: { 
        nome_file: nome, 
        credenziale_nominativo: credenzialeNome,
        link: link, 
        file_token: token,
        scadenza: scadenza
      }})
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    document.getElementById('nome_file').value = '';
    sel.selectedIndex = 0;
    document.getElementById('link').value = '';
    document.getElementById('file_token').value = '';
    document.getElementById('scadenza').value = '';
    mostraToast('✅ APK aggiunto');
    await carica();
  } catch (e) { mostraToast('❌ Errore: ' + e.message); }
}

async function cancella(id) {
  const i = items.find(x => x.id === id); if (!i) return;
  if (!confirm('Cancellare "' + i.nome_file + '"?\n\nQuesto tenterà di eliminarlo anche dal servizio remoto (se le credenziali sono configurate).')) return;
  
  mostraToast('⏳ Cancellazione in corso...');
  try {
    const res = await fetch(`/api/apk/${id}`, { method: 'DELETE' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    mostraToast('🗑️ Cancellato con successo');
    await carica();
  } catch (e) { mostraToast('❌ Errore: ' + e.message); }
}

function mostraToast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
carica();
</script>
</body>
</html>
