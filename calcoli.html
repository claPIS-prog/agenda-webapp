<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calcoli</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="/auth.js"></script>
<style>
body { font-family: -apple-system, Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 15px; }
.container { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
h2 { text-align: center; margin-top: 0; color: #333; }
.counter { text-align: center; background: #0088cc; color: white; padding: 8px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; margin: 0 auto 15px; display: inline-block; }
.counter-wrapper { text-align: center; }
label { display: block; font-weight: bold; margin: 10px 0 4px; color: #333; font-size: 13px; }
input, select, textarea { width: 100%; padding: 9px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 14px; font-family: inherit; }
input[readonly] { background: #f0f0f0; color: #555; cursor: not-allowed; font-weight: bold; }
textarea { resize: vertical; min-height: 50px; }
.row { display: flex; gap: 8px; }
.row > div { flex: 1; }
.btn { width: 100%; padding: 13px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; color: white; }
.btn:active { opacity: 0.8; }
.btn-save { background: #4caf50; }
.btn-pdf { background: #25d366; }
.section-title { font-size: 13px; color: white; font-weight: bold; margin: 18px 0 10px; padding: 8px 12px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.section-title.filtri { background: #607d8b; }
.section-title.nuovo { background: #2196f3; }
.section-title.rinnovo { background: #ff9800; }
.section-title.riepilogo { background: #4caf50; }
.hint { font-size: 11px; color: #888; margin-top: 3px; font-style: italic; }
.result-box { background: #e8f5e9; border-left: 4px solid #4caf50; padding: 12px; border-radius: 6px; margin: 10px 0; }
.result-item { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; border-bottom: 1px solid #c8e6c9; }
.result-item:last-child { border-bottom: none; font-weight: bold; font-size: 15px; color: #2e7d32; }
.stat-box { background: #e3f2fd; border-left: 4px solid #2196f3; padding: 10px; border-radius: 6px; margin: 10px 0; text-align: center; }
.stat-box strong { font-size: 18px; color: #1976d2; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 24px; border-radius: 6px; z-index: 9999; opacity: 0; transition: opacity 0.3s; font-size: 14px; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
<h2>🧮 Calcoli</h2>
<div class="counter-wrapper"><div class="counter">Dashboard Contabile</div></div>

<!-- FILTRI -->
<div class="section-title filtri">🔍 Filtri</div>
<div class="row">
    <div><label>Nominativo DA:</label><select id="nominativo_da" onchange="calcolaAutomatico()"><option value="">-- Tutti --</option></select></div>
    <div><label>Nominativo A:</label><select id="nominativo_a" onchange="calcolaAutomatico()"><option value="">-- Tutti --</option></select></div>
</div>
<div class="row">
    <div><label>Periodo DA:</label><input type="date" id="periodo_da" onchange="calcolaAutomatico()"></div>
    <div><label>Periodo A:</label><input type="date" id="periodo_a" onchange="calcolaAutomatico()"></div>
</div>
<div class="row">
    <div><label>Reseller:</label><select id="reseller" onchange="calcolaAutomatico()"><option value="">-- Tutti --</option></select></div>
    <div><label>Procuratore:</label><select id="procuratore" onchange="calcolaAutomatico()"><option value="">-- Tutti --</option></select></div>
</div>

<!-- STATISTICHE -->
<div class="stat-box">
    <div>🆕 Nuovi: <strong id="count_nuovi">0</strong> | 🔄 Rinnovi: <strong id="count_rinnovi">0</strong></div>
</div>

<!-- NUOVO (read-only) -->
<div class="section-title nuovo">🆕 NUOVO</div>
<label>Importo Nuovo (€):</label>
<input type="number" id="importo_nuovo" step="0.01" value="0" readonly>

<div class="row">
    <div><label>Data Acconto Nuovo:</label><input type="date" id="data_acconto_nuovo" readonly></div>
    <div><label>Acconto Nuovo (€):</label><input type="number" id="acconto_nuovo" step="0.01" value="0" readonly></div>
</div>

<label>Info su Saldo Nuovo:</label>
<textarea id="info_saldo_nuovo" placeholder="Note sul saldo nuovo..."></textarea>

<div class="row">
    <div><label>Data Acconto Saldo Nuovo:</label><input type="date" id="data_acconto_saldo_nuovo" readonly></div>
    <div><label>Acconto Saldo Nuovo (€):</label><input type="number" id="acconto_saldo_nuovo" step="0.01" value="0" readonly></div>
</div>

<label>Totale Acconti Nuovi (€):</label>
<input type="number" id="totale_acconti_nuovi" step="0.01" value="0" readonly>

<label>Info su Saldo Rinnovo (NUOVO):</label>
<textarea id="info_saldo_rinnovo_nuovo" placeholder="Note..."></textarea>

<!-- RINNOVO (read-only) -->
<div class="section-title rinnovo">🔄 RINNOVO</div>
<label>Importo Rinnovo (€):</label>
<input type="number" id="importo_rinnovo" step="0.01" value="0" readonly>

<div class="row">
    <div><label>Data Acconto Rinnovo:</label><input type="date" id="data_acconto_rinnovo" readonly></div>
    <div><label>Acconto Rinnovo (€):</label><input type="number" id="acconto_rinnovo" step="0.01" value="0" readonly></div>
</div>

<label>Info su Saldo Rinnovo:</label>
<textarea id="info_saldo_rinnovo" placeholder="Note sul saldo rinnovo..."></textarea>

<div class="row">
    <div><label>Data Acconto Saldo Rinnovo:</label><input type="date" id="data_acconto_saldo_rinnovo" readonly></div>
    <div><label>Acconto Saldo Rinnovo (€):</label><input type="number" id="acconto_saldo_rinnovo" step="0.01" value="0" readonly></div>
</div>

<label>Totale Acconti Rinnovo (€):</label>
<input type="number" id="totale_acconti_rinnovo" step="0.01" value="0" readonly>

<!-- RIEPILOGO -->
<div class="section-title riepilogo">📊 RIEPILOGO</div>
<div class="result-box">
    <div class="result-item"><span>Totale Acconti Nuovi:</span><span id="rpt_nuovi">€ 0.00</span></div>
    <div class="result-item"><span>Totale Acconti Rinnovo:</span><span id="rpt_rinnovo">€ 0.00</span></div>
    <div class="result-item"><span>TOTALE GENERALE:</span><span id="rpt_totale">€ 0.00</span></div>
</div>

<label>Note generali (opzionale):</label>
<textarea id="note" placeholder="Note..."></textarea>

<!-- BOTTONI -->
<button class="btn btn-save" onclick="salva()">💾 SALVA</button>
<button class="btn btn-pdf" onclick="generaPDFWhatsApp()">📄 PDF x WHATSAPP</button>
</div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram.WebApp; tg.expand();

function getHeaders(contentType) {
    const headers = {};
    if (contentType) headers['Content-Type'] = contentType;
    const initData = tg.initData;
    if (initData) headers['X-Telegram-Init-Data'] = initData;
    return headers;
}

let nominativi = [];
let resellers = [];
let procuratori = [];

async function caricaDropdowns() {
    const ok = async (url) => {
        try {
            const res = await fetch(url, { headers: getHeaders() });
            if (!res.ok) return [];
            return await res.json();
        } catch (e) { return []; }
    };
    
    nominativi = await ok('/api/nominativi');
    resellers = await ok('/api/resellers');
    procuratori = await ok('/api/procuratori');
    
    const selDa = document.getElementById('nominativo_da');
    const selA = document.getElementById('nominativo_a');
    nominativi.forEach(n => {
        selDa.innerHTML += '<option value="' + n.nominativo + '">' + n.nominativo + '</option>';
        selA.innerHTML += '<option value="' + n.nominativo + '">' + n.nominativo + '</option>';
    });
    
    const selRes = document.getElementById('reseller');
    resellers.forEach(r => {
        selRes.innerHTML += '<option value="' + r.nominativo + '">' + r.nominativo + '</option>';
    });
    
    const selProc = document.getElementById('procuratore');
    procuratori.forEach(p => {
        selProc.innerHTML += '<option value="' + p.nominativo + '">' + p.nominativo + '</option>';
    });
}

async function calcolaAutomatico() {
    const nominativoDa = document.getElementById('nominativo_da').value;
    const nominativoA = document.getElementById('nominativo_a').value;
    const periodoDa = document.getElementById('periodo_da').value;
    const periodoA = document.getElementById('periodo_a').value;
    const reseller = document.getElementById('reseller').value;
    const procuratore = document.getElementById('procuratore').value;
    
    try {
        const url = `/api/calcoli/calcola?nominativo_da=${encodeURIComponent(nominativoDa)}&nominativo_a=${encodeURIComponent(nominativoA)}&periodo_da=${periodoDa}&periodo_a=${periodoA}&reseller=${encodeURIComponent(reseller)}&procuratore=${encodeURIComponent(procuratore)}`;
        const res = await fetch(url, { headers: getHeaders() });
        if (!res.ok) return;
        const data = await res.json();
        
        document.getElementById('importo_nuovo').value = data.importo_nuovo.toFixed(2);
        document.getElementById('acconto_nuovo').value = data.acconto_nuovo.toFixed(2);
        document.getElementById('acconto_saldo_nuovo').value = data.acconto_saldo_nuovo.toFixed(2);
        document.getElementById('totale_acconti_nuovi').value = data.totale_acconti_nuovi.toFixed(2);
        
        document.getElementById('importo_rinnovo').value = data.importo_rinnovo.toFixed(2);
        document.getElementById('acconto_rinnovo').value = data.acconto_rinnovo.toFixed(2);
        document.getElementById('acconto_saldo_rinnovo').value = data.acconto_saldo_rinnovo.toFixed(2);
        document.getElementById('totale_acconti_rinnovo').value = data.totale_acconti_rinnovo.toFixed(2);
        
        document.getElementById('rpt_nuovi').textContent = '€ ' + data.totale_acconti_nuovi.toFixed(2);
        document.getElementById('rpt_rinnovo').textContent = '€ ' + data.totale_acconti_rinnovo.toFixed(2);
        document.getElementById('rpt_totale').textContent = '€ ' + data.totale_generale.toFixed(2);
        
        document.getElementById('count_nuovi').textContent = data.count_nuovi;
        document.getElementById('count_rinnovi').textContent = data.count_rinnovi;
    } catch (e) { console.error(e); }
}

function mostraToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}

async function salva() {
    const dati = {
        nominativo_da: document.getElementById('nominativo_da').value,
        nominativo_a: document.getElementById('nominativo_a').value,
        periodo_da: document.getElementById('periodo_da').value,
        periodo_a: document.getElementById('periodo_a').value,
        reseller: document.getElementById('reseller').value,
        procuratore: document.getElementById('procuratore').value,
        importo_nuovo: parseFloat(document.getElementById('importo_nuovo').value) || 0,
        data_acconto_nuovo: document.getElementById('data_acconto_nuovo').value,
        acconto_nuovo: parseFloat(document.getElementById('acconto_nuovo').value) || 0,
        info_saldo_nuovo: document.getElementById('info_saldo_nuovo').value.trim(),
        data_acconto_saldo_nuovo: document.getElementById('data_acconto_saldo_nuovo').value,
        acconto_saldo_nuovo: parseFloat(document.getElementById('acconto_saldo_nuovo').value) || 0,
        totale_acconti_nuovi: parseFloat(document.getElementById('totale_acconti_nuovi').value) || 0,
        info_saldo_rinnovo_nuovo: document.getElementById('info_saldo_rinnovo_nuovo').value.trim(),
        importo_rinnovo: parseFloat(document.getElementById('importo_rinnovo').value) || 0,
        data_acconto_rinnovo: document.getElementById('data_acconto_rinnovo').value,
        acconto_rinnovo: parseFloat(document.getElementById('acconto_rinnovo').value) || 0,
        info_saldo_rinnovo: document.getElementById('info_saldo_rinnovo').value.trim(),
        data_acconto_saldo_rinnovo: document.getElementById('data_acconto_saldo_rinnovo').value,
        acconto_saldo_rinnovo: parseFloat(document.getElementById('acconto_saldo_rinnovo').value) || 0,
        totale_acconti_rinnovo: parseFloat(document.getElementById('totale_acconti_rinnovo').value) || 0,
        totale_generale: parseFloat(document.getElementById('rpt_totale').textContent.replace('€ ', '')) || 0,
        note: document.getElementById('note').value.trim()
    };
    
    try {
        const res = await fetch('/api/calcoli', {
            method: 'POST',
            headers: getHeaders('application/json'),
            body: JSON.stringify({ dati: dati })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        mostraToast('✅ Calcolo salvato!');
        document.getElementById('note').value = '';
    } catch (e) {
        mostraToast('❌ Errore: ' + e.message);
    }
}

function generaPDFWhatsApp() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    
    const nominativoDa = document.getElementById('nominativo_da').value || 'Tutti';
    const nominativoA = document.getElementById('nominativo_a').value || 'Tutti';
    const periodoDa = document.getElementById('periodo_da').value || 'N/D';
    const periodoA = document.getElementById('periodo_a').value || 'N/D';
    const reseller = document.getElementById('reseller').value || 'Tutti';
    const procuratore = document.getElementById('procuratore').value || 'Tutti';
    
    doc.setFontSize(16);
    doc.text('Report Calcoli', 105, 20, { align: 'center' });
    
    doc.setFontSize(10);
    doc.text(`Nominativi: ${nominativoDa} - ${nominativoA}`, 20, 35);
    doc.text(`Periodo: ${periodoDa} - ${periodoA}`, 20, 42);
    doc.text(`Reseller: ${reseller} | Procuratore: ${procuratore}`, 20, 49);
    
    doc.setFontSize(12);
    doc.text('NUOVO', 20, 60);
    doc.setFontSize(10);
    doc.text(`Importo: EUR ${document.getElementById('importo_nuovo').value}`, 20, 67);
    doc.text(`Acconto: EUR ${document.getElementById('acconto_nuovo').value}`, 20, 74);
    doc.text(`Saldo: EUR ${document.getElementById('acconto_saldo_nuovo').value}`, 20, 81);
    doc.text(`Totale: EUR ${document.getElementById('totale_acconti_nuovi').value}`, 20, 88);
    
    doc.setFontSize(12);
    doc.text('RINNOVO', 20, 100);
    doc.setFontSize(10);
    doc.text(`Importo: EUR ${document.getElementById('importo_rinnovo').value}`, 20, 107);
    doc.text(`Acconto: EUR ${document.getElementById('acconto_rinnovo').value}`, 20, 114);
    doc.text(`Saldo: EUR ${document.getElementById('acconto_saldo_rinnovo').value}`, 20, 121);
    doc.text(`Totale: EUR ${document.getElementById('totale_acconti_rinnovo').value}`, 20, 128);
    
    doc.setFontSize(14);
    doc.text(`TOTALE GENERALE: EUR ${document.getElementById('rpt_totale').textContent.replace('EUR ', '')}`, 20, 145);
    
    const note = document.getElementById('note').value;
    if (note) {
        doc.setFontSize(10);
        doc.text('Note:', 20, 160);
        doc.text(note, 20, 167);
    }
    
    doc.save('calcoli.pdf');
    
    const msg = `Report Calcoli\nNominativi: ${nominativoDa} - ${nominativoA}\nPeriodo: ${periodoDa} - ${periodoA}\nReseller: ${reseller}\nProcuratore: ${procuratore}\nTotale: EUR ${document.getElementById('rpt_totale').textContent.replace('EUR ', '')}`;
    window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
    
    mostraToast('📄 PDF scaricato + WhatsApp aperto');
}

caricaDropdowns();
calcolaAutomatico();
</script>
</body>
</html>
