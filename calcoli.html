<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calcoli</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/auth.js"></script>
<style>
body { font-family: -apple-system, Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 15px; }
.container { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
h2 { text-align: center; margin-top: 0; color: #333; }
.counter { text-align: center; background: #0088cc; color: white; padding: 8px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; margin: 0 auto 15px; display: inline-block; }
.counter-wrapper { text-align: center; }
label { display: block; font-weight: bold; margin: 12px 0 4px; color: #333; font-size: 14px; }
input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 15px; }
input[readonly] { background: #f0f0f0; color: #555; cursor: not-allowed; }
.row { display: flex; gap: 10px; }
.row > div { flex: 1; }
.btn { width: 100%; padding: 14px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 15px; background: #4caf50; color: white; }
.btn:active { background: #388e3c; }
.result-box { background: #e3f2fd; border-left: 4px solid #0088cc; padding: 15px; border-radius: 6px; margin-top: 20px; }
.result-box h3 { margin-top: 0; color: #0088cc; }
.result-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #bbdefb; }
.result-item:last-child { border-bottom: none; font-weight: bold; font-size: 16px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 24px; border-radius: 6px; z-index: 9999; opacity: 0; transition: opacity 0.3s; font-size: 14px; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
<h2>🧮 Calcoli</h2>
<div class="counter-wrapper"><div class="counter">Calcolo Differenze</div></div>

<label>Valore 1:</label>
<input type="number" id="valore1" step="0.01" value="0" oninput="calcola()">

<label>Valore 2:</label>
<input type="number" id="valore2" step="0.01" value="0" oninput="calcola()">

<div class="result-box">
<h3>📊 Risultati</h3>
<div class="result-item">
<span>Differenza:</span>
<span id="risultato">0.00</span>
</div>
</div>

<button class="btn" onclick="salva()">💾 Salva Calcolo</button>
</div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram.WebApp; tg.expand();

function getHeaders(contentType) {
    const headers = {};
    if (contentType) headers['Content-Type'] = contentType;
    const initData = tg.initData;
    if (initData) headers['X-Telegram-Init-Data'] = initData;
    return headers;
}

function calcola() {
    const v1 = parseFloat(document.getElementById('valore1').value) || 0;
    const v2 = parseFloat(document.getElementById('valore2').value) || 0;
    const diff = v1 - v2;
    document.getElementById('risultato').textContent = diff.toFixed(2);
}

function mostraToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}

async function salva() {
    const v1 = parseFloat(document.getElementById('valore1').value) || 0;
    const v2 = parseFloat(document.getElementById('valore2').value) || 0;
    const diff = v1 - v2;
    
    // TODO: Implementare salvataggio nel database
    mostraToast('✅ Calcolo salvato: ' + diff.toFixed(2));
}
</script>
</body>
</html>
