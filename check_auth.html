<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Autenticazione</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/auth.js"></script>
<style>
body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
.container { background: white; padding: 20px; border-radius: 10px; max-width: 600px; margin: 0 auto; }
h2 { color: #333; }
.result { padding: 10px; margin: 10px 0; border-radius: 5px; }
.success { background: #e8f5e9; color: #2e7d32; border-left: 4px solid #4caf50; }
.error { background: #ffebee; color: #c62828; border-left: 4px solid #f44336; }
.info { background: #e3f2fd; color: #1565c0; border-left: 4px solid #2196f3; }
.log { background: #f5f5f5; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 12px; max-height: 300px; overflow-y: auto; margin-top: 10px; }
button { padding: 10px 20px; background: #0088cc; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
button:hover { background: #006699; }
pre { background: #f5f5f5; padding: 8px; border-radius: 4px; overflow-x: auto; font-size: 11px; }
</style>
</head>
<body>
<div class="container">
<h2>🔍 Test Autenticazione Telegram</h2>

<div id="initdata_status" class="result info">Verifica initData...</div>
<div id="authjs_status" class="result info">Verifica auth.js...</div>
<div id="fetch_status" class="result info">Verifica fetch override...</div>
<div id="hash_status" class="result info">Verifica URL hash...</div>

<h3>Test API</h3>
<button onclick="testAPI('/api/amici')">Test /api/amici</button>
<button onclick="testAPI('/api/nominativi')">Test /api/nominativi</button>
<button onclick="testAPI('/api/config_notifiche')">Test /api/config_notifiche</button>

<div id="api_result" class="result" style="display:none;"></div>

<h3>Console Log</h3>
<div id="log" class="log"></div>
</div>

<script>
function log(msg, type = 'info') {
    var logDiv = document.getElementById('log');
    var time = new Date().toLocaleTimeString();
    var color = type === 'error' ? '#c62828' : type === 'success' ? '#2e7d32' : '#333';
    logDiv.innerHTML += '<div style="color:' + color + '">[' + time + '] ' + msg + '</div>';
    console.log(msg);
}

// Espandi WebApp se disponibile
try {
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.expand();
    }
} catch (e) {}

// Test 1: initData disponibile?
var initData = null;
var initSource = '';

if (window.getTelegramInitData) {
    initData = window.getTelegramInitData();
    if (initData) initSource = 'auth.js v4.0';
}

if (!initData) {
    try {
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) {
            initData = window.Telegram.WebApp.initData;
            initSource = 'window.Telegram.WebApp.initData';
        }
    } catch (e) {}
}

if (!initData) {
    try {
        var hash = window.location.hash || '';
        if (hash.indexOf('tgWebAppData=') !== -1) {
            var params = new URLSearchParams(hash.substring(1));
            initData = params.get('tgWebAppData');
            if (initData) initSource = 'URL hash (tgWebAppData)';
        }
    } catch (e) {}
}

var initStatus = document.getElementById('initdata_status');
if (initData && initData.length > 10) {
    initStatus.className = 'result success';
    initStatus.innerHTML = '✅ initData trovato (' + initSource + ') - lunghezza: ' + initData.length;
    log('✅ initData disponibile da: ' + initSource, 'success');
} else {
    initStatus.className = 'result error';
    initStatus.innerHTML = '❌ initData NON trovato';
    log('❌ initData non disponibile', 'error');
}

// Test 2: auth.js caricato?
var authStatus = document.getElementById('authjs_status');
if (window.getTelegramInitData) {
    authStatus.className = 'result success';
    authStatus.innerHTML = '✅ auth.js v4.0 caricato';
    log('✅ auth.js v4.0 rilevato', 'success');
} else {
    authStatus.className = 'result error';
    authStatus.innerHTML = '❌ auth.js NON caricato';
    log('❌ auth.js non rilevato', 'error');
}

// Test 3: URL hash contiene tgWebAppData?
var hashStatus = document.getElementById('hash_status');
var currentHash = window.location.hash || '';
if (currentHash.indexOf('tgWebAppData=') !== -1) {
    hashStatus.className = 'result success';
    hashStatus.innerHTML = '✅ URL hash contiene tgWebAppData (lunghezza hash: ' + currentHash.length + ')';
    log('✅ URL hash OK', 'success');
} else {
    hashStatus.className = 'result error';
    hashStatus.innerHTML = '❌ URL hash NON contiene tgWebAppData<br><pre>Hash attuale: ' + (currentHash || '(vuoto)') + '</pre>';
    log('❌ URL hash vuoto o senza tgWebAppData', 'error');
}

// Test 4: fetch override funziona?
var fetchStatus = document.getElementById('fetch_status');
var testHeaders = {};
window.fetch('/api/test', { headers: testHeaders }).catch(function(){});
setTimeout(function() {
    if (testHeaders['X-Telegram-Init-Data']) {
        fetchStatus.className = 'result success';
        fetchStatus.innerHTML = '✅ Fetch override funziona (header aggiunto)';
        log('✅ Fetch override funzionante', 'success');
    } else {
        fetchStatus.className = 'result error';
        fetchStatus.innerHTML = '❌ Fetch override NON aggiunge header';
        log('❌ Fetch override non funzionante', 'error');
    }
}, 200);

// Test API
async function testAPI(endpoint) {
    var resultDiv = document.getElementById('api_result');
    resultDiv.style.display = 'block';
    resultDiv.className = 'result info';
    resultDiv.innerHTML = '⏳ Test: ' + endpoint + '...';
    log('🔍 Test API: ' + endpoint);
    
    try {
        var res = await fetch(endpoint);
        log('📡 Status: ' + res.status);
        
        if (res.ok) {
            var data = await res.json();
            resultDiv.className = 'result success';
            resultDiv.innerHTML = '✅ ' + endpoint + ' OK<br><pre>' + JSON.stringify(data, null, 2).substring(0, 300) + '</pre>';
            log('✅ API funzionante', 'success');
        } else {
            var text = await res.text();
            resultDiv.className = 'result error';
            resultDiv.innerHTML = '❌ ' + endpoint + ' - HTTP ' + res.status + '<br><pre>' + text.substring(0, 300) + '</pre>';
            log('❌ Errore: ' + res.status, 'error');
        }
    } catch (e) {
        resultDiv.className = 'result error';
        resultDiv.innerHTML = '❌ ' + e.message;
        log('❌ ' + e.message, 'error');
    }
}

log('🚀 Test avviato');
</script>
</body>
</html>
