<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Autenticazione</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/auth.js"></script>
<style>
body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
.container { background: white; padding: 20px; border-radius: 10px; max-width: 600px; margin: 0 auto; }
h2 { color: #333; }
.result { padding: 10px; margin: 10px 0; border-radius: 5px; }
.success { background: #e8f5e9; color: #2e7d32; border-left: 4px solid #4caf50; }
.error { background: #ffebee; color: #c62828; border-left: 4px solid #f44336; }
.info { background: #e3f2fd; color: #1565c0; border-left: 4px solid #2196f3; }
.log { background: #f5f5f5; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 12px; max-height: 300px; overflow-y: auto; margin-top: 10px; }
button { padding: 10px 20px; background: #0088cc; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
button:hover { background: #006699; }
</style>
</head>
<body>
<div class="container">
<h2>🔍 Test Autenticazione Telegram</h2>

<div id="telegram_status" class="result info">Verifica Telegram...</div>
<div id="authjs_status" class="result info">Verifica auth.js...</div>
<div id="fetch_status" class="result info">Verifica fetch...</div>

<h3>Test API</h3>
<button onclick="testAPI('/api/amici')">Test /api/amici</button>
<button onclick="testAPI('/api/nominativi')">Test /api/nominativi</button>
<button onclick="testAPI('/api/config_notifiche')">Test /api/config_notifiche</button>

<div id="api_result" class="result" style="display:none;"></div>

<h3>Console Log</h3>
<div id="log" class="log"></div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

function log(msg, type = 'info') {
    const logDiv = document.getElementById('log');
    const time = new Date().toLocaleTimeString();
    const color = type === 'error' ? '#c62828' : type === 'success' ? '#2e7d32' : '#333';
    logDiv.innerHTML += `<div style="color:${color}">[${time}] ${msg}</div>`;
    console.log(msg);
}

// Test 1: Telegram WebApp
if (tg && tg.initData) {
    document.getElementById('telegram_status').className = 'result success';
    document.getElementById('telegram_status').innerHTML = '✅ Telegram WebApp OK - initData lunghezza: ' + tg.initData.length;
    log('✅ Telegram WebApp disponibile', 'success');
} else {
    document.getElementById('telegram_status').className = 'result error';
    document.getElementById('telegram_status').innerHTML = '❌ Telegram WebApp NON disponibile';
    log('❌ Telegram WebApp non disponibile', 'error');
}

// Test 2: auth.js
if (window.fetch.toString().includes('X-Telegram-Init-Data')) {
    document.getElementById('authjs_status').className = 'result success';
    document.getElementById('authjs_status').innerHTML = '✅ auth.js caricato correttamente';
    log('✅ auth.js rilevato', 'success');
} else {
    document.getElementById('authjs_status').className = 'result error';
    document.getElementById('authjs_status').innerHTML = '❌ auth.js NON caricato o errato';
    log('❌ auth.js non rilevato', 'error');
}

// Test 3: fetch override
const testHeaders = {};
const testFetch = window.fetch;
testFetch('/api/test', { headers: testHeaders }).catch(() => {});
setTimeout(() => {
    if (testHeaders['X-Telegram-Init-Data']) {
        document.getElementById('fetch_status').className = 'result success';
        document.getElementById('fetch_status').innerHTML = '✅ Fetch override funziona';
        log('✅ Fetch override funzionante', 'success');
    } else {
        document.getElementById('fetch_status').className = 'result error';
        document.getElementById('fetch_status').innerHTML = '❌ Fetch override NON funziona';
        log('❌ Fetch override non funzionante', 'error');
    }
}, 100);

// Test API
async function testAPI(endpoint) {
    const resultDiv = document.getElementById('api_result');
    resultDiv.style.display = 'block';
    resultDiv.className = 'result info';
    resultDiv.innerHTML = '⏳ Test in corso: ' + endpoint + '...';
    log('🔍 Test API: ' + endpoint);
    
    try {
        const res = await fetch(endpoint);
        log('📡 Risposta ricevuta: ' + res.status);
        
        if (res.ok) {
            const data = await res.json();
            resultDiv.className = 'result success';
            resultDiv.innerHTML = '✅ ' + endpoint + ' - OK<br><pre>' + JSON.stringify(data, null, 2).substring(0, 200) + '...</pre>';
            log('✅ API funzionante', 'success');
        } else {
            const text = await res.text();
            resultDiv.className = 'result error';
            resultDiv.innerHTML = '❌ ' + endpoint + ' - HTTP ' + res.status + '<br><pre>' + text.substring(0, 200) + '</pre>';
            log('❌ Errore API: ' + res.status, 'error');
        }
    } catch (e) {
        resultDiv.className = 'result error';
        resultDiv.innerHTML = '❌ Errore: ' + e.message;
        log('❌ Eccezione: ' + e.message, 'error');
    }
}

log('🚀 Test avviato');
</script>
</body>
</html>
