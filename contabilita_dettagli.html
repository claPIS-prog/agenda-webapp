<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dettagli Contabilità</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/auth.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f5f5f5;
  }
  body {
    padding: 16px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container {
    width: 100%;
    max-width: 560px;
    background: #ffffff;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  h2 {
    text-align: center;
    margin: 0 0 16px;
    color: #333333;
    font-size: 20px;
  }
  .form-box {
    width: 100%;
    background: #f9f9f9;
    border: 1px solid #e0e0e0;
    border-left: 4px solid #0088cc;
    border-radius: 8px;
    padding: 28px 20px;
    text-align: center;
  }
  .form-title {
    font-size: 16px;
    font-weight: bold;
    color: #222222;
    margin-bottom: 8px;
  }
  .form-desc {
    font-size: 13px;
    color: #666666;
    margin: 0 0 20px;
    line-height: 1.45;
  }
  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    color: #ffffff;
    background: #607d8b;
  }
  .btn:active {
    opacity: 0.85;
  }
</style>
</head>
<body>
<div class="container">
  <h2>📊 Dettagli Contabilità</h2>
  <form class="form-box" onsubmit="event.preventDefault(); tornaIndietro();">
    <div class="form-title">Modulo / Form in allestimento</div>
    <p class="form-desc">Questa sezione è in fase di preparazione per l'uso remoto.</p>
    <button type="submit" class="btn">⬅️ Torna indietro</button>
  </form>
</div>
<script>
  try {
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.expand();
    }
  } catch (e) {}

  function tornaIndietro() {
    if (window.history.length > 1) {
      window.history.back();
    } else if (window.Telegram && window.Telegram.WebApp && typeof window.Telegram.WebApp.close === "function") {
      window.Telegram.WebApp.close();
    }
  }
</script>
</body>
</html>
