<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credenziali & File</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body { font-family: -apple-system, Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 15px; }
.container { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
h2 { text-align: center; margin-top: 0; color: #333; }
.counter { text-align: center; background: #0088cc; color: white; padding: 8px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; margin: 0 auto 15px; display: inline-block; }
.counter-wrapper { text-align: center; }
.btn-add { width: 100%; padding: 12px; background: #4caf50; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
.btn-add:active { background: #388e3c; }
.item { background: #f9f9f9; padding: 12px; margin: 8px 0; border-radius: 6px; border-left: 4px solid #0088cc; }
.item strong { color: #222; font-size: 15px; display: block; margin-bottom: 4px; }
.item small { color: #666; display: block; font-size: 13px; margin: 2px 0; word-break: break-all; }
.item .scaduta { color: #c62828; font-weight: bold; }
.item .valida { color: #2e7d32; font-weight: bold; }
.item-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.btn { padding: 6px 10px; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; flex: 1; text-align: center; text-decoration: none; display: inline-block; min-width: 0; }
.btn-edit { background: #ff9800; color: white; }
.btn-edit:active { background: #f57c00; }
.btn-del { background: #f44336; color: white; }
.btn-del:active { background: #d32f2f; }
.btn-link { background: #0088cc; color: white; }
.btn-link:active { background: #006699; }
.empty { text-align: center; color: #888; padding: 30px; }
.error { text-align: center; color: #c62828; padding: 20px; background: #ffebee; border-radius: 6px; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
.modal-overlay.active { display: flex; }
.modal { background: white; border-radius: 10px; padding: 20px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
.modal h3 { margin-top: 0; }
.modal label { display: block; font-weight: bold; margin: 10px 0 4px; font-size: 13px; color: #555; }
.modal input, .modal textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
.modal input[readonly] { background: #f0f0f0; color: #666; }
.modal textarea { resize: vertical; min-height: 60px; }
.modal .row { display: flex; gap: 10px; }
.modal .row > div { flex: 1; }
.modal-actions { display: flex; gap: 10px; margin-top: 15px; }
.modal-actions button { flex: 1; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
.btn-save { background: #4caf50; color: white; }
.btn-cancel { background: #9e9e9e; color: white; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 6px; z-index: 200; opacity: 0; transition: opacity 0.3s; }
.toast.show { opacity: 1; }
.section-title { font-size: 12px; color: #0088cc; font-weight: bold; margin: 12px 0 6px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #e0e0e0; padding-bottom: 3px; }
</style>
</head>
<body>
<div class="container">
<h2>🔑 Credenziali & File</h2>
<div class="counter-wrapper"><div class="counter" id="counter">Totale: 0</div></div>
<button class="btn-add" onclick="apriModal()">➕ Aggiungi Record</button>
<div id="lista"><div class="empty">Caricamento...</div></div>
</div>

<div class="modal-overlay" id="modal">
<div class="modal">
<h3 id="modal_titolo">➕ Nuovo Record</h3>

<div class="section-title">📄 File</div>
<label>Nome File</label>
<input type="text" id="m_nome_file" placeholder="es. Tivuplay.apk">
<label>Link Download</label>
<input type="text" id="m_link" placeholder="https://ufile.io/...">
<label>Scadenza Upload</label>
<input type="date" id="m_scadenza">

<div class="section-title">🔐 Credenziali Servizio</div>
<label>Nominativo (Servizio)</label>
<input type="text" id="m_nominativo" placeholder="es. Ufile.io">
<label>Percorso (URL API Delete)</label>
<input type="text" id="m_percorso" placeholder="https://api...">
<div class="row">
<div><label>User-ID / API Key</label><input type="text" id="m_user_id"></div>
<div><label>Password / API Secret</label><input type="text" id="m_password"></div>
</div>
<label>File Token (per cancellazione remota)</label>
<input type="text" id="m_file_token" placeholder="Token univoco del file">

<div class="section-title">📝 Note</div>
<label>Informazioni</label>
<textarea id="m_informazioni" placeholder="Note aggiuntive..."></textarea>

<div class="modal-actions">
<button class="btn-cancel" onclick="chiudiModal()">Annulla</button>
<button class="btn-save" onclick="salva()">Salva</button>
</div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram.WebApp; tg.expand();
let items = []; let idModifica = null;

async function carica() {
  try {
    const res = await fetch('/api/credenziali');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    items = await res.json();
    render();
  } catch (e) {
    document.getElementById('lista').innerHTML = '<div class="error">Errore: ' + e.message + '</div>';
  }
}

function render() {
  aggiornaContatore(items.length);
  if (items.length === 0) {
    document.getElementById('lista').innerHTML = '<div class="empty">Nessun record salvato.</div>';
    return;
  }
  const oggi = new Date().toISOString().split('T')[0];
  document.getElementById('lista').innerHTML = items.map(i => {
    const data = i.creato_il ? new Date(i.creato_il).toLocaleString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';
    let scadenzaHtml = '';
    if (i.scadenza) {
      const classe = i.scadenza < oggi ? 'scaduta' : 'valida';
      const icona = i.scadenza < oggi ? '⚠️' : '✅';
      scadenzaHtml = `<small class="${classe}">${icona} Scadenza Upload: ${i.scadenza}</small>`;
    }
    return '<div class="item">' +
      '<strong>' + (i.nome_file || i.nominativo || 'Senza nome') + (i.nominativo ? ' (' + i.nominativo + ')' : '') + '</strong>' +
      (i.link ? '<small>Link: <a href="' + i.link + '" target="_blank" style="color:#0088cc;">' + i.link + '</a></small>' : '') +
      scadenzaHtml +
      '<small>Creato: ' + data + '</small>' +
      (i.informazioni ? '<small>Note: ' + i.informazioni + '</small>' : '') +
      '<div class="item-actions">' +
      (i.link ? '<a href="' + i.link + '" target="_blank" class="btn btn-link">📥 Apri/Scarica</a>' : '') +
      '<button class="btn btn-edit" onclick="apriModifica(' + i.id + ')">✏️ Modifica</button>' +
      '<button class="btn btn-del" onclick="cancella(' + i.id + ')">🗑️ Cancella</button>' +
      '</div></div>';
  }).join('');
}

function aggiornaContatore(totale) { document.getElementById('counter').textContent = 'Totale: ' + totale; }

function apriModal() {
  idModifica = null;
  document.getElementById('modal_titolo').textContent = '➕ Nuovo Record';
  document.getElementById('m_nome_file').value = '';
  document.getElementById('m_link').value = '';
  document.getElementById('m_scadenza').value = '';
  document.getElementById('m_nominativo').value = '';
  document.getElementById('m_percorso').value = '';
  document.getElementById('m_user_id').value = '';
  document.getElementById('m_password').value = '';
  document.getElementById('m_file_token').value = '';
  document.getElementById('m_informazioni').value = '';
  document.getElementById('modal').classList.add('active');
}

function apriModifica(id) {
  const i = items.find(x => x.id === id); if (!i) return;
  idModifica = id;
  document.getElementById('modal_titolo').textContent = '✏️ Modifica Record';
  document.getElementById('m_nome_file').value = i.nome_file || '';
  document.getElementById('m_link').value = i.link || '';
  document.getElementById('m_scadenza').value = i.scadenza || '';
  document.getElementById('m_nominativo').value = i.nominativo || '';
  document.getElementById('m_percorso').value = i.percorso || '';
  document.getElementById('m_user_id').value = i.user_id || '';
  document.getElementById('m_password').value = i.password || '';
  document.getElementById('m_file_token').value = i.file_token || '';
  document.getElementById('m_informazioni').value = i.informazioni || '';
  document.getElementById('modal').classList.add('active');
}

function chiudiModal() { document.getElementById('modal').classList.remove('active'); idModifica = null; }

async function salva() {
  const dati = {
    nome_file: document.getElementById('m_nome_file').value.trim(),
    link: document.getElementById('m_link').value.trim(),
    scadenza: document.getElementById('m_scadenza').value,
    nominativo: document.getElementById('m_nominativo').value.trim(),
    percorso: document.getElementById('m_percorso').value.trim(),
    user_id: document.getElementById('m_user_id').value.trim(),
    password: document.getElementById('m_password').value.trim(),
    file_token: document.getElementById('m_file_token').value.trim(),
    informazioni: document.getElementById('m_informazioni').value.trim()
  };
  if (!dati.nominativo && !dati.nome_file) { mostraToast('⚠️ Inserisci almeno Nominativo o Nome File'); return; }
  
  try {
    const url = idModifica ? `/api/credenziali/${idModifica}` : '/api/credenziali';
    const method = idModifica ? 'PUT' : 'POST';
    const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ dati }) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    chiudiModal(); mostraToast('✅ Salvato'); await carica();
  } catch (e) { mostraToast('❌ Errore: ' + e.message); }
}

async function cancella(id) {
  const i = items.find(x => x.id === id); if (!i) return;
  if (!confirm('Cancellare "' + (i.nome_file || i.nominativo) + '"?\n\nQuesto tenterà di eliminarlo anche dal servizio remoto (se configurato).')) return;
  try {
    const res = await fetch(`/api/credenziali/${id}`, { method: 'DELETE' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    mostraToast('🗑️ Cancellato'); await carica();
  } catch (e) { mostraToast('❌ Errore: ' + e.message); }
}

function mostraToast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
carica();
</script>
</body>
</html>
