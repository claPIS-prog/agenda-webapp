<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Nuovo Acquisto Credito</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/auth.js"></script>
<style>
body { font-family: -apple-system, Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 15px; }
.container { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); max-width: 500px; margin: 0 auto; }
h2 { text-align: center; color: #333; }
label { display: block; font-weight: bold; margin: 10px 0 4px; font-size: 13px; }
input, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
.row { display: flex; gap: 8px; } .row > div { flex: 1; }
.btn-save { width: 100%; background: #4caf50; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; margin-top: 20px; cursor: pointer; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px; border-radius: 6px; opacity: 0; transition: 0.3s; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
<h2>💳 Nuovo Acquisto Credito</h2>
<p style="font-size:12px; color:#666; text-align:center;">Il numero di protocollo (ID) sarà generato automaticamente.</p>

<label>Fornitore:</label>
<input type="text" id="c_forn" placeholder="Nome fornitore">

<div class="row">
    <div><label>Data Acquisto:</label><input type="date" id="c_data"></div>
    <div><label>Quantità:</label><input type="number" id="c_qta" value="1" min="1" oninput="calcUnit()"></div>
</div>
<div class="row">
    <div><label>Valore Totale (€):</label><input type="number" step="0.01" id="c_tot" value="0" oninput="calcUnit()"></div>
    <div><label>Prezzo Unitario (€):</label><input type="number" step="0.01" id="c_unit" readonly></div>
</div>
<label>Note:</label>
<textarea id="c_note" rows="3"></textarea>

<button class="btn-save" onclick="salva()">💾 Salva Acquisto</button>
</div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram.WebApp; tg.expand();
function getHeaders(t) { const h={}; if(t) h['Content-Type']=t; if(tg.initData) h['X-Telegram-Init-Data']=tg.initData; return h; }
document.getElementById('c_data').value = new Date().toISOString().split('T')[0];

function calcUnit() {
    const q = parseFloat(document.getElementById('c_qta').value) || 0;
    const t = parseFloat(document.getElementById('c_tot').value) || 0;
    document.getElementById('c_unit').value = q > 0 ? (t/q).toFixed(2) : "0.00";
}

async function salva() {
    if(!document.getElementById('c_forn').value.trim()) return alert("Inserisci fornitore");
    const d = {
        fornitore: document.getElementById('c_forn').value.trim(),
        data_acquisto: document.getElementById('c_data').value,
        quantita: parseInt(document.getElementById('c_qta').value) || 1,
        valore_totale: parseFloat(document.getElementById('c_tot').value) || 0,
        valore_singolo: parseFloat(document.getElementById('c_unit').value) || 0,
        note: document.getElementById('c_note').value
    };
    try {
        const r = await fetch('/api/credito', { method:'POST', headers:getHeaders('application/json'), body:JSON.stringify({dati:d}) });
        if(!r.ok) throw new Error('Errore server');
        const res = await r.json();
        document.getElementById('toast').textContent = `✅ Acquisto #${res.id} salvato!`;
        document.getElementById('toast').classList.add('show');
        setTimeout(() => tg.close(), 1500);
    } catch(e) { alert(e.message); }
}
</script>
</body>
</html>
