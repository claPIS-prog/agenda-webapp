<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Nuovo Acquisto Credito</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/auth.js"></script>
<style>
body { font-family: -apple-system, Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 15px; }
.container { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); max-width: 500px; margin: 0 auto; }
h2 { text-align: center; margin-top: 0; color: #333; }
label { display: block; font-weight: bold; margin: 10px 0 4px; color: #333; font-size: 13px; }
input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 14px; font-family: inherit; }
.row { display: flex; gap: 8px; }
.row > div { flex: 1; }
.section-title { font-size: 12px; color: #0088cc; font-weight: bold; margin: 14px 0 6px; text-transform: uppercase; border-bottom: 1px solid #e0e0e0; padding-bottom: 3px; }
.btn-save { width: 100%; background: #4caf50; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 24px; border-radius: 6px; z-index: 9999; opacity: 0; transition: opacity 0.3s; font-size: 14px; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
<h2>💳 Nuovo Acquisto Credito</h2>

<label>Fornitore:</label>
<input type="text" id="c_fornitore" placeholder="Nome fornitore">

<div class="section-title">Dettagli Acquisto</div>
<div class="row">
    <div><label>Data Acquisto:</label><input type="date" id="c_data_acquisto"></div>
    <!-- QUANTITÀ STANDARD (NON CONTATORE MANUALE) -->
    <div><label>Quantità:</label><input type="number" id="c_quantita" value="1" min="1"></div>
</div>

<div class="row">
    <div><label>Valore Totale (€):</label><input type="number" step="0.01" id="c_valore_totale" value="0"></div>
    <div><label>Valore Singolo (€):</label><input type="number" step="0.01" id="c_valore_singolo" value="0" readonly></div>
</div>

<label>Note:</label>
<textarea id="c_note" style="min-height: 60px;"></textarea>

<button class="btn-save" onclick="salvaCredito()">💾 Salva Acquisto</button>
</div>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

function getHeaders(contentType) {
    const headers = {};
    if (contentType) headers['Content-Type'] = contentType;
    const initData = tg.initData;
    if (initData) headers['X-Telegram-Init-Data'] = initData;
    return headers;
}

async function init() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('c_data_acquisto').value = today;
    
    // Calcolo automatico valore singolo
    document.getElementById('c_valore_totale').addEventListener('input', calcolaSingolo);
    document.getElementById('c_quantita').addEventListener('input', calcolaSingolo);
}

function calcolaSingolo() {
    const totale = parseFloat(document.getElementById('c_valore_totale').value) || 0;
    const qta = parseInt(document.getElementById('c_quantita').value) || 1;
    if (qta > 0) {
        document.getElementById('c_valore_singolo').value = (totale / qta).toFixed(2);
    }
}

async function salvaCredito() {
    const fornitore = document.getElementById('c_fornitore').value.trim();
    if (!fornitore) { mostraToast('⚠️ Inserisci il fornitore'); return; }

    const dati = {
        fornitore: fornitore,
        data_acquisto: document.getElementById('c_data_acquisto').value,
        quantita: parseInt(document.getElementById('c_quantita').value) || 1,
        valore_totale: parseFloat(document.getElementById('c_valore_totale').value) || 0,
        valore_singolo: parseFloat(document.getElementById('c_valore_singolo').value) || 0,
        note: document.getElementById('c_note').value.trim()
    };

    try {
        const res = await fetch('/api/credito', {
            method: 'POST',
            headers: getHeaders('application/json'),
            body: JSON.stringify({ dati: dati })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        mostraToast('✅ Acquisto salvato!');
        setTimeout(() => { tg.close(); }, 1000);
    } catch (e) { mostraToast('❌ Errore: ' + e.message); }
}

function mostraToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => { t.classList.remove('show'); }, 2500);
}

init();
</script>
</body>
</html>
