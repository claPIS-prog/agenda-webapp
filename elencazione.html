<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista Nominativi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body { font-family: -apple-system, Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 15px; }
.container { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
h2 { text-align: center; margin-top: 0; color: #333; }
.search { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 15px; margin-bottom: 15px; }
.item { background: #f9f9f9; padding: 12px; margin: 8px 0; border-radius: 6px; border-left: 4px solid #0088cc; }
.item strong { color: #222; font-size: 15px; }
.item small { color: #666; display: block; margin-top: 4px; }
.empty { text-align: center; color: #888; padding: 30px; }
.error { text-align: center; color: #c62828; padding: 20px; background: #ffebee; border-radius: 6px; }
</style>
</head>
<body>
<div class="container">
<h2>📋 Lista Nominativi</h2>
<input type="text" class="search" id="search" placeholder="Cerca per nome...">
<div id="lista"><div class="empty">Caricamento...</div></div>
</div>
<script>
const tg = window.Telegram.WebApp;
tg.expand();
let contatti = [];

async function carica() {
  const box = document.getElementById('lista');
  try {
    const res = await fetch('/api/contatti', {
      headers: { 'X-Telegram-Init-Data': tg.initData }
    });
    if (!res.ok) {
      box.innerHTML = '<div class="error">Errore server: HTTP ' + res.status + '</div>';
      return;
    }
    contatti = await res.json();
    render();
  } catch (e) {
    box.innerHTML = '<div class="error">Errore: ' + e.message + '</div>';
  }
}

function render(filter) {
  filter = (filter || '').toLowerCase();
  const f = contatti.filter(c => c.nominativo.toLowerCase().includes(filter));
  if (f.length === 0) {
    document.getElementById('lista').innerHTML = '<div class="empty">Nessun nominativo.</div>';
    return;
  }
  document.getElementById('lista').innerHTML = f.map(c =>
    '<div class="item"><strong>' + c.nominativo + '</strong>' +
    '<small>€ ' + (c.prezzo || 0) + ' - ' + (c.cadenza || '') + '</small></div>'
  ).join('');
}

document.getElementById('search').addEventListener('input', e => render(e.target.value));
carica();
</script>
</body>
</html>
