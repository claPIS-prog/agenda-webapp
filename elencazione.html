<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  const API_BASE = ""; 

  async function apiFetch(url, options = {}) {
    const headers = {
      ...options.headers,
      "X-Telegram-Init-Data": tg?.initData || ""
    };
    return fetch(`${API_BASE}${url}`, { ...options, headers });
  }

  async function caricaContatti() {
    try {
      listaDiv.innerHTML = "<div class='empty'>Caricamento...</div>";
      const r = await apiFetch('/api/contatti');
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      contatti = await r.json();
      render(contatti);
    } catch (e) {
      listaDiv.innerHTML = `<div class='empty'>Errore: ${e.message}</div>`;
    }
  }
  // ... il resto del codice uguale
</script>
