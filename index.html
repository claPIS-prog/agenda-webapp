<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuovo Nominativo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body { font-family: -apple-system, Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 15px; }
.container { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
h2 { text-align: center; margin-top: 0; color: #333; }
label { display: block; font-weight: bold; margin: 12px 0 4px; color: #333; font-size: 14px; }
input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 15px; font-family: inherit; }
textarea { resize: vertical; min-height: 80px; }
.row { display: flex; gap: 10px; }
.row > div { flex: 1; }
.btn { width: 100%; padding: 14px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 15px; background: #4caf50; color: white; }
.btn:active { background: #388e3c; }
.section-title { font-size: 13px; color: #0088cc; font-weight: bold; margin: 18px 0 8px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #e0e0e0; padding-bottom: 4px; }
</style>
</head>
<body>
<div class="container">
<h2>📝 Nuovo Nominativo</h2>
<div id="form"></div>
</div>
<script>
const tg = window.Telegram.WebApp;
tg.expand();

let dispositivi = [], sistemiOp = [], buffetts = [], metodiPag = [], procuratori = [], servers = [], resellers = [];

const apkList = [
    "ivuplay (PRIVAT)", "Cricfy V6.7", "SportzX [Mobile] v2.1", "StartApp",
    "Paradise", "Send Files To TV v1.4.22b", "Private Server", "0Player 300626", "XCloud-1.0.15"
];

async function caricaListe() {
    const ok = (r) => r.ok ? r.json() : [];
    try {
        const [d, s, b, m, p, sv, re] = await Promise.all([
            fetch('/api/dispositivi').then(ok),
            fetch('/api/sistemi_operativi').then(ok),
            fetch('/api/buffetts').then(ok),
            fetch('/api/metodi_pagamento').then(ok),
            fetch('/api/procuratori').then(ok),
            fetch('/api/servers').then(ok),
            fetch('/api/resellers').then(ok)
        ]);
        dispositivi = Array.isArray(d) ? d : [];
        sistemiOp = Array.isArray(s) ? s : [];
        buffetts = Array.isArray(b) ? b : [];
        metodiPag = Array.isArray(m) ? m : [];
        procuratori = Array.isArray(p) ? p : [];
        servers = Array.isArray(sv) ? sv : [];
        resellers = Array.isArray(re) ? re : [];
        mostraForm();
    } catch (e) {
        dispositivi = []; sistemiOp = []; buffetts = []; metodiPag = [];
        procuratori = []; servers = []; resellers = [];
        mostraForm();
    }
}

function optSelect(items, placeholder) {
    return '<option value="">' + placeholder + '</option>' + items.map(i => '<option value="' + i.nome + '">' + i.nome + '</option>').join('');
}

function mostraForm() {
    const oggi = new Date().toISOString().split('T')[0];
    document.getElementById('form').innerHTML = 
        '<label>Nominativo:</label><input type="text" id="nominativo" placeholder="Nome e cognome">' +
        '<div class="row"><div><label>User ID:</label><input type="text" id="user_id" placeholder="opzionale"></div><div><label>Password:</label><input type="text" id="password" placeholder="opzionale"></div></div>' +
        '<div class="row"><div><label>Prezzo (€):</label><input type="number" id="prezzo" step="0.01" value="0"></div><div><label>Cadenza:</label><input type="text" id="cadenza" placeholder="es. mensile"></div></div>' +
        '<label>Tipo:</label><input type="text" id="tipo" placeholder="es. TV, Telefono">' +
        '<div class="section-title">Server / Reseller</div>' +
        '<label>Server:</label><select id="server">' + optSelect(servers, '-- Seleziona --') + '</select>' +
        '<label>Reseller:</label><select id="reseller">' + optSelect(resellers, '-- Seleziona --') + '</select>' +
        '<div class="section-title">Dettagli tecnici</div>' +
        '<label>Dispositivo:</label><select id="dispositivo">' + optSelect(dispositivi, '-- Seleziona --') + '</select>' +
        '<label>Sistema Operativo:</label><select id="sistema_operativo">' + optSelect(sistemiOp, '-- Seleziona --') + '</select>' +
        '<label>Buffett:</label><select id="buffett">' + optSelect(buffetts, '-- Seleziona --') + '</select>' +
        '<label>Metodo Pagamento:</label><select id="metodo_pagamento">' + optSelect(metodiPag, '-- Seleziona --') + '</select>' +
        '<div class="section-title">Contatti e riferimenti</div>' +
        '<label>Num Cellulare:</label><input type="tel" id="cellulare" placeholder="opzionale">' +
        '<label>Procuratore:</label><select id="procuratore">' + optSelect(procuratori, '-- Seleziona --') + '</select>' +
        '<label>APK Utilizzata:</label><select id="apk_utilizzata">' + 
            '<option value="">-- Seleziona --</option>' + 
            apkList.map(a => '<option value="' + a + '">' + a + '</option>').join('') + 
        '</select>' +
        '<div class="row"><div><label>Uso VPN:</label><select id="uso_vpn"><option value="0">No</option><option value="1">Sì</option></select></div><div><label>Quale VPN:</label><input type="text" id="quale_vpn" placeholder="se Sì"></div></div>' +
        '<label>Città:</label><input type="text" id="citta" placeholder="opzionale">' +
        '<div class="section-title">Date e note</div>' +
        '<div class="row"><div><label>Data Iscrizione:</label><input type="date" id="data_iscrizione" value="' + oggi + '"></div><div><label>Data Fine:</label><input type="date" id="data_fine"></div></div>' +
        '<label>Informazioni:</label><textarea id="informazioni" placeholder="note aggiuntive..."></textarea>' +
        '<button class="btn" onclick="invia()">Salva Nominativo</button>';
}

async function invia() {
    const nominativo = document.getElementById('nominativo').value.trim();
    if (!nominativo) { tg.showAlert('⚠️ Il nominativo è obbligatorio'); return; }
    const dati = {
        azione: 'nuovo',
        nominativo: nominativo,
        user_id: document.getElementById('user_id').value.trim(),
        password: document.getElementById('password').value.trim(),
        prezzo: parseFloat(document.getElementById('prezzo').value) || 0,
        cadenza: document.getElementById('cadenza').value.trim(),
        tipo: document.getElementById('tipo').value.trim(),
        server: document.getElementById('server').value,
        reseller: document.getElementById('reseller').value,
        dispositivo: document.getElementById('dispositivo').value,
        sistema_operativo: document.getElementById('sistema_operativo').value,
        buffett: document.getElementById('buffett').value,
        metodo_pagamento: document.getElementById('metodo_pagamento').value,
        cellulare: document.getElementById('cellulare').value.trim(),
        procuratore: document.getElementById('procuratore').value,
        apk_utilizzata: document.getElementById('apk_utilizzata').value,
        uso_vpn: document.getElementById('uso_vpn').value === '1' ? 1 : 0,
        quale_vpn: document.getElementById('quale_vpn').value.trim(),
        citta: document.getElementById('citta').value.trim(),
        data_iscrizione: document.getElementById('data_iscrizione').value,
        data_fine: document.getElementById('data_fine').value,
        informazioni: document.getElementById('informazioni').value.trim()
    };
    try {
        const res = await fetch('/api/azione', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ dati: dati })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        tg.showAlert('✅ Nominativo salvato!');
        tg.close();
    } catch (e) {
        tg.showAlert('❌ Errore: ' + e.message);
    }
}

caricaListe();
</script>
</body>
</html>
