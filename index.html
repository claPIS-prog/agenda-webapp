<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuovo Nominativo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body { font-family: -apple-system, Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 15px; }
.container { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
h2 { text-align: center; margin-top: 0; color: #333; }
label { display: block; font-weight: bold; margin: 12px 0 4px; color: #333; font-size: 14px; }
input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 15px; font-family: inherit; }
textarea { resize: vertical; min-height: 80px; }
.row { display: flex; gap: 10px; }
.row > div { flex: 1; }
.btn { width: 100%; padding: 14px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 15px; background: #4caf50; color: white; }
.btn:active { background: #388e3c; }
.section-title { font-size: 13px; color: #0088cc; font-weight: bold; margin: 18px 0 8px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #e0e0e0; padding-bottom: 4px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 24px; border-radius: 6px; z-index: 9999; opacity: 0; transition: opacity 0.3s; font-size: 14px; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
<h2>📝 Nuovo Nominativo</h2>
<div id="form"><div style="text-align:center;color:#888;padding:30px;">Caricamento...</div></div>
</div>
<div class="toast" id="toast"></div>
<script>
const tg = window.Telegram.WebApp;
tg.expand();

let dispositivi = [];
let sistemiOp = [];
let buffetts = [];
let metodiPag = [];
let procuratori = [];
let servers = [];
let resellers = [];
let operatoriIt = [];

const tipiLineaList = ["FIBRA GByte", "FIBRA MByte", "LTE", "ADSL", "CONNESSIONE DATI"];

const apkList = [
    "ivuplay (PRIVAT)", "Cricfy V6.7", "SportzX [Mobile] v2.1", "StartApp",
    "Paradise", "Send Files To TV v1.4.22b", "Private Server", "0Player 300626", "XCloud-1.0.15"
];

const cadenzeList = ["TEST", "MENSILE", "BIMENSILE", "TRIMESTRALE", "SEMESTRALE", "ANNUALE"];

async function caricaListe() {
    const ok = async (url) => {
        try {
            const res = await fetch(url);
            if (!res.ok) return [];
            const data = await res.json();
            return Array.isArray(data) ? data : [];
        } catch (e) { return []; }
    };
    
    dispositivi = await ok('/api/dispositivi');
    sistemiOp = await ok('/api/sistemi_operativi');
    buffetts = await ok('/api/buffett');
    metodiPag = await ok('/api/metodi_pagamento');
    procuratori = await ok('/api/procuratori');
    servers = await ok('/api/servers');
    resellers = await ok('/api/resellers');
    operatoriIt = await ok('/api/operatori_it');
    
    mostraForm();
}

function optSelect(items, placeholder, campo) {
    let html = '<option value="">' + placeholder + '</option>';
    for (let i = 0; i < items.length; i++) {
        const val = items[i][campo] || '';
        html += '<option value="' + val + '">' + val + '</option>';
    }
    return html;
}

function optSelectStatic(items, placeholder) {
    let html = '<option value="">' + placeholder + '</option>';
    for (let i = 0; i < items.length; i++) {
        html += '<option value="' + items[i] + '">' + items[i] + '</option>';
    }
    return html;
}

function mostraForm() {
    const oggi = new Date().toISOString().split('T')[0];
    
    let html = '';
    html += '<label>Nominativo:</label><input type="text" id="nominativo" placeholder="Nome e cognome">';
    html += '<div class="row"><div><label>User ID:</label><input type="text" id="user_id" placeholder="opzionale"></div>';
    html += '<div><label>Password:</label><input type="text" id="password" placeholder="opzionale"></div></div>';
    html += '<div class="row"><div><label>Prezzo (€):</label><input type="number" id="prezzo" step="0.01" value="0"></div>';
    html += '<div><label>Cadenza:</label><select id="cadenza">' + optSelectStatic(cadenzeList, '-- Seleziona --') + '</select></div></div>';
    
    html += '<label>Tipo Linea:</label><select id="tipo">' + optSelectStatic(tipiLineaList, '-- Seleziona --') + '</select>';
    html += '<label>Operatore IT:</label><select id="operatore_it">' + optSelect(operatoriIt, '-- Seleziona --', 'nome') + '</select>';
    
    html += '<div class="section-title">Server / Reseller</div>';
    html += '<label>Server:</label><select id="server">' + optSelect(servers, '-- Seleziona --', 'nominativo') + '</select>';
    html += '<label>Reseller:</label><select id="reseller">' + optSelect(resellers, '-- Seleziona --', 'nominativo') + '</select>';
    
    html += '<div class="section-title">Dettagli tecnici</div>';
    html += '<label>Dispositivo:</label><select id="dispositivo">' + optSelect(dispositivi, '-- Seleziona --', 'nome') + '</select>';
    html += '<label>Sistema Operativo:</label><select id="sistema_operativo">' + optSelect(sistemiOp, '-- Seleziona --', 'nome') + '</select>';
    html += '<label>Buffett:</label><select id="buffett">' + optSelect(buffetts, '-- Seleziona --', 'nome') + '</select>';
    html += '<label>Metodo Pagamento:</label><select id="metodo_pagamento">' + optSelect(metodiPag, '-- Seleziona --', 'nome') + '</select>';
    
    html += '<div class="section-title">Contatti e riferimenti</div>';
    html += '<label>Num Cellulare:</label><input type="tel" id="cellulare" placeholder="opzionale">';
    html += '<label>Procuratore:</label><select id="procuratore">' + optSelect(procuratori, '-- Seleziona --', 'nominativo') + '</select>';
    html += '<label>APK Utilizzata:</label><select id="apk_utilizzata">';
    html += '<option value="">-- Seleziona --</option>';
    for (let i = 0; i < apkList.length; i++) {
        html += '<option value="' + apkList[i] + '">' + apkList[i] + '</option>';
    }
    html += '</select>';
    html += '<div class="row"><div><label>Uso VPN:</label><select id="uso_vpn"><option value="0">No</option><option value="1">Sì</option></select></div>';
    html += '<div><label>Quale VPN:</label><input type="text" id="quale_vpn" placeholder="se Sì"></div></div>';
    html += '<label>Città:</label><input type="text" id="citta" placeholder="opzionale">';
    
    html += '<div class="section-title">Date e note</div>';
    html += '<div class="row"><div><label>Data Iscrizione:</label><input type="date" id="data_iscrizione" value="' + oggi + '"></div>';
    html += '<div><label>Data Fine:</label><input type="date" id="data_fine"></div></div>';
    html += '<label>Informazioni:</label><textarea id="informazioni" placeholder="note aggiuntive..."></textarea>';
    html += '<button class="btn" onclick="invia()">Salva Nominativo</button>';
    
    document.getElementById('form').innerHTML = html;
}

function mostraToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => { t.classList.remove('show'); }, 2500);
}

async function invia() {
    const nominativo = document.getElementById('nominativo').value.trim();
    if (!nominativo) {
        mostraToast('⚠️ Il nominativo è obbligatorio');
        return;
    }
    
    const dati = {
        azione: 'nuovo',
        nominativo: nominativo,
        user_id: document.getElementById('user_id').value.trim(),
        password: document.getElementById('password').value.trim(),
        prezzo: parseFloat(document.getElementById('prezzo').value) || 0,
        cadenza: document.getElementById('cadenza').value,
        tipo: document.getElementById('tipo').value,
        operatore_it: document.getElementById('operatore_it').value,
        server: document.getElementById('server').value,
        reseller: document.getElementById('reseller').value,
        dispositivo: document.getElementById('dispositivo').value,
        sistema_operativo: document.getElementById('sistema_operativo').value,
        buffett: document.getElementById('buffett').value,
        metodo_pagamento: document.getElementById('metodo_pagamento').value,
        cellulare: document.getElementById('cellulare').value.trim(),
        procuratore: document.getElementById('procuratore').value,
        apk_utilizzata: document.getElementById('apk_utilizzata').value,
        uso_vpn: document.getElementById('uso_vpn').value === '1' ? 1 : 0,
        quale_vpn: document.getElementById('quale_vpn').value.trim(),
        citta: document.getElementById('citta').value.trim(),
        data_iscrizione: document.getElementById('data_iscrizione').value,
        data_fine: document.getElementById('data_fine').value,
        informazioni: document.getElementById('informazioni').value.trim()
    };
    
    try {
        const res = await fetch('/api/azione', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ dati: dati })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        mostraToast('✅ Nominativo salvato!');
        setTimeout(() => tg.close(), 1500);
    } catch (e) {
        mostraToast('❌ Errore: ' + e.message);
    }
}

caricaListe();
</script>
</body>
</html>
