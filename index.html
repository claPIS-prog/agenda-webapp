<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuovo Nominativo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body { font-family: -apple-system, Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 15px; }
.container { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
h2 { text-align: center; margin-top: 0; color: #333; }
label { display: block; font-weight: bold; margin: 12px 0 4px; color: #333; font-size: 14px; }
input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 15px; }
.row { display: flex; gap: 10px; }
.row > div { flex: 1; }
.btn { width: 100%; padding: 14px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 15px; background: #4caf50; color: white; }
.btn:active { background: #388e3c; }
</style>
</head>
<body>
<div class="container">
<h2>📝 Nuovo Nominativo</h2>
<div id="form"></div>
</div>
<script>
const tg = window.Telegram.WebApp;
tg.expand();

let dispositivi = [], sistemiOp = [], buffetts = [], metodiPag = [];

async function caricaListe() {
  try {
    const [d, s, b, m] = await Promise.all([
      fetch('/api/dispositivi').then(r => r.json()),
      fetch('/api/sistemi_operativi').then(r => r.json()),
      fetch('/api/buffetts').then(r => r.json()),
      fetch('/api/metodi_pagamento').then(r => r.json())
    ]);
    dispositivi = d || [];
    sistemiOp = s || [];
    buffetts = b || [];
    metodiPag = m || [];
    mostraForm();
  } catch (e) {
    document.getElementById('form').innerHTML = '<div style="color:red;text-align:center;padding:20px;">Errore caricamento liste: ' + e.message + '</div>';
  }
}

function mostraForm() {
  const optDispositivi = '<option value="">-- Seleziona --</option>' + dispositivi.map(d => '<option value="' + d.nome + '">' + d.nome + '</option>').join('');
  const optSistemiOp = '<option value="">-- Seleziona --</option>' + sistemiOp.map(s => '<option value="' + s.nome + '">' + s.nome + '</option>').join('');
  const optBuffett = '<option value="">-- Seleziona --</option>' + buffetts.map(b => '<option value="' + b.nome + '">' + b.nome + '</option>').join('');
  const optMetodiPag = '<option value="">-- Seleziona --</option>' + metodiPag.map(m => '<option value="' + m.nome + '">' + m.nome + '</option>').join('');

  document.getElementById('form').innerHTML = 
    '<label>Nominativo:</label><input type="text" id="nominativo" placeholder="Nome e cognome">' +
    '<div class="row"><div><label>Prezzo (€):</label><input type="number" id="prezzo" step="0.01" value="0"></div><div><label>Cadenza:</label><input type="text" id="cadenza" placeholder="es. mensile"></div></div>' +
    '<label>Tipo:</label><input type="text" id="tipo" placeholder="es. TV, Telefono">' +
    '<div class="row"><div><label>Server:</label><input type="text" id="server" placeholder="opzionale"></div><div><label>Reseller:</label><input type="text" id="reseller" placeholder="opzionale"></div></div>' +
    '<label>Dispositivo:</label><select id="dispositivo">' + optDispositivi + '</select>' +
    '<label>Sistema Operativo:</label><select id="sistema_operativo">' + optSistemiOp + '</select>' +
    '<label>Buffett:</label><select id="buffett">' + optBuffett + '</select>' +
    '<label>Metodo Pagamento:</label><select id="metodo_pagamento">' + optMetodiPag + '</select>' +
    '<button class="btn" onclick="invia()">Salva Nominativo</button>';
}

async function invia() {
  const nominativo = document.getElementById('nominativo').value.trim();
  if (!nominativo) {
    tg.showAlert('⚠️ Il nominativo è obbligatorio');
    return;
  }
  const dati = {
    azione: 'nuovo',
    nominativo: nominativo,
    prezzo: parseFloat(document.getElementById('prezzo').value) || 0,
    cadenza: document.getElementById('cadenza').value.trim(),
    tipo: document.getElementById('tipo').value.trim(),
    server: document.getElementById('server').value.trim(),
    reseller: document.getElementById('reseller').value.trim(),
    dispositivo: document.getElementById('dispositivo').value,
    sistema_operativo: document.getElementById('sistema_operativo').value,
    buffett: document.getElementById('buffett').value,
    metodo_pagamento: document.getElementById('metodo_pagamento').value
  };
  try {
    const res = await fetch('/api/azione', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dati: dati })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    tg.showAlert('✅ Nominativo salvato!');
    tg.close();
  } catch (e) {
    tg.showAlert('❌ Errore: ' + e.message);
  }
}

caricaListe();
</script>
</body>
</html>
