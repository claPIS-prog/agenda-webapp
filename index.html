<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuovo Nominativo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f5f5f5;
  }
  body {
    padding: 16px;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  h2 {
    text-align: center;
    margin: 0 0 16px;
    color: #333333;
    font-size: 20px;
  }
  .section-box {
    background: #fafafa;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .section-title {
    font-size: 12px;
    font-weight: bold;
    color: #0088cc;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .form-group {
    margin-bottom: 12px;
  }
  .form-group:last-child {
    margin-bottom: 0;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    color: #444444;
    margin-bottom: 6px;
  }
  input, select, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    font-size: 14px;
    background: #ffffff;
    color: #222222;
  }
  textarea {
    min-height: 76px;
    resize: vertical;
  }
  .row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 600px) {
    .row-2 {
      grid-template-columns: 1fr;
    }
  }
  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    color: #ffffff;
    background: #2e7d32;
    margin-top: 6px;
  }
  .btn-secondary {
    background: #607d8b;
    margin-top: 10px;
  }
  .btn:active {
    opacity: 0.85;
  }
  .msg {
    margin-top: 14px;
    padding: 12px;
    border-radius: 6px;
    font-size: 13px;
    display: none;
  }
  .msg.ok {
    display: block;
    background: #e8f5e9;
    color: #1b5e20;
    border: 1px solid #a5d6a7;
  }
  .msg.err {
    display: block;
    background: #ffebee;
    color: #b71c1c;
    border: 1px solid #ef9a9a;
  }
</style>
</head>
<body>
<div class="container">
  <h2>📝 Nuovo Nominativo</h2>

  <form id="formNuovoNominativo">
    <div class="section-box">
      <div class="section-title">Dati Principali</div>
      <div class="form-group">
        <label for="nominativo">Nominativo</label>
        <input type="text" id="nominativo" name="nominativo" placeholder="Nome e cognome" required>
      </div>

      <div class="row-2">
        <div class="form-group">
          <label for="tipo">Tipo</label>
          <select id="tipo" name="tipo">
            <option value="">-- Seleziona --</option>
            <option value="Nuovo">Nuovo</option>
            <option value="Rinnovo">Rinnovo</option>
            <option value="Omaggio">Omaggio</option>
          </select>
        </div>
        <div class="form-group">
          <label for="telefono">Num Cellulare</label>
          <input type="text" id="telefono" name="telefono" placeholder="Numero di cellulare">
        </div>
      </div>

      <div class="row-2">
        <div class="form-group">
          <label for="user_id">User ID</label>
          <input type="text" id="user_id" name="user_id" placeholder="Opzionale">
        </div>
        <div class="form-group">
          <label for="password_utente">Password</label>
          <input type="text" id="password_utente" name="password_utente" placeholder="Opzionale">
        </div>
      </div>

      <div class="row-2">
        <div class="form-group">
          <label for="prezzo">Prezzo (€)</label>
          <input type="number" step="0.01" id="prezzo" name="prezzo" value="0">
        </div>
        <div class="form-group">
          <label for="cadenza">Cadenza</label>
          <select id="cadenza" name="cadenza">
            <option value="">-- Seleziona --</option>
            <option value="Mensile">Mensile</option>
            <option value="Trimestrale">Trimestrale</option>
            <option value="Semestrale">Semestrale</option>
            <option value="Annuale">Annuale</option>
          </select>
        </div>
      </div>
    </div>

    <div class="section-box">
      <div class="section-title">Linea, Dispositivi e Gestione</div>
      <div class="row-2">
        <div class="form-group">
          <label for="tipo_linea">Tipo Linea</label>
          <select id="tipo_linea" name="tipo_linea">
            <option value="">-- Seleziona --</option>
            <option value="IPTV">IPTV</option>
            <option value="VOD">VOD</option>
            <option value="Combo">Combo</option>
          </select>
        </div>
        <div class="form-group">
          <label for="operatore_it">Operatore IT</label>
          <select id="operatore_it" name="operatore_it">
            <option value="">-- Seleziona --</option>
          </select>
        </div>
      </div>

      <div class="row-2">
        <div class="form-group">
          <label for="server">Server</label>
          <select id="server" name="server">
            <option value="">-- Seleziona --</option>
          </select>
        </div>
        <div class="form-group">
          <label for="reseller">Reseller</label>
          <select id="reseller" name="reseller">
            <option value="">-- Seleziona --</option>
          </select>
        </div>
      </div>

      <div class="row-2">
        <div class="form-group">
          <label for="dispositivo">Dispositivo</label>
          <select id="dispositivo" name="dispositivo">
            <option value="">-- Seleziona --</option>
          </select>
        </div>
        <div class="form-group">
          <label for="sistema_operativo">Sistema Operativo</label>
          <select id="sistema_operativo" name="sistema_operativo">
            <option value="">-- Seleziona --</option>
          </select>
        </div>
      </div>

      <div class="row-2">
        <div class="form-group">
          <label for="buffett">Buffett</label>
          <select id="buffett" name="buffett">
            <option value="">-- Seleziona --</option>
          </select>
        </div>
        <div class="form-group">
          <label for="metodo_pagamento">Metodo Pagamento</label>
          <select id="metodo_pagamento" name="metodo_pagamento">
            <option value="">-- Seleziona --</option>
          </select>
        </div>
      </div>

      <div class="row-2">
        <div class="form-group">
          <label for="procuratore">Procuratore</label>
          <select id="procuratore" name="procuratore">
            <option value="">-- Seleziona --</option>
          </select>
        </div>
        <div class="form-group">
          <label for="citta">Città</label>
          <input type="text" id="citta" name="citta" placeholder="Città">
        </div>
      </div>
    </div>

    <div class="section-box">
      <div class="section-title">Date e Note</div>
      <div class="row-2">
        <div class="form-group">
          <label for="data_iscrizione">Data Iscrizione</label>
          <input type="date" id="data_iscrizione" name="data_iscrizione">
        </div>
        <div class="form-group">
          <label for="data_fine">Data Fine</label>
          <input type="date" id="data_fine" name="data_fine">
        </div>
      </div>

      <div class="form-group">
        <label for="informazioni">Informazioni</label>
        <textarea id="informazioni" name="informazioni" placeholder="Note aggiuntive..."></textarea>
      </div>
    </div>

    <button type="submit" class="btn">💾 Salva Nominativo</button>
    <button type="button" id="btnVaiLista" class="btn btn-secondary" onclick="vaiListaContatti()">📋 Vai a Lista</button>
  </form>

  <div id="msgBox" class="msg"></div>
</div>

<script>
  try {
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.expand();
    }
  } catch (e) {}

  function getAuthHeaders() {
    const headers = { "Content-Type": "application/json" };
    try {
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) {
        headers["X-Telegram-Init-Data"] = window.Telegram.WebApp.initData;
      }
    } catch (e) {}
    return headers;
  }

  function vaiListaContatti() {
    window.location.href = "/elencazione.html?t=" + Date.now();
  }

  function mostraMessaggio(testo, ok) {
    const box = document.getElementById("msgBox");
    box.textContent = testo;
    box.className = "msg " + (ok ? "ok" : "err");
  }

  async function popolaSelect(selectId, endpoints) {
    const sel = document.getElementById(selectId);
    if (!sel) return;
    const urls = Array.isArray(endpoints) ? endpoints : [endpoints];
    for (const url of urls) {
      try {
        const res = await fetch(url, { headers: getAuthHeaders() });
        if (!res.ok) continue;
        const raw = await res.json();
        const items = Array.isArray(raw)
          ? raw
          : (raw && (raw.righe || raw.items || raw.data || raw.results)) || [];
        const visti = new Set(Array.from(sel.options).map((o) => o.value));
        items.forEach((it) => {
          const val = typeof it === "string"
            ? it
            : (it && (it.nome || it.valore || it.descrizione || it.procuratore || it.server || it.reseller || it.operatore || it.dispositivo || it.sistema_operativo || it.buffett || it.metodo || "")) || "";
          const testo = String(val).trim();
          if (testo && !visti.has(testo)) {
            visti.add(testo);
            const opt = document.createElement("option");
            opt.value = testo;
            opt.textContent = testo;
            sel.appendChild(opt);
          }
        });
        if (items.length > 0) return;
      } catch (e) {}
    }
  }

  async function caricaTabelle() {
    const oggi = new Date().toISOString().slice(0, 10);
    const dataIscr = document.getElementById("data_iscrizione");
    if (dataIscr && !dataIscr.value) dataIscr.value = oggi;

    await Promise.all([
      popolaSelect("dispositivo", ["/api/dispositivi", "/api/dispositivo"]),
      popolaSelect("sistema_operativo", ["/api/sistemi_operativi", "/api/sistema_operativo", "/api/so"]),
      popolaSelect("buffett", ["/api/buffett", "/api/buffet"]),
      popolaSelect("metodo_pagamento", ["/api/metodi_pagamento"]),
      popolaSelect("procuratore", ["/api/procuratori", "/api/procuratore"]),
      popolaSelect("server", ["/api/servers", "/api/server"]),
      popolaSelect("reseller", ["/api/resellers", "/api/reseller"]),
      popolaSelect("operatore_it", ["/api/operatori_it", "/api/operatori", "/api/operatore_it", "/api/operatore"])
    ]);
  }

  document.getElementById("formNuovoNominativo").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    const nominativoVal = document.getElementById("nominativo").value.trim();
    if (!nominativoVal) {
      mostraMessaggio("Inserisci un nominativo prima di salvare.", false);
      return;
    }

    const payload = {
      nominativo: nominativoVal,
      nome: nominativoVal,
      tipo: document.getElementById("tipo").value,
      telefono: document.getElementById("telefono").value.trim(),
      cellulare: document.getElementById("telefono").value.trim(),
      user_id: document.getElementById("user_id").value.trim(),
      password: document.getElementById("password_utente").value.trim(),
      prezzo: parseFloat(document.getElementById("prezzo").value || "0") || 0,
      cadenza: document.getElementById("cadenza").value,
      tipo_linea: document.getElementById("tipo_linea").value,
      operatore_it: document.getElementById("operatore_it").value,
      server: document.getElementById("server").value,
      reseller: document.getElementById("reseller").value,
      dispositivo: document.getElementById("dispositivo").value,
      sistema_operativo: document.getElementById("sistema_operativo").value,
      buffett: document.getElementById("buffett").value,
      metodo_pagamento: document.getElementById("metodo_pagamento").value,
      procuratore: document.getElementById("procuratore").value,
      citta: document.getElementById("citta").value.trim(),
      data_iscrizione: document.getElementById("data_iscrizione").value,
      data: document.getElementById("data_iscrizione").value,
      data_fine: document.getElementById("data_fine").value,
      informazioni: document.getElementById("informazioni").value.trim(),
      note: document.getElementById("informazioni").value.trim()
    };

    const endpoints = ["/api/contatti", "/api/nominativi"];
    let salvato = false;
    let ultimoErrore = "Errore durante il salvataggio del nominativo";

    for (const url of endpoints) {
      try {
        const res = await fetch(url, {
          method: "POST",
          headers: getAuthHeaders(),
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          salvato = true;
          break;
        }
        if (res.status !== 404 && res.status !== 405) {
          const txt = await res.text();
          ultimoErrore = `Errore HTTP ${res.status}: ${txt || url}`;
          break;
        }
      } catch (e) {
        ultimoErrore = "Errore di rete: " + e.message;
      }
    }

    if (salvato) {
      mostraMessaggio("Nominativo salvato correttamente. Puoi aprire Lista Contatti.", true);
      document.getElementById("nominativo").value = "";
      document.getElementById("telefono").value = "";
      document.getElementById("user_id").value = "";
      document.getElementById("password_utente").value = "";
      document.getElementById("citta").value = "";
      document.getElementById("informazioni").value = "";
    } else {
      mostraMessaggio(ultimoErrore, false);
    }
  });

  caricaTabelle();
</script>
</body>
</html>
