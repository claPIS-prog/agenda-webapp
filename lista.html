<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista Nominativi</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; padding: 16px; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
    input { width: 100%; padding: 12px; margin-bottom: 16px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: var(--tg-theme-secondary-bg-color, #f9f9f9); }
    .name { font-weight: bold; font-size: 1.1em; margin-bottom: 4px; }
    .info { color: #666; font-size: 0.9em; margin-bottom: 2px; }
    .empty { text-align: center; color: #999; margin-top: 40px; }
    .actions { display: flex; gap: 8px; margin-top: 10px; }
    .btn-mod { flex: 1; padding: 8px; background: #1769aa; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-del { flex: 1; padding: 8px; background: #d32f2f; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <h1>📋 Lista Nominativi</h1>
  
  <input type="text" id="search" placeholder="Cerca per nome o userId..." oninput="filtra()">
  
  <div id="lista"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const params = new URLSearchParams(window.location.search);
    let contatti = [];
    try {
      contatti = JSON.parse(params.get("contatti") || "[]");
    } catch (e) { console.error(e); }

    const listaDiv = document.getElementById("lista");
    const searchInput = document.getElementById("search");

    function render(lista) {
      listaDiv.innerHTML = "";
      if (lista.length === 0) {
        listaDiv.innerHTML = "<div class='empty'>Nessun nominativo trovato.</div>";
        return;
      }
      lista.forEach(c => {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <div class="name">${c.nominativo}</div>
          <div class="info">🆔 ${c.user_id || '-'}</div>
          <div class="info">💶 ${c.prezzo || 0}€ / ${c.cadenza || '-'}</div>
          <div class="actions">
            <button class="btn-mod" onclick="modifica(${c.id})">✏️ Modifica</button>
            <button class="btn-del" onclick="cancella(${c.id}, '${c.nominativo}')">🗑️ Cancella</button>
          </div>
        `;
        listaDiv.appendChild(div);
      });
    }

    function modifica(id) {
      // Reindirizza alla pagina di modifica passando l'ID
      window.location.href = `modifica.html?id=${id}`;
    }

    function cancella(id, nome) {
      if (confirm(`Sei sicuro di voler cancellare definitivamente ${nome}?`)) {
        const tg = window.Telegram?.WebApp;
        if (tg) {
          tg.sendData(JSON.stringify({ azione: "cancella", id: id }));
        }
      }
    }

    function filtra() {
      const q = searchInput.value.toLowerCase();
      const filtrati = contatti.filter(c => 
        (c.nominativo && c.nominativo.toLowerCase().includes(q)) || 
        (c.user_id && c.user_id.toLowerCase().includes(q))
      );
      render(filtrati);
    }

    render(contatti);
  </script>
</body>
</html>
