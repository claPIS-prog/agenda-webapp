<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista Contatti</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/auth.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f5f5f5;
  }
  body {
    padding: 16px;
  }
  .container {
    max-width: 780px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  h2 {
    text-align: center;
    margin: 0 0 6px;
    color: #333333;
    font-size: 20px;
  }
  .badge-wrap {
    text-align: center;
    margin-bottom: 16px;
  }
  .badge {
    display: inline-block;
    background: #0088cc;
    color: #ffffff;
    font-size: 12px;
    font-weight: bold;
    padding: 4px 10px;
    border-radius: 999px;
  }
  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .search-input {
    flex: 1;
    min-width: 200px;
    padding: 10px 12px;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    font-size: 14px;
  }
  .btn {
    padding: 10px 14px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    color: #ffffff;
    background: #0088cc;
  }
  .btn-green {
    background: #2e7d32;
  }
  .empty-box {
    text-align: center;
    padding: 28px 16px;
    color: #666666;
    font-size: 14px;
    background: #fafafa;
    border: 1px dashed #d0d7de;
    border-radius: 8px;
  }
  .card-item {
    border: 1px solid #e0e0e0;
    border-left: 4px solid #0088cc;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
    background: #fcfcfc;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-weight: bold;
    color: #222222;
    margin-bottom: 6px;
  }
  .card-meta {
    font-size: 13px;
    color: #555555;
    line-height: 1.45;
  }
</style>
</head>
<body>
<div class="container">
  <h2>📋 Lista Contatti</h2>
  <div class="badge-wrap"><span class="badge" id="badgeCount">Totale: 0</span></div>

  <div class="toolbar">
    <input type="text" id="filtroContatto" class="search-input" placeholder="Cerca per nominativo, telefono o email..." oninput="applicaFiltro()">
    <button type="button" class="btn" onclick="caricaContatti()">🔄 Aggiorna</button>
    <button type="button" class="btn btn-green" onclick="vaiNuovoNominativo()">➕ Nuovo Nominativo</button>
  </div>

  <div id="listaContainer"></div>
</div>

<script>
  let tuttiContatti = [];

  try {
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.expand();
    }
  } catch (e) {}

  function getAuthHeaders() {
    const headers = { "Content-Type": "application/json" };
    try {
      if (typeof window.getAuthHeaders === "function" && window.getAuthHeaders !== getAuthHeaders) {
        Object.assign(headers, window.getAuthHeaders());
      } else if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) {
        headers["X-Telegram-Init-Data"] = window.Telegram.WebApp.initData;
      }
    } catch (e) {}
    return headers;
  }

  function vaiNuovoNominativo() {
    window.location.href = "/nominativo.html?t=" + Date.now();
  }

  function estraiArray(data) {
    if (Array.isArray(data)) return data;
    if (data && typeof data === "object") {
      for (const k of ["righe", "items", "nominativi", "contatti", "clienti", "data", "results"]) {
        if (Array.isArray(data[k])) return data[k];
      }
    }
    return [];
  }

  function renderLista(items) {
    const box = document.getElementById("listaContainer");
    const badge = document.getElementById("badgeCount");
    if (badge) badge.textContent = `Totale: ${items.length}`;

    if (!items.length) {
      box.innerHTML = '<div class="empty-box">Nessun contatto trovato</div>';
      return;
    }

    box.innerHTML = items.map((it) => {
      if (typeof it === "string") {
        return `
          <div class="card-item">
            <div class="card-top"><span>${it}</span></div>
          </div>
        `;
      }
      const nom = it.nominativo || it.nome || it.cliente || "Senza nominativo";
      const tel = it.telefono || it.cellulare || "-";
      const mail = it.email || "-";
      const proc = it.procuratore ? ` &nbsp;|&nbsp; <strong>Procuratore:</strong> ${String(it.procuratore)}` : "";
      const stato = it.stato ? ` &nbsp;|&nbsp; <strong>Stato:</strong> ${String(it.stato)}` : "";
      const note = it.note ? `<br><strong>Note:</strong> ${String(it.note)}` : "";
      return `
        <div class="card-item">
          <div class="card-top">
            <span>${String(nom)}</span>
            <span>${String(tel)}</span>
          </div>
          <div class="card-meta">
            <strong>Email:</strong> ${String(mail)}${proc}${stato}${note}
          </div>
        </div>
      `;
    }).join("");
  }

  function applicaFiltro() {
    const q = (document.getElementById("filtroContatto").value || "").trim().toLowerCase();
    if (!q) {
      renderLista(tuttiContatti);
      return;
    }
    const filtrati = tuttiContatti.filter((it) => {
      if (typeof it === "string") return it.toLowerCase().includes(q);
      const blob = [it.nominativo, it.nome, it.cliente, it.telefono, it.cellulare, it.email, it.procuratore, it.note]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();
      return blob.includes(q);
    });
    renderLista(filtrati);
  }

  async function caricaContatti() {
    const box = document.getElementById("listaContainer");
    box.innerHTML = '<div class="empty-box">Caricamento contatti...</div>';

    const urls = ["/api/nominativi", "/api/contatti", "/api/clienti"];
    for (const url of urls) {
      try {
        const res = await fetch(url, { headers: getAuthHeaders() });
        if (!res.ok) continue;
        const json = await res.json();
        const arr = estraiArray(json);
        if (arr.length > 0 || url === "/api/nominativi") {
          tuttiContatti = arr;
          applicaFiltro();
          return;
        }
      } catch (e) {}
    }

    tuttiContatti = [];
    renderLista([]);
  }

  caricaContatti();
</script>
</body>
</html>
