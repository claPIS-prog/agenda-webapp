<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista Rinnovi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/auth.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f5f5f5;
  }
  body {
    padding: 16px;
  }
  .container {
    max-width: 780px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  h2 {
    text-align: center;
    margin: 0 0 6px;
    color: #333333;
    font-size: 20px;
  }
  .badge-wrap {
    text-align: center;
    margin-bottom: 16px;
  }
  .badge {
    display: inline-block;
    background: #0088cc;
    color: #ffffff;
    font-size: 12px;
    font-weight: bold;
    padding: 4px 10px;
    border-radius: 999px;
  }
  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .search-input {
    flex: 1;
    min-width: 200px;
    padding: 10px 12px;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    font-size: 14px;
  }
  .btn {
    padding: 10px 14px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    color: #ffffff;
    background: #0088cc;
  }
  .btn-green {
    background: #2e7d32;
  }
  .empty-box {
    text-align: center;
    padding: 28px 16px;
    color: #666666;
    font-size: 14px;
    background: #fafafa;
    border: 1px dashed #d0d7de;
    border-radius: 8px;
  }
  .card-item {
    border: 1px solid #e0e0e0;
    border-left: 4px solid #0088cc;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
    background: #fcfcfc;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-weight: bold;
    color: #222222;
    margin-bottom: 6px;
  }
  .card-meta {
    font-size: 13px;
    color: #555555;
    line-height: 1.45;
  }
</style>
</head>
<body>
<div class="container">
  <h2>📋 Lista Rinnovi</h2>
  <div class="badge-wrap"><span class="badge">Rinnovi</span></div>

  <div class="toolbar">
    <input type="text" id="filtroNominativo" class="search-input" placeholder="Cerca per nominativo..." oninput="applicaFiltro()">
    <button type="button" class="btn" onclick="caricaRinnovi()">🔄 Aggiorna</button>
    <button type="button" class="btn btn-green" onclick="vaiNuovoRinnovo()">➕ Nuovo Rinnovo</button>
  </div>

  <div id="listaContainer"></div>
</div>

<script>
  let tuttiRinnovi = [];

  try {
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.expand();
    }
  } catch (e) {}

  function getAuthHeaders() {
    const headers = { "Content-Type": "application/json" };
    try {
      if (typeof window.getAuthHeaders === "function" && window.getAuthHeaders !== getAuthHeaders) {
        Object.assign(headers, window.getAuthHeaders());
      } else if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) {
        headers["X-Telegram-Init-Data"] = window.Telegram.WebApp.initData;
      }
    } catch (e) {}
    return headers;
  }

  function vaiNuovoRinnovo() {
    window.location.href = "/rinnovi.html?t=" + Date.now();
  }

  function estraiArray(data) {
    if (Array.isArray(data)) return data;
    if (data && typeof data === "object") {
      for (const k of ["righe", "items", "rinnovi", "data", "results"]) {
        if (Array.isArray(data[k])) return data[k];
      }
    }
    return [];
  }

  function eRinnovo(item) {
    if (!item || typeof item !== "object") return false;
    const campi = [item.tipo, item.categoria, item.operazione, item.voce, item.stato];
    const testo = campi.filter(Boolean).join(" ").toLowerCase();
    if (!testo) return true;
    return testo.includes("rinnov");
  }

  function renderLista(items) {
    const box = document.getElementById("listaContainer");
    if (!items.length) {
      box.innerHTML = '<div class="empty-box">Nessun rinnovo trovato</div>';
      return;
    }

    box.innerHTML = items.map((it) => {
      const nom = it.nominativo || it.nome || it.cliente || "Senza nominativo";
      const dataOp = it.data || it.data_operazione || it.created_at || "-";
      const scad = it.scadenza || it.data_scadenza || "-";
      const imp = (it.importo !== undefined && it.importo !== null && it.importo !== "")
        ? `${it.importo} €`
        : "-";
      const metodo = it.metodo_pagamento || it.pagamento || "-";
      const note = it.note ? `<br><strong>Note:</strong> ${String(it.note)}` : "";
      return `
        <div class="card-item">
          <div class="card-top">
            <span>${String(nom)}</span>
            <span>${String(imp)}</span>
          </div>
          <div class="card-meta">
            <strong>Data:</strong> ${String(dataOp)} &nbsp;|&nbsp;
            <strong>Scadenza:</strong> ${String(scad)} &nbsp;|&nbsp;
            <strong>Pagamento:</strong> ${String(metodo)}${note}
          </div>
        </div>
      `;
    }).join("");
  }

  function applicaFiltro() {
    const q = (document.getElementById("filtroNominativo").value || "").trim().toLowerCase();
    if (!q) {
      renderLista(tuttiRinnovi);
      return;
    }
    const filtrati = tuttiRinnovi.filter((it) => {
      const nom = String(it.nominativo || it.nome || it.cliente || "").toLowerCase();
      const note = String(it.note || "").toLowerCase();
      return nom.includes(q) || note.includes(q);
    });
    renderLista(filtrati);
  }

  async function caricaRinnovi() {
    const box = document.getElementById("listaContainer");
    box.innerHTML = '<div class="empty-box">Caricamento rinnovi...</div>';

    const urls = [
      "/api/rinnovi",
      "/api/calcoli?tipo=Rinnovo",
      "/api/calcoli/lista?tipo=Rinnovo",
      "/api/calcoli",
      "/api/calcoli/lista"
    ];

    for (const url of urls) {
      try {
        const res = await fetch(url, { headers: getAuthHeaders() });
        if (!res.ok) continue;
        const json = await res.json();
        const raw = estraiArray(json);
        const filtrati = raw.filter(eRinnovo);
        if (filtrati.length > 0 || url.includes("rinnovi") || url.includes("tipo=Rinnovo")) {
          tuttiRinnovi = filtrati;
          applicaFiltro();
          return;
        }
      } catch (e) {}
    }

    tuttiRinnovi = [];
    renderLista([]);
  }

  caricaRinnovi();
</script>
</body>
</html>
