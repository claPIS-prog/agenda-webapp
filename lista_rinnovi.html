<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lista Rinnovi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Usiamo lo stesso auth.js se necessario, altrimenti rimuovi -->
    <script src="/auth.js?v=2"></script> 
    <style>
        /* STILI IDENTICI A ELENCAZIONE.HTML */
        :root {
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #000000;
            --tg-theme-hint-color: #999999;
            --tg-theme-link-color: #2481cc;
            --tg-theme-button-color: #2481cc;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-secondary-bg-color: #f4f4f5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-secondary-bg-color);
            margin: 0;
            padding: 0;
            color: var(--tg-theme-text-color);
            -webkit-tap-highlight-color: transparent;
        }

        .header {
            background-color: var(--tg-theme-bg-color);
            padding: 10px 15px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-container {
            flex-grow: 1;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 8px 10px 8px 35px;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
            background-color: #f1f1f1;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            color: var(--tg-theme-text-color);
        }

        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 14px;
            pointer-events: none;
        }

        .list-container {
            padding-bottom: 20px;
        }

        .item {
            background-color: var(--tg-theme-bg-color);
            padding: 12px 15px;
            border-bottom: 1px solid #efeff4;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .item:active {
            background-color: #f0f0f0;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #555;
            font-size: 16px;
            margin-right: 12px;
            flex-shrink: 0;
            text-transform: uppercase;
        }

        .content {
            flex-grow: 1;
            overflow: hidden;
        }

        .name {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--tg-theme-text-color);
        }

        .subtitle {
            font-size: 14px;
            color: var(--tg-theme-hint-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 600;
            margin-left: 10px;
            white-space: nowrap;
        }

        .badge-nuovo { background-color: #fff3cd; color: #856404; }
        .badge-rinnovo { background-color: #d4edda; color: #155724; }
        .badge-scaduto { background-color: #f8d7da; color: #721c24; }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--tg-theme-hint-color);
        }

        /* Loading overlay */
        #loading {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            font-weight: bold;
            color: var(--tg-theme-link-color);
        }
    </style>
</head>
<body>

    <div id="loading">Caricamento...</div>

    <div class="header">
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="Cerca nominativo...">
        </div>
    </div>

    <div id="listContainer" class="list-container">
        <!-- Items will be injected here -->
    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    
    // Adatta i colori al tema Telegram
    document.documentElement.style.setProperty('--tg-theme-bg-color', tg.themeParams.bg_color || '#ffffff');
    document.documentElement.style.setProperty('--tg-theme-text-color', tg.themeParams.text_color || '#000000');
    document.documentElement.style.setProperty('--tg-theme-hint-color', tg.themeParams.hint_color || '#999999');
    document.documentElement.style.setProperty('--tg-theme-secondary-bg-color', tg.themeParams.secondary_bg_color || '#f4f4f5');

    let allData = [];

    async function fetchData() {
        try {
            const response = await fetch('/api/lista_rinnovi?nocache=' + Date.now());
            if (!response.ok) throw new Error('Network response was not ok');
            
            const data = await response.json();
            allData = data || [];
            
            renderList(allData);
            document.getElementById('loading').style.display = 'none';
            
        } catch (error) {
            console.error('Error:', error);
            document.getElementById('loading').innerHTML = `Errore: ${error.message}<br><button onclick="location.reload()">Riprova</button>`;
        }
    }

    function getInitials(name) {
        if (!name) return '?';
        const parts = name.split(' ');
        if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
        return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    function renderList(items) {
        const container = document.getElementById('listContainer');
        container.innerHTML = '';

        if (items.length === 0) {
            container.innerHTML = '<div class="empty-state">Nessun rinnovo trovato.</div>';
            return;
        }

        items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'item';
            
            // Determina tipo badge
            let badgeClass = 'badge-rinnovo';
            let badgeText = 'RINNOVO';
            const tipo = (item.tipo || '').toLowerCase();
            if (tipo.includes('nuovo')) {
                badgeClass = 'badge-nuovo';
                badgeText = 'NUOVO';
            } else if (tipo.includes('scad')) {
                badgeClass = 'badge-scaduto';
                badgeText = 'SCADUTO';
            }

            // Formatta date
            const dataOp = item.data_operazione ? String(item.data_operazione).substring(0, 10) : '';
            const scad = item.scadenza ? String(item.scadenza).substring(0, 10) : '';
            const subtitle = `${dataOp} | Scad: ${scad}`;

            div.innerHTML = `
                <div class="avatar">${getInitials(item.nominativo)}</div>
                <div class="content">
                    <div class="name">${item.nominativo || 'Sconosciuto'}</div>
                    <div class="subtitle">${subtitle}</div>
                </div>
                <div class="badge ${badgeClass}">${badgeText}</div>
            `;
            
            // Azione al click (esempio: apri modal o dettaglio)
            div.onclick = () => {
                // Qui puoi mettere la logica per aprire il dettaglio
                // tg.showPopup({ title: item.nominativo, message: subtitle });
                console.log('Clicked:', item.id);
            };

            container.appendChild(div);
        });
    }

    // Search Filter
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = allData.filter(item => 
            (item.nominativo && item.nominativo.toLowerCase().includes(term)) ||
            (item.note && item.note.toLowerCase().includes(term))
        );
        renderList(filtered);
    });

    // Init
    fetchData();
</script>
</body>
</html>
