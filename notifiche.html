<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestione Notifiche</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/auth.js"></script>
<style>
body { font-family: -apple-system, Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 15px; }
.container { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
h2 { text-align: center; margin-top: 0; color: #333; }
.counter { text-align: center; background: #0088cc; color: white; padding: 8px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; margin: 0 auto 15px; display: inline-block; }
.counter-wrapper { text-align: center; }
.info-box { background: #e3f2fd; border-left: 4px solid #0088cc; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 13px; color: #333; }
.info-box ul { margin: 5px 0 0 20px; padding: 0; }
.info-box li { margin: 3px 0; }
.status-box { background: #e8f5e9; border-left: 4px solid #4caf50; padding: 10px 15px; border-radius: 6px; margin-bottom: 20px; text-align: center; font-weight: bold; color: #2e7d32; font-size: 14px; }
.status-box.off { background: #ffebee; border-left-color: #f44336; color: #c62828; }
label { display: block; font-weight: bold; margin: 15px 0 8px; color: #333; font-size: 14px; }
.time-row { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
.time-row select { flex: 0 0 80px; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 15px; text-align: center; }
.time-row .separator { font-size: 20px; font-weight: bold; color: #333; }
.toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #f9f9f9; border-radius: 6px; border-left: 4px solid #0088cc; margin-bottom: 20px; }
.toggle-row span { font-weight: bold; color: #333; font-size: 14px; }
.switch { position: relative; display: inline-block; width: 50px; height: 26px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
.slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
input:checked + .slider { background-color: #4caf50; }
input:checked + .slider:before { transform: translateX(24px); }
.btn { width: 100%; padding: 14px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
.btn-save { background: #4caf50; color: white; }
.btn-save:active { background: #388e3c; }
.btn-test { background: #ff9800; color: white; }
.btn-test:active { background: #f57c00; }
.error { text-align: center; color: #c62828; padding: 20px; background: #ffebee; border-radius: 6px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 24px; border-radius: 6px; z-index: 9999; opacity: 0; transition: opacity 0.3s; font-size: 14px; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
<h2>🔔 Gestione Notifiche</h2>
<div class="counter-wrapper"><div class="counter" id="counter">Configurazione</div></div>

<div class="info-box">
<strong>ℹ️ Informazioni:</strong>
<ul>
<li>Le notifiche controllano le scadenze nei prossimi 7 giorni</li>
<li>L'orario è in UTC (+1 inverno, +2 estate per Italia)</li>
<li>Le modifiche si applicano immediatamente</li>
</ul>
</div>

<div id="status_box" class="status-box">Caricamento...</div>

<label>⏰ Orario di invio (UTC):</label>
<div class="time-row">
<select id="ora"></select>
<span class="separator">:</span>
<select id="minuto"></select>
</div>

<div class="toggle-row">
<span>🔔 Notifiche attive:</span>
<label class="switch">
<input type="checkbox" id="attivo">
<span class="slider"></span>
</label>
</div>

<button class="btn btn-save" onclick="salva()">💾 Salva Configurazione</button>
<button class="btn btn-test" onclick="inviaTest()">🧪 Invia Notifica di Test</button>
</div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram.WebApp; tg.expand();

// Header di autenticazione Telegram (OBBLIGATORIO per le API protette)
function getHeaders(contentType) {
    const headers = {};
    if (contentType) headers['Content-Type'] = contentType;
    const initData = tg.initData;
    if (initData) headers['X-Telegram-Init-Data'] = initData;
    return headers;
}

// Popola select ora (0-23)
const selOra = document.getElementById('ora');
for (let i = 0; i < 24; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = i.toString().padStart(2, '0');
    selOra.appendChild(opt);
}

// Popola select minuto (0, 15, 30, 45)
const selMin = document.getElementById('minuto');
[0, 15, 30, 45].forEach(m => {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m.toString().padStart(2, '0');
    selMin.appendChild(opt);
});

async function carica() {
    try {
        const res = await fetch('/api/config_notifiche', { headers: getHeaders() });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        
        selOra.value = data.ora || 7;
        selMin.value = data.minuto || 0;
        document.getElementById('attivo').checked = data.attivo !== false;
        
        aggiornaStato(data.attivo !== false, data.ora, data.minuto);
    } catch (e) {
        document.getElementById('status_box').className = 'status-box off';
        document.getElementById('status_box').textContent = '❌ Errore caricamento: ' + e.message;
    }
}

function aggiornaStato(attivo, ora, minuto) {
    const box = document.getElementById('status_box');
    if (attivo) {
        box.className = 'status-box';
        box.textContent = '✅ Attive - prossimo invio ' + ora.toString().padStart(2,'0') + ':' + minuto.toString().padStart(2,'0') + ' UTC';
    } else {
        box.className = 'status-box off';
        box.textContent = '⛔ Notifiche disattivate';
    }
}

function mostraToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}

async function salva() {
    const ora = parseInt(selOra.value);
    const minuto = parseInt(selMin.value);
    const attivo = document.getElementById('attivo').checked;
    
    try {
        const res = await fetch('/api/config_notifiche', {
            method: 'POST',
            headers: getHeaders('application/json'),
            body: JSON.stringify({ ora: ora, minuto: minuto, attivo: attivo })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        aggiornaStato(attivo, ora, minuto);
        mostraToast('✅ Configurazione salvata!');
    } catch (e) {
        mostraToast('❌ Errore: ' + e.message);
    }
}

async function inviaTest() {
    const btn = document.querySelector('.btn-test');
    btn.disabled = true;
    btn.textContent = '⏳ Invio in corso...';
    
    try {
        const res = await fetch('/api/notifica_test', {
            method: 'POST',
            headers: getHeaders('application/json'),
            body: JSON.stringify({})
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        
        // Mostra il risultato dettagliato
        let msg = '✅ ' + data.message;
        if (data.dettagli && data.dettagli.length > 0) {
            msg += '\n\n' + data.dettagli.join('\n');
        }
        alert(msg);
        mostraToast('✅ ' + data.message);
    } catch (e) {
        mostraToast('❌ Errore: ' + e.message);
    } finally {
        btn.disabled = false;
        btn.textContent = '🧪 Invia Notifica di Test';
    }
}

carica();
</script>
</body>
</html>
