<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestione Notifiche</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body { font-family: -apple-system, Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 15px; }
.container { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
h2 { text-align: center; margin-top: 0; color: #333; }
.info { background: #e3f2fd; border-left: 4px solid #2196f3; padding: 12px; border-radius: 5px; margin: 15px 0; font-size: 13px; color: #1565c0; }
label { display: block; font-weight: bold; margin: 15px 0 5px; color: #333; }
.time-row { display: flex; align-items: center; gap: 10px; }
.time-row input { width: 70px; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; text-align: center; }
.time-row span { font-size: 22px; font-weight: bold; }
.toggle-row { display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; padding: 12px; border-radius: 5px; margin: 15px 0; }
.switch { position: relative; display: inline-block; width: 50px; height: 28px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; inset: 0; background: #ccc; border-radius: 28px; transition: .3s; }
.slider:before { content: ""; position: absolute; height: 22px; width: 22px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: .3s; }
input:checked + .slider { background: #4caf50; }
input:checked + .slider:before { transform: translateX(22px); }
button { width: 100%; padding: 14px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
.btn-save { background: #0088cc; color: white; }
.btn-test { background: #ff9800; color: white; }
.status { text-align: center; padding: 10px; border-radius: 5px; font-weight: bold; margin-top: 10px; }
.status.on { background: #e8f5e9; color: #2e7d32; }
.status.off { background: #ffebee; color: #c62828; }
</style>
</head>
<body>
<div class="container">
<h2>🔔 Gestione Notifiche</h2>
<div class="info">• Le notifiche controllano le scadenze nei prossimi 7 giorni<br>• L'orario è in UTC (+1 inverno, +2 estate per l'Italia)<br>• Le modifiche si applicano immediatamente</div>
<div id="statusBox" class="status"></div>
<label>⏰ Orario di invio (UTC):</label>
<div class="time-row">
<input type="number" id="ora" min="0" max="23" placeholder="Ora">
<span>:</span>
<input type="number" id="minuto" min="0" max="59" placeholder="Min">
</div>
<div class="toggle-row">
<span>🔔 Notifiche attive:</span>
<label class="switch"><input type="checkbox" id="attivo"><span class="slider"></span></label>
</div>
<button class="btn-save" onclick="salva()">💾 Salva Configurazione</button>
<button class="btn-test" onclick="test()">🧪 Invia Notifica di Test</button>
</div>
<script>
const tg = window.Telegram.WebApp;
tg.expand();
let cfg = { ora: 7, minuto: 0, attivo: true };
try {
  const params = new URLSearchParams(window.location.search);
  const raw = params.get('config');
  if (raw) cfg = JSON.parse(decodeURIComponent(raw));
} catch(e) {}
document.getElementById('ora').value = cfg.ora;
document.getElementById('minuto').value = cfg.minuto;
document.getElementById('attivo').checked = cfg.attivo;
aggiornaStatus();
function aggiornaStatus() {
  const box = document.getElementById('statusBox');
  const attivo = document.getElementById('attivo').checked;
  const o = document.getElementById('ora').value;
  const m = document.getElementById('minuto').value;
  if (attivo) {
    box.className = 'status on';
    box.textContent = '✅ Attive - prossimo invio ' + String(o).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ' UTC';
  } else {
    box.className = 'status off';
    box.textContent = '❌ Disattivate';
  }
}
document.getElementById('attivo').addEventListener('change', aggiornaStatus);
document.getElementById('ora').addEventListener('input', aggiornaStatus);
document.getElementById('minuto').addEventListener('input', aggiornaStatus);
function salva() {
  const ora = parseInt(document.getElementById('ora').value);
  const minuto = parseInt(document.getElementById('minuto').value);
  const attivo = document.getElementById('attivo').checked;
  if (isNaN(ora) || isNaN(minuto) || ora < 0 || ora > 23 || minuto < 0 || minuto > 59) {
    tg.showAlert('⚠️ Orario non valido'); return;
  }
  tg.sendData(JSON.stringify({ azione: 'aggiorna_config', ora: ora, minuto: minuto, attivo: attivo }));
}
function test() { tg.sendData(JSON.stringify({ azione: 'test_notifica' })); }
</script>
</body>
</html>
