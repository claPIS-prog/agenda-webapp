<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Permessi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .btn-config {
            display: block;
            margin: 0 auto 20px;
            padding: 10px 20px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-config:hover { background: #2980b9; }
        
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 13px;
            color: #555;
        }
        select, input[type="date"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        .date-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .module-list {
            margin-top: 20px;
        }
        .module-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            margin-bottom: 8px;
            background: #fafafa;
        }
        .module-name {
            font-size: 14px;
            font-weight: 500;
        }
        .toggle {
            position: relative;
            width: 50px;
            height: 26px;
        }
        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 26px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #27ae60; }
        input:checked + .slider:before { transform: translateX(24px); }
        
        .btn-save {
            width: 100%;
            padding: 12px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn-save:hover { background: #229954; }
        .btn-save:disabled { background: #95a5a6; cursor: not-allowed; }
        
        .error-msg {
            background: #e74c3c;
            color: white;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            display: none;
        }
        .success-msg {
            background: #27ae60;
            color: white;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔐 Gestione Permessi</h2>
        
        <button class="btn-config" onclick="caricaUtenti()">⚙️ Configurazione</button>
        
        <div class="form-group">
            <label for="utente-select">Seleziona Utente:</label>
            <select id="utente-select" onchange="caricaPermessi()">
                <option value="">-- Seleziona --</option>
            </select>
        </div>
        
        <div class="date-row">
            <div class="form-group">
                <label for="data-inizio">Data Inizio Validità</label>
                <input type="date" id="data-inizio">
            </div>
            <div class="form-group">
                <label for="data-revoca">Data Revoca</label>
                <input type="date" id="data-revoca">
            </div>
        </div>
        
        <div class="form-group">
            <label for="data-fine">Data Fine Validità</label>
            <input type="date" id="data-fine">
        </div>
        
        <div class="module-list" id="module-list">
            <!-- Moduli caricati dinamicamente -->
        </div>
        
        <button class="btn-save" id="btn-save" onclick="salvaPermessi()" disabled>
            💾 Salva Permessi
        </button>
        
        <div class="error-msg" id="error-msg"></div>
        <div class="success-msg" id="success-msg"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const ALL_MODULES = [
            "nominativo", "lista", "scadenze", "rinnovi", "storico_rinnovi",
            "saldo_rinnovi", "reseller", "procuratori", "server", "nota",
            "credenziali", "permessi", "dispositivi", "sistemi_op", "buffett",
            "pagamenti", "operatori_it", "tabelle", "crediti", "calcoli"
        ];
        
        const MODULE_LABELS = {
            "nominativo": "📝 Nuovo Nominativo",
            "lista": "📋 Lista Contatti",
            "scadenze": "⏰ Scadenze",
            "rinnovi": "🔄 Nuovo Rinnovo",
            "storico_rinnovi": "📜 Storico Rinnovi",
            "saldo_rinnovi": "💰 Saldo Rinnovi",
            "reseller": "🏢 Reseller",
            "procuratori": "👥 Procuratori",
            "server": "🖥️ Server",
            "nota": "💬 Note",
            "credenziali": "🔑 Credenziali",
            "permessi": "🔐 Permessi",
            "dispositivi": "📱 Dispositivi",
            "sistemi_op": "⚙️ Sistemi Operativi",
            "buffett": "🍽️ Buffett",
            "pagamenti": "💳 Pagamenti",
            "operatori_it": "📡 Operatori IT",
            "tabelle": "🗂️ Tabelle",
            "crediti": "💎 Crediti",
            "calcoli": "📊 Calcoli"
        };
        
        let utenti = [];
        let permessiCorrenti = {};
        
        async function caricaUtenti() {
            try {
                const res = await fetch('/api/amici');
                if (!res.ok) throw new Error('Errore caricamento utenti');
                utenti = await res.json();
                
                const select = document.getElementById('utente-select');
                select.innerHTML = '<option value="">-- Seleziona --</option>';
                utenti.forEach(u => {
                    const opt = document.createElement('option');
                    opt.value = u.id;
                    opt.textContent = u.nome;
                    select.appendChild(opt);
                });
            } catch (e) {
                showError('Errore: ' + e.message);
            }
        }
        
        async function caricaPermessi() {
            const userId = document.getElementById('utente-select').value;
            if (!userId) {
                document.getElementById('btn-save').disabled = true;
                document.getElementById('module-list').innerHTML = '';
                return;
            }
            
            try {
                const res = await fetch(`/api/permessi/${userId}`);
                if (!res.ok) throw new Error('Errore caricamento permessi');
                const data = await res.json();
                
                permessiCorrenti = data.permessi;
                
                // Carica date
                if (data.date) {
                    document.getElementById('data-inizio').value = data.date.data_inizio_validita || '';
                    document.getElementById('data-revoca').value = data.date.data_revoca || '';
                    document.getElementById('data-fine').value = data.date.data_fine_validita || '';
                }
                
                // Renderizza moduli
                renderModuli();
                document.getElementById('btn-save').disabled = false;
            } catch (e) {
                showError('Errore: ' + e.message);
            }
        }
        
        function renderModuli() {
            const container = document.getElementById('module-list');
            container.innerHTML = '';
            
            ALL_MODULES.forEach(mod => {
                const item = document.createElement('div');
                item.className = 'module-item';
                
                const label = document.createElement('span');
                label.className = 'module-name';
                label.textContent = MODULE_LABELS[mod] || mod;
                
                const toggle = document.createElement('label');
                toggle.className = 'toggle';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = permessiCorrenti[mod] || false;
                checkbox.onchange = (e) => {
                    permessiCorrenti[mod] = e.target.checked;
                };
                
                const slider = document.createElement('span');
                slider.className = 'slider';
                
                toggle.appendChild(checkbox);
                toggle.appendChild(slider);
                item.appendChild(label);
                item.appendChild(toggle);
                container.appendChild(item);
            });
        }
        
        async function salvaPermessi() {
            const userId = document.getElementById('utente-select').value;
            if (!userId) {
                showError('Seleziona un utente');
                return;
            }
            
            const btn = document.getElementById('btn-save');
            btn.disabled = true;
            btn.textContent = '⏳ Salvataggio...';
            
            try {
                const payload = {
                    user_id: parseInt(userId),
                    permessi: permessiCorrenti,
                    data_inizio_validita: document.getElementById('data-inizio').value,
                    data_revoca: document.getElementById('data-revoca').value,
                    data_fine_validita: document.getElementById('data-fine').value
                };
                
                const res = await fetch('/api/salva_permessi', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || 'Errore salvataggio');
                }
                
                showSuccess('✅ Permessi salvati con successo!');
                setTimeout(() => hideMessages(), 3000);
            } catch (e) {
                showError('❌ ' + e.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '💾 Salva Permessi';
            }
        }
        
        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('success-msg').style.display = 'none';
        }
        
        function showSuccess(msg) {
            const el = document.getElementById('success-msg');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('error-msg').style.display = 'none';
        }
        
        function hideMessages() {
            document.getElementById('error-msg').style.display = 'none';
            document.getElementById('success-msg').style.display = 'none';
        }
        
        // Carica utenti all'avvio
        caricaUtenti();
    </script>
</body>
</html>
