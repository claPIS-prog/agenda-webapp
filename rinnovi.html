<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuovo Rinnovo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body { font-family: -apple-system, Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 15px; }
.container { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
h2 { text-align: center; margin-top: 0; color: #333; }
label { display: block; font-weight: bold; margin: 12px 0 4px; color: #333; font-size: 14px; }
input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 15px; }
.row { display: flex; gap: 10px; }
.row > div { flex: 1; }
.scadenza-preview { background: #e8f5e9; color: #2e7d32; padding: 10px; border-radius: 5px; text-align: center; font-weight: bold; margin-top: 10px; }
button { width: 100%; padding: 14px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 15px; background: #4caf50; color: white; }
button:active { background: #388e3c; }
.empty { text-align: center; color: #888; padding: 30px; }
.error { text-align: center; color: #c62828; padding: 20px; background: #ffebee; border-radius: 6px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 6px; z-index: 200; opacity: 0; transition: opacity 0.3s; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
<h2>🔄 Nuovo Rinnovo</h2>
<div id="form"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const tg = window.Telegram.WebApp;
tg.expand();
let nominativi = [];

async function caricaNominativi() {
  const form = document.getElementById('form');
  try {
    const res = await fetch('/api/nominativi');
    if (!res.ok) {
      form.innerHTML = '<div class="error">Errore server: HTTP ' + res.status + '</div>';
      return;
    }
    nominativi = await res.json();
    if (!Array.isArray(nominativi) || nominativi.length === 0) {
      form.innerHTML = '<div class="empty">Nessun nominativo disponibile.</div>';
      return;
    }
    const options = nominativi.map(n => '<option value="' + n.id + '">' + n.nominativo + '</option>').join('');
    form.innerHTML = '<label>Seleziona Nominativo:</label><select id="nominativo_id">' + options + '</select><label>Tipo Rinnovo:</label><select id="tipo"><option value="rinnovo">Rinnovo</option><option value="nuovo">Nuovo</option><option value="cambio">Cambio</option></select><label>Data Operazione:</label><input type="date" id="data_operazione" value="' + new Date().toISOString().split('T')[0] + '"><div class="row"><div><label>Mesi:</label><input type="number" id="mesi" min="1" max="12" value="12"></div><div><label>Orario Scadenza:</label><input type="time" id="orario_scadenza" value="00:00"></div></div><div class="row"><div><label>Acconto (€):</label><input type="number" id="importo_acconto" step="0.01" value="0"></div><div><label>Saldo (€):</label><input type="number" id="importo_saldo" step="0.01" value="0"></div></div><label>Note:</label><input type="text" id="note" placeholder="opzionale"><div class="scadenza-preview" id="scadenzaPreview"></div><button onclick="invia()">Registra Rinnovo</button>';
    ['data_operazione','mesi'].forEach(id => document.getElementById(id).addEventListener('input', calcolaScadenza));
    calcolaScadenza();
  } catch (e) {
    form.innerHTML = '<div class="error">Errore: ' + e.message + '</div>';
  }
}

function calcolaScadenza() {
  const d = document.getElementById('data_operazione').value;
  const m = parseInt(document.getElementById('mesi').value) || 0;
  if (!d || m < 1) return;
  const dt = new Date(d);
  const newDate = new Date(dt.getFullYear(), dt.getMonth() + m, dt.getDate());
  const s = newDate.toLocaleDateString('it-IT');
  const o = document.getElementById('orario_scadenza').value;
  document.getElementById('scadenzaPreview').textContent = 'Scadenza: ' + s + ' ore ' + o;
  document.getElementById('scadenzaPreview').dataset.scadenza = s;
}

async function invia() {
  const data = {
    azione: 'nuovo_rinnovo',
    nominativo_id: parseInt(document.getElementById('nominativo_id').value),
    tipo: document.getElementById('tipo').value,
    data_operazione: document.getElementById('data_operazione').value,
    mesi: parseInt(document.getElementById('mesi').value),
    scadenza: document.getElementById('scadenzaPreview').dataset.scadenza || '',
    orario_scadenza: document.getElementById('orario_scadenza').value,
    importo_acconto: parseFloat(document.getElementById('importo_acconto').value) || 0,
    importo_saldo: parseFloat(document.getElementById('importo_saldo').value) || 0,
    note: document.getElementById('note').value
  };
  if (!data.nominativo_id) {
    mostraToast('⚠️ Seleziona un nominativo');
    return;
  }
  if (!data.data_operazione) {
    mostraToast('⚠️ Inserisci la data');
    return;
  }
  try {
    const res = await fetch('/api/rinnovo', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dati: data })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    mostraToast('✅ Rinnovo registrato!');
    setTimeout(() => tg.close(), 1500);
  } catch (e) {
    mostraToast('❌ Errore: ' + e.message);
  }
}

function mostraToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

caricaNominativi();
</script>
</body>
