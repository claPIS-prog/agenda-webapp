<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuovo Rinnovo</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; font: 16px/1.5 system-ui, sans-serif; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #17212b); }
    h1 { font-size: 1.3rem; margin-bottom: 16px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .row.full { grid-template-columns: 1fr; }
    label { display: block; font-size: 0.85rem; margin-bottom: 4px; opacity: 0.8; }
    input, select, textarea { width: 100%; min-height: 44px; padding: 8px; font: inherit; border: 1px solid #88939d; border-radius: 8px; background: var(--tg-theme-secondary-bg-color, #f4f4f5); color: inherit; }
    button { width: 100%; min-height: 50px; margin-top: 16px; font: inherit; font-weight: bold; border: none; border-radius: 8px; background: var(--tg-theme-button-color, #1769aa); color: var(--tg-theme-button-text-color, #fff); }
    #status { margin-top: 12px; text-align: center; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>🔄 Nuovo Rinnovo</h1>
  <form id="form">
    <div class="row full">
      <div>
        <label>Seleziona Nominativo *</label>
        <select id="nominativo" required>
          <option value="">— Scegli —</option>
        </select>
      </div>
    </div>
    
    <div class="row">
      <div>
        <label>Tipo *</label>
        <select id="tipo" required>
          <option value="rinnovo">Rinnovo</option>
          <option value="nuovo">Nuovo</option>
        </select>
      </div>
      <div><label>Data Operazione</label><input id="data_operazione" type="date"></div>
    </div>
    
    <div class="row">
      <div><label>Mesi (1-12)</label><input id="mesi" type="number" min="1" max="12" value="1"></div>
      <div><label>Scadenza calcolata</label><input id="scadenza" readonly style="background:#e0e0e0;"></div>
    </div>
    
    <div class="row">
      <div><label>Importo Acconto (€)</label><input id="importo_acconto" type="number" step="0.01" value="0"></div>
      <div><label>Importo Saldo (€)</label><input id="importo_saldo" type="number" step="0.01" value="0"></div>
    </div>
    
    <div class="row full">
      <div><label>Note</label><textarea id="note" rows="3"></textarea></div>
    </div>
    
    <button type="submit">💾 Registra Rinnovo</button>
    <p id="status"></p>
  </form>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const params = new URLSearchParams(window.location.search);
    let nominativi = [];
    try {
      nominativi = JSON.parse(params.get("nominativi") || "[]");
    } catch (e) { console.error(e); }

    const selectNom = document.getElementById("nominativo");
    
    nominativi.forEach(n => {
      const opt = document.createElement("option");
      opt.value = n.id;
      opt.textContent = n.nominativo;
      selectNom.appendChild(opt);
    });

    const oggi = new Date().toISOString().split('T')[0];
    document.getElementById("data_operazione").value = oggi;

    function calcolaScadenza() {
      const dataOp = document.getElementById("data_operazione").value;
      const mesi = parseInt(document.getElementById("mesi").value) || 0;
      if (!dataOp || !mesi) return;
      
      const dt = new Date(dataOp);
      dt.setMonth(dt.getMonth() + mesi);
      
      const gg = String(dt.getDate()).padStart(2, '0');
      const mm = String(dt.getMonth() + 1).padStart(2, '0');
      const aaaa = dt.getFullYear();
      
      document.getElementById("scadenza").value = `${gg}/${mm}/${aaaa}`;
    }

    document.getElementById("data_operazione").addEventListener("change", calcolaScadenza);
    document.getElementById("mesi").addEventListener("input", calcolaScadenza);
    calcolaScadenza();

    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      
      const dati = {
        nominativo_id: document.getElementById("nominativo").value,
        tipo: document.getElementById("tipo").value,
        data_operazione: document.getElementById("data_operazione").value,
        mesi: parseInt(document.getElementById("mesi").value),
        scadenza: document.getElementById("scadenza").value,
        importo_acconto: parseFloat(document.getElementById("importo_acconto").value) || 0,
        importo_saldo: parseFloat(document.getElementById("importo_saldo").value) || 0,
        note: document.getElementById("note").value.trim()
      };

      if (!dati.nominativo_id) {
        document.getElementById("status").textContent = "Seleziona un nominativo!";
        return;
      }
      
      if (!tg) {
        document.getElementById("status").textContent = "Apri questa pagina dal bot Telegram";
        return;
      }
      
      tg.sendData(JSON.stringify(dati));
      document.getElementById("status").textContent = "Inviato! Chiudi questa finestra.";
    });
  </script>
</body>
</html>
