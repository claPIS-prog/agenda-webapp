<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuovo Rinnovo</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; padding: 16px; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
    input, select { width: 100%; padding: 12px; margin-bottom: 16px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
    label { font-weight: bold; display: block; margin-bottom: 5px; }
    button { width: 100%; padding: 14px; background: #1769aa; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:disabled { background: #ccc; }
  </style>
</head>
<body>
  <h1>🔄 Nuovo Rinnovo</h1>
  
  <label>Seleziona Nominativo:</label>
  <select id="nominativo"></select>

  <label>Tipo Rinnovo:</label>
  <input type="text" id="tipo" value="rinnovo">

  <label>Data Operazione (gg/mm/aaaa):</label>
  <input type="date" id="data_operazione">

  <label>Mesi (1-12):</label>
  <input type="number" id="mesi" min="1" max="12" value="1">

  <label>Importo Acconto (€):</label>
  <input type="number" id="acconto" step="0.01" value="0">

  <label>Importo Saldo (€):</label>
  <input type="number" id="saldo" step="0.01" value="0">

  <button id="btnSalva" onclick="salvaRinnovo()">Registra Rinnovo</button>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }
    const API_BASE = ""; 

    // Imposta la data di oggi di default
    document.getElementById("data_operazione").valueAsDate = new Date();

    async function caricaNominativi() {
      try {
        const r = await fetch(`${API_BASE}/api/nominativi`);
        const lista = await r.json();
        const select = document.getElementById("nominativo");
        select.innerHTML = '<option value="">-- Scegli --</option>';
        lista.forEach(n => {
          select.innerHTML += `<option value="${n.id}">${n.nominativo}</option>`;
        });
      } catch (e) {
        alert("Errore nel caricamento nominativi: " + e.message);
      }
    }

    async function salvaRinnovo() {
      const btn = document.getElementById("btnSalva");
      btn.disabled = true;
      btn.innerText = "Salvataggio in corso...";

      const nomId = document.getElementById("nominativo").value;
      const dataOp = document.getElementById("data_operazione").value;
      const mesi = parseInt(document.getElementById("mesi").value);
      
      if (!nomId || !dataOp) {
        alert("Seleziona un nominativo e una data.");
        btn.disabled = false;
        btn.innerText = "Registra Rinnovo";
        return;
      }

      // Calcolo scadenza (stessa logica del bot)
      const dataObj = new Date(dataOp);
      dataObj.setMonth(dataObj.getMonth() + mesi);
      const scadenzaStr = dataObj.toLocaleDateString('it-IT'); // gg/mm/aaaa

      const payload = {
        dati: {
          nominativo_id: nomId,
          tipo: document.getElementById("tipo").value,
          data_operazione: dataOp,
          mesi: mesi,
          scadenza: scadenzaStr,
          importo_acconto: document.getElementById("acconto").value,
          importo_saldo: document.getElementById("saldo").value
        }
      };

      try {
        const r = await fetch(`${API_BASE}/api/rinnovo`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        alert("✅ Rinnovo registrato con successo!\nNuova scadenza: " + scadenzaStr);
        if (tg) tg.close(); // Chiude la WebApp
      } catch (e) {
        alert("Errore: " + e.message);
        btn.disabled = false;
        btn.innerText = "Registra Rinnovo";
      }
    }

    caricaNominativi();
  </script>
</body>
</html>
