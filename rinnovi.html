<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuovo Rinnovo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/auth.js"></script>
<style>
body { font-family: -apple-system, Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 15px; }
.container { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); max-width: 500px; margin: 0 auto; }
h2 { text-align: center; margin-top: 0; color: #333; }
label { display: block; font-weight: bold; margin: 10px 0 4px; color: #333; font-size: 13px; }
input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 14px; font-family: inherit; }
.row { display: flex; gap: 8px; }
.row > div { flex: 1; }
.section-title { font-size: 12px; color: #0088cc; font-weight: bold; margin: 14px 0 6px; text-transform: uppercase; border-bottom: 1px solid #e0e0e0; padding-bottom: 3px; }
.btn-save { width: 100%; background: #4caf50; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 24px; border-radius: 6px; z-index: 9999; opacity: 0; transition: opacity 0.3s; font-size: 14px; }
.toast.show { opacity: 1; }
small { color: #666; display: block; margin-top: 4px; font-size: 12px; }
</style>
</head>
<body>
<div class="container">
<h2>🔄 Nuovo Rinnovo</h2>

<label>Nominativo:</label>
<select id="r_nominativo_id"><option value="">-- Caricamento --</option></select>

<div class="section-title">Dettagli Rinnovo</div>
<div class="row">
    <div><label>Tipo:</label><select id="r_tipo"><option value="rinnovo">🔄 Rinnovo</option><option value="nuovo">🆕 Nuovo</option><option value="omaggio">🎁 Omaggio</option></select></div>
    <div><label>Data Operazione:</label><input type="date" id="r_data_operazione"></div>
</div>

<div class="row">
    <div><label>Mesi:</label><input type="number" id="r_mesi" value="12"></div>
    <!-- (E) Formato data uguale a data operazione -->
    <div><label>Scadenza:</label><input type="date" id="r_scadenza"></div>
</div>

<div class="row">
    <div><label>Importo Acconto (€):</label><input type="number" step="0.01" id="r_importo_acconto" value="0"></div>
    <div><label>Importo Saldo (€):</label><input type="number" step="0.01" id="r_importo_saldo" value="0"></div>
</div>

<div class="section-title">🎫 Utilizzo Credito</div>
<label>Credito da utilizzare:</label>
<!-- (C/E) Listbox che legge contatore crediti -->
<select id="r_credito_id">
    <option value="">-- Nessun credito --</option>
</select>
<small>Seleziona se usare saldo storico o nuovo acquisto</small>

<div class="row">
    <div><label>Num Crediti Richiesti:</label><input type="number" id="r_num_credito_rich" value="0"></div>
    <div><label>Valore Singolo NC (€):</label><input type="number" step="0.01" id="r_val_singolo_nc_rich" value="0"></div>
</div>

<label>Note:</label>
<textarea id="r_note" style="min-height: 60px;"></textarea>

<button class="btn-save" onclick="salvaRinnovo()">💾 Salva Rinnovo</button>
</div>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

function getHeaders(contentType) {
    const headers = {};
    if (contentType) headers['Content-Type'] = contentType;
    const initData = tg.initData;
    if (initData) headers['X-Telegram-Init-Data'] = initData;
    return headers;
}

async function init() {
    // Carica Nominativi
    try {
        const res = await fetch('/api/nominativi', { headers: getHeaders() });
        const noms = await res.json();
        const sel = document.getElementById('r_nominativo_id');
        sel.innerHTML = '<option value="">-- Seleziona --</option>';
        noms.forEach(n => {
            sel.innerHTML += `<option value="${n.id}">${n.nominativo}</option>`;
        });
    } catch(e) { console.error(e); }

    // Imposta data odierna
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('r_data_operazione').value = today;
    document.getElementById('r_scadenza').value = today; // Default scadenza = oggi

    // Carica Crediti Disponibili
    try {
        const res = await fetch('/api/crediti_disponibili', { headers: getHeaders() });
        if (!res.ok) return;
        const crediti = await res.json();
        const sel = document.getElementById('r_credito_id');
        crediti.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = `${c.tipo} - Qta: ${c.quantita} (€${c.valore}) - ${c.data_ref}`;
            sel.appendChild(opt);
        });
    } catch(e) { console.error('Errore caricamento crediti:', e); }
}

async function salvaRinnovo() {
    const nominativo_id = document.getElementById('r_nominativo_id').value;
    if (!nominativo_id) { mostraToast('⚠️ Seleziona un nominativo'); return; }

    const dati = {
        nominativo_id: parseInt(nominativo_id),
        tipo: document.getElementById('r_tipo').value,
        data_operazione: document.getElementById('r_data_operazione').value,
        mesi: parseInt(document.getElementById('r_mesi').value) || 12,
        scadenza: document.getElementById('r_scadenza').value,
        importo_acconto: parseFloat(document.getElementById('r_importo_acconto').value) || 0,
        importo_saldo: parseFloat(document.getElementById('r_importo_saldo').value) || 0,
        num_credito_rich: parseInt(document.getElementById('r_num_credito_rich').value) || 0,
        val_singolo_nc_rich: parseFloat(document.getElementById('r_val_singolo_nc_rich').value) || 0,
        credito_id: document.getElementById('r_credito_id').value ? parseInt(document.getElementById('r_credito_id').value) : null,
        note: document.getElementById('r_note').value.trim()
    };

    try {
        const res = await fetch('/api/rinnovo', {
            method: 'POST',
            headers: getHeaders('application/json'),
            body: JSON.stringify({ dati: dati })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        mostraToast('✅ Rinnovo salvato!');
        setTimeout(() => { tg.close(); }, 1000);
    } catch (e) { mostraToast('❌ Errore: ' + e.message); }
}

function mostraToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => { t.classList.remove('show'); }, 2500);
}

init();
</script>
</body>
</html>
