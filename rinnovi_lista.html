<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storico Rinnovi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body { font-family: -apple-system, Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 15px; }
.container { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
h2 { text-align: center; margin-top: 0; color: #333; }
.counter { text-align: center; background: #0088cc; color: white; padding: 8px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; margin: 0 auto 15px; display: inline-block; }
.counter-wrapper { text-align: center; }
.search { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 15px; margin-bottom: 15px; }
.item { background: #f9f9f9; padding: 12px; margin: 8px 0; border-radius: 6px; border-left: 4px solid #0088cc; }
.item-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.item-head strong { color: #222; font-size: 15px; }
.badge { background: #e3f2fd; color: #0088cc; font-size: 12px; font-weight: bold; padding: 2px 8px; border-radius: 10px; }
.item small { color: #555; display: block; font-size: 13px; margin: 2px 0; }
.item .scad { color: #c62828; font-weight: bold; }
.item .saldo { color: #2e7d32; font-weight: bold; }
.item .crediti { color: #6a1b9a; font-weight: bold; }
.item-actions { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
.btn { padding: 6px 8px; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; flex: 1; min-width: 0; }
.btn-del { background: #f44336; color: white; }
.btn-del:active { background: #d32f2f; }
.btn-pdf { background: #ff9800; color: white; }
.btn-pdf:active { background: #f57c00; }
.btn-saldo { background: #0088cc; color: white; }
.btn-saldo:active { background: #006699; }
.btn-wa { background: #25d366; color: white; }
.btn-wa:active { background: #128c7e; }
.empty { text-align: center; color: #888; padding: 30px; }
.error { text-align: center; color: #c62828; padding: 20px; background: #ffebee; border-radius: 6px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 24px; border-radius: 6px; z-index: 9999; opacity: 0; transition: opacity 0.3s; font-size: 14px; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
<h2>📜 Storico Rinnovi</h2>
<div class="counter-wrapper"><div class="counter" id="counter">Totale: 0</div></div>
<input type="text" class="search" id="search" placeholder="Cerca per nominativo...">
<div id="lista"><div class="empty">Caricamento...</div></div>
</div>
<div class="toast" id="toast"></div>
<script>
const tg = window.Telegram.WebApp;
tg.expand();
let rinnovi = [];

async function carica() {
  const box = document.getElementById('lista');
  try {
    const res = await fetch('/api/elenco_rinnovi');
    if (!res.ok) { box.innerHTML = '<div class="error">Errore server: HTTP ' + res.status + '</div>'; return; }
    rinnovi = await res.json();
    aggiornaContatore(rinnovi.length);
    render();
  } catch (e) {
    box.innerHTML = '<div class="error">Errore: ' + e.message + '</div>';
  }
}

function aggiornaContatore(totale) {
  document.getElementById('counter').textContent = 'Totale: ' + totale;
}

function render(filter) {
  filter = (filter || '').toLowerCase();
  const f = rinnovi.filter(r => (r.nominativo || '').toLowerCase().includes(filter));
  if (f.length === 0) {
    document.getElementById('lista').innerHTML = '<div class="empty">Nessun rinnovo.</div>';
    return;
  }
  document.getElementById('lista').innerHTML = f.map(r => {
    const saldo = (r.importo_saldo || 0);
    const rich = r.num_credito_rich || 0;
    const dato = r.num_credito_dato || 0;
    return '<div class="item">' +
      '<div class="item-head"><strong>' + (r.nominativo || '') + '</strong>' +
      '<span class="badge">' + (r.tipo || 'rinnovo') + '</span></div>' +
      '<small>Operazione: ' + (r.data_operazione || '-') + '</small>' +
      '<small class="scad">Scadenza: ' + (r.scadenza || '-') + (r.orario_scadenza ? ' ore ' + r.orario_scadenza : '') + '</small>' +
      '<small class="saldo">Saldo: €' + saldo + '</small>' +
      '<small class="crediti">Crediti: Richiesti ' + rich + ' / Dati ' + dato + '</small>' +
      '<div class="item-actions">' +
      '<button class="btn btn-del" onclick="cancella(' + r.id + ')">🗑️ Cancella</button>' +
      '<button class="btn btn-pdf" onclick="generaPDF(' + r.id + ', false)">📄 PDF</button>' +
      '<button class="btn btn-wa" onclick="generaPDF(' + r.id + ', true)">💬 WhatsApp</button>' +
      '<button class="btn btn-saldo" onclick="apriSaldo()">📊 Saldo</button>' +
      '</div></div>';
  }).join('');
}

function mostraToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => { t.classList.remove('show'); }, 2500);
}

async function cancella(id) {
  const r = rinnovi.find(x => x.id === id);
  if (!r) return;
  if (!confirm('Cancellare il rinnovo di "' + r.nominativo + '"?')) return;
  try {
    const res = await fetch('/api/rinnovo/' + id, { method: 'DELETE' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    mostraToast('🗑️ Cancellato');
    await carica();
  } catch (e) {
    mostraToast('❌ Errore: ' + e.message);
  }
}

function apriSaldo() {
  window.location.href = '/saldo_rinnovi.html';
}

function creaPDF(r) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  
  doc.setFontSize(18);
  doc.setTextColor(0, 136, 204);
  doc.text('AgendaGest - Scheda Rinnovo', 105, 20, { align: 'center' });
  
  doc.setDrawColor(0, 136, 204);
  doc.line(10, 25, 200, 25);
  
  doc.setFontSize(14);
  doc.setTextColor(0, 0, 0);
  doc.text('Nominativo: ' + (r.nominativo || ''), 14, 35);
  doc.text('Tipo: ' + (r.tipo || 'rinnovo'), 14, 43);
  doc.text('Data Operazione: ' + (r.data_operazione || '-'), 14, 51);
  
  doc.setFontSize(12);
  doc.setTextColor(198, 40, 40);
  doc.text('Scadenza: ' + (r.scadenza || '-') + (r.orario_scadenza ? ' ore ' + r.orario_scadenza : ''), 14, 61);
  
  doc.setFontSize(12);
  doc.setTextColor(0, 0, 0);
  doc.text('--- IMPORTI ---', 14, 73);
  doc.text('Acconto: EUR ' + (r.importo_acconto || 0).toFixed(2), 14, 81);
  doc.text('Saldo: EUR ' + (r.importo_saldo || 0).toFixed(2), 14, 89);
  
  doc.setTextColor(106, 27, 154);
  doc.text('--- CREDITI ---', 14, 101);
  doc.text('Num Credito Richiesto: ' + (r.num_credito_rich || 0), 14, 109);
  doc.text('Num Credito Dato: ' + (r.num_credito_dato || 0), 14, 117);
  doc.text('Num Credito Dare: ' + (r.num_credito_dare || 0), 14, 125);
  doc.text('Data Credito Rich: ' + (r.data_credito_rinnovo_rich || '-'), 14, 133);
  doc.text('Data Credito Dato: ' + (r.data_credito_rinnovo_dato || '-'), 14, 141);
  doc.text('Val Singolo NC Rich: EUR ' + (r.val_singolo_nc_rich || 0).toFixed(2), 14, 149);
  doc.text('Val NC Rich: EUR ' + (r.val_nc_rich || 0).toFixed(2), 14, 157);
  
  doc.setTextColor(0, 0, 0);
  doc.text('--- NOTE ---', 14, 169);
  const note = r.note || 'Nessuna nota';
  const splitNote = doc.splitTextToSize(note, 180);
  doc.text(splitNote, 14, 177);
  
  doc.setFontSize(10);
  doc.setTextColor(128, 128, 128);
  doc.text('Generato il: ' + new Date().toLocaleString('it-IT'), 105, 285, { align: 'center' });
  
  return doc;
}

async function generaPDF(id, inviaWhatsApp) {
  const r = rinnovi.find(x => x.id === id);
  if (!r) return;
  
  const doc = creaPDF(r);
  const nomeFile = 'Rinnovo_' + (r.nominativo || 'sconosciuto') + '_' + (r.data_operazione || 'data') + '.pdf';
  
  if (inviaWhatsApp) {
    // Genera il PDF come Blob
    const pdfBlob = doc.output('blob');
    const pdfFile = new File([pdfBlob], nomeFile, { type: 'application/pdf' });
    
    // Prova la Web Share API (funziona su mobile con HTTPS)
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
      try {
        await navigator.share({
          files: [pdfFile],
          title: 'Scheda Rinnovo',
          text: 'Rinnovo di ' + (r.nominativo || '')
        });
        mostraToast('✅ Condiviso con successo!');
        return;
      } catch (e) {
        if (e.name === 'AbortError') {
          mostraToast('Condivisione annullata');
          return;
        }
      }
    }
    
    // Fallback: scarica il PDF e apre WhatsApp con messaggio
    doc.save(nomeFile);
    mostraToast('📄 PDF scaricato. Apri WhatsApp per inviarlo.');
    setTimeout(() => {
      const msg = encodeURIComponent('Scheda Rinnovo - ' + (r.nominativo || '') + ' - Scadenza: ' + (r.scadenza || '-'));
      window.open('https://wa.me/?text=' + msg, '_blank');
    }, 1000);
  } else {
    // Solo download
    doc.save(nomeFile);
    mostraToast('📄 PDF scaricato!');
  }
}

document.getElementById('search').addEventListener('input', e => render(e.target.value));
carica();
</script>
</body>
</html>
