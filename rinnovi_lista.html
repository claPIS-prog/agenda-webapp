<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storico Rinnovi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/auth.js"></script>
<style>
body { font-family: -apple-system, Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 15px; }
.container { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
h2 { text-align: center; margin-top: 0; color: #333; }
.counter { text-align: center; background: #0088cc; color: white; padding: 8px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; margin: 0 auto 15px; display: inline-block; }
.counter-wrapper { text-align: center; }
.item { background: #f9f9f9; padding: 12px; margin: 8px 0; border-radius: 6px; border-left: 4px solid #0088cc; }
.item strong { color: #222; font-size: 15px; display: block; margin-bottom: 4px; }
.item small { color: #666; display: block; font-size: 13px; margin: 2px 0; }
.item-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.btn { padding: 6px 10px; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; flex: 1; text-align: center; text-decoration: none; display: inline-block; min-width: 0; }
.btn-del { background: #f44336; color: white; }
.btn-pdf { background: #0088cc; color: white; }
.btn-wa { background: #25d366; color: white; }
.btn-saldo { background: #ff9800; color: white; }
.empty { text-align: center; color: #888; padding: 30px; }
.error { text-align: center; color: #c62828; padding: 20px; background: #ffebee; border-radius: 6px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 24px; border-radius: 6px; z-index: 9999; opacity: 0; transition: opacity 0.3s; font-size: 14px; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
<h2>📜 Storico Rinnovi</h2>
<div class="counter-wrapper"><div class="counter" id="counter">Totale: 0</div></div>
<div id="lista"><div class="empty">Caricamento...</div></div>
</div>
<div class="toast" id="toast"></div>
<script>
const tg = window.Telegram.WebApp; tg.expand();

function getHeaders(contentType) {
    const headers = {};
    if (contentType) headers['Content-Type'] = contentType;
    const initData = tg.initData;
    if (initData) headers['X-Telegram-Init-Data'] = initData;
    return headers;
}

let rinnovi = [];

async function carica() {
    const box = document.getElementById('lista');
    try {
        const res = await fetch('/api/elenco_rinnovi', { headers: getHeaders() });
        if (!res.ok) {
            if (res.status === 403) box.innerHTML = '<div class="error">⛔ Permesso negato.</div>';
            else box.innerHTML = '<div class="error">Errore server: HTTP ' + res.status + '</div>';
            return;
        }
        rinnovi = await res.json();
        aggiornaContatore(rinnovi.length);
        render();
    } catch (e) {
        box.innerHTML = '<div class="error">Errore: ' + e.message + '</div>';
    }
}

function aggiornaContatore(totale) {
    document.getElementById('counter').textContent = 'Totale: ' + totale;
}

function render() {
    if (rinnovi.length === 0) {
        document.getElementById('lista').innerHTML = '<div class="empty">Nessun rinnovo registrato.</div>';
        return;
    }
    document.getElementById('lista').innerHTML = rinnovi.map(r => {
        const data = r.creato_il ? new Date(r.creato_il).toLocaleString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '-';
        return '<div class="item">' +
            '<strong>' + (r.nominativo || '') + ' <small style="color:#0088cc">(' + (r.tipo || 'rinnovo') + ')</small></strong>' +
            '<small>📅 Scadenza: ' + (r.scadenza || '-') + (r.orario_scadenza ? ' ore ' + r.orario_scadenza : '') + '</small>' +
            '<small>💰 Acconto: €' + (r.importo_acconto || 0) + ' | Saldo: €' + (r.importo_saldo || 0) + '</small>' +
            (r.num_credito_rich > 0 ? '<small>🎫 Crediti: Rich ' + r.num_credito_rich + ' | Dati ' + r.num_credito_dato + '</small>' : '') +
            '<div class="item-actions">' +
            '<button class="btn btn-del" onclick="cancella(' + r.id + ')">🗑️ Cancella</button>' +
            '<button class="btn btn-pdf" onclick="pdf(' + r.id + ')">📄 PDF</button>' +
            '<button class="btn btn-wa" onclick="whatsapp(\'' + (r.nominativo || '') + '\', \'' + (r.scadenza || '') + '\')">💬 WA</button>' +
            '<button class="btn btn-saldo" onclick="saldo(' + r.id + ')">📊 Saldo</button>' +
            '</div></div>';
    }).join('');
}

function mostraToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}

async function cancella(id) {
    if (!confirm('Sei sicuro di voler cancellare questo rinnovo?')) return;
    try {
        const res = await fetch('/api/rinnovo/' + id, { method: 'DELETE', headers: getHeaders() });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        mostraToast('🗑️ Rinnovo cancellato');
        await carica();
    } catch (e) {
        mostraToast('❌ Errore: ' + e.message);
    }
}

function pdf(id) {
    mostraToast('📄 Generazione PDF in corso...');
}

function whatsapp(nome, scadenza) {
    const testo = 'Ciao ' + nome + ', ti ricordo la scadenza del ' + scadenza + '.';
    tg.openLink('https://wa.me/?text=' + encodeURIComponent(testo));
}

function saldo(id) {
    tg.openLink('https://agenda-webapp.onrender.com/saldo_rinnovi.html?rinnovo_id=' + id);
}

carica();
</script>
</body>
</html>
