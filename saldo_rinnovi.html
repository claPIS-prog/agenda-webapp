<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Saldo Iniziale Crediti</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/auth.js"></script>
<style>
body { font-family: -apple-system, Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 15px; }
.container { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); max-width: 500px; margin: 0 auto; }
h2 { text-align: center; color: #333; }
label { display: block; font-weight: bold; margin: 10px 0 4px; font-size: 13px; }
input, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
.row { display: flex; gap: 8px; } .row > div { flex: 1; }
.btn-save { width: 100%; background: #0088cc; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; margin-top: 20px; cursor: pointer; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px; border-radius: 6px; opacity: 0; transition: 0.3s; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
<h2>📦 Saldo Iniziale Crediti</h2>
<p style="font-size:12px; color:#666; text-align:center;">Inserisci lo stock di partenza. Verrà assegnato ID #1.</p>

<div class="row">
    <div><label>Data Riferimento:</label><input type="date" id="s_data"></div>
    <div><label>Quantità Totale:</label><input type="number" id="s_qta" value="0" oninput="calcUnit()"></div>
</div>
<div class="row">
    <div><label>Valore Totale (€):</label><input type="number" step="0.01" id="s_tot" value="0" oninput="calcUnit()"></div>
    <div><label>Prezzo Unitario (€):</label><input type="number" step="0.01" id="s_unit" readonly></div>
</div>
<label>Note:</label>
<textarea id="s_note" rows="3"></textarea>

<button class="btn-save" onclick="salva()">💾 Salva Saldo Iniziale</button>
</div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram.WebApp; tg.expand();
function getHeaders(t) { const h={}; if(t) h['Content-Type']=t; if(tg.initData) h['X-Telegram-Init-Data']=tg.initData; return h; }

document.getElementById('s_data').value = new Date().toISOString().split('T')[0];

function calcUnit() {
    const q = parseFloat(document.getElementById('s_qta').value) || 0;
    const t = parseFloat(document.getElementById('s_tot').value) || 0;
    document.getElementById('s_unit').value = q > 0 ? (t/q).toFixed(2) : "0.00";
}

async function salva() {
    const d = {
        data_acquisto: document.getElementById('s_data').value,
        quantita: parseInt(document.getElementById('s_qta').value) || 0,
        valore_totale: parseFloat(document.getElementById('s_tot').value) || 0,
        valore_singolo: parseFloat(document.getElementById('s_unit').value) || 0,
        note: document.getElementById('s_note').value
    };
    try {
        const r = await fetch('/api/saldo_iniziale', { method:'POST', headers:getHeaders('application/json'), body:JSON.stringify({dati:d}) });
        if(!r.ok) throw new Error('Errore server');
        document.getElementById('toast').textContent = "✅ Saldo iniziale aggiornato!";
        document.getElementById('toast').classList.add('show');
        setTimeout(() => tg.close(), 1500);
    } catch(e) { alert(e.message); }
}
</script>
</body>
</html>
