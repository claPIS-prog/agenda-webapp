<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saldo Rinnovi TEST</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
.container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
h2 { text-align: center; }
#debug { background: #000; color: #0f0; padding: 15px; margin: 15px 0; font-family: monospace; font-size: 11px; white-space: pre-wrap; word-break: break-all; max-height: 400px; overflow-y: auto; }
.item { background: #fff; border: 1px solid #ddd; padding: 10px; margin: 8px 0; border-radius: 4px; }
.item-name { font-weight: bold; }
.item-data { font-size: 12px; color: #666; margin-top: 4px; }
.btn { padding: 5px 10px; margin: 2px; border: none; border-radius: 3px; cursor: pointer; color: white; }
.btn-edit { background: #ff9800; }
.btn-del { background: #f44336; }
</style>
</head>
<body>
<div class="container">
<h2>📊 Saldo Rinnovi - DEBUG MODE</h2>
<div id="debug">Inizializzazione...</div>
<div id="lista"></div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

function log(msg) {
    const d = document.getElementById('debug');
    d.textContent += msg + '\n';
    d.scrollTop = d.scrollHeight;
    console.log(msg);
}

async function carica() {
    const lista = document.getElementById('lista');
    log('=== INIZIO TEST ===');
    
    try {
        log('1. Chiamata fetch...');
        const res = await fetch('/api/elenco_rinnovi?test=' + Date.now());
        log('2. Status: ' + res.status);
        
        const text = await res.text();
        log('3. Raw response (' + text.length + ' chars): ' + text.substring(0, 500));
        
        let data;
        try {
            data = JSON.parse(text);
            log('4. ✓ JSON parsato. Type: ' + typeof data + ', Array: ' + Array.isArray(data));
        } catch(e) {
            throw new Error('JSON invalid: ' + e.message);
        }
        
        if (!Array.isArray(data)) {
            throw new Error('Non è un array! Tipo: ' + typeof data);
        }
        
        log('5. Record ricevuti: ' + data.length);
        
        if (data.length > 0) {
            const first = data[0];
            log('6. Chiavi primo record: ' + Object.keys(first).join(', '));
            log('7. Primo record completo: ' + JSON.stringify(first, null, 2));
            
            // TEST: prova ad accedere alle proprietà
            log('8. Test accesso proprietà:');
            log('   first.id = ' + first.id);
            log('   first.nominativo = ' + first.nominativo);
            log('   first.num_credito_rich = ' + first.num_credito_rich);
            log('   typeof first.num_credito_rich = ' + typeof first.num_credito_rich);
        }
        
        // RENDERING MINIMALISTA
        lista.innerHTML = '';
        for (let i = 0; i < Math.min(data.length, 5); i++) {
            const r = data[i];
            
            const item = document.createElement('div');
            item.className = 'item';
            
            const name = document.createElement('div');
            name.className = 'item-name';
            name.textContent = 'ID: ' + r.id + ' - ' + (r.nominativo || 'N/A');
            
            const dataDiv = document.createElement('div');
            dataDiv.className = 'item-data';
            
            // Lettura valori con controllo tipo
            const rich = (typeof r.num_credito_rich === 'number') ? r.num_credito_rich : 0;
            const dato = (typeof r.num_credito_dato === 'number') ? r.num_credito_dato : 0;
            const saldo = (typeof r.num_credito_dare === 'number') ? r.num_credito_dare : 0;
            
            dataDiv.textContent = 'Rich: ' + rich + ' | Dato: ' + dato + ' | Saldo: ' + saldo;
            
            const actions = document.createElement('div');
            const btnE = document.createElement('button');
            btnE.className = 'btn btn-edit';
            btnE.textContent = '✏️';
            btnE.onclick = () => log('Edit ID: ' + r.id);
            
            const btnD = document.createElement('button');
            btnD.className = 'btn btn-del';
            btnD.textContent = '🗑️';
            btnD.onclick = async () => {
                if (confirm('Eliminare ID ' + r.id + '?')) {
                    try {
                        await fetch('/api/rinnovo/' + r.id, { method: 'DELETE' });
                        log('✓ Eliminato ID ' + r.id);
                        carica();
                    } catch(e) {
                        log('✗ Errore delete: ' + e.message);
                    }
                }
            };
            
            actions.appendChild(btnE);
            actions.appendChild(btnD);
            
            item.appendChild(name);
            item.appendChild(dataDiv);
            item.appendChild(actions);
            lista.appendChild(item);
        }
        
        log('9. ✓ Rendering completato');
        
    } catch(e) {
        log('✗ ERRORE FATALE: ' + e.message);
        lista.innerHTML = '<div style="color:red;padding:20px;">' + e.message + '</div>';
    }
}

carica();
</script>
</body>
</html>
