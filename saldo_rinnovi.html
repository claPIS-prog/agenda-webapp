<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saldo Rinnovi - FIXED</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
.container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
h2 { text-align: center; color: #333; }
#debug { background: #1e1e1e; color: #00ff00; padding: 15px; margin: 15px 0; font-family: monospace; font-size: 11px; white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow-y: auto; border-radius: 4px; }
.item { background: #fff; border: 1px solid #ddd; padding: 12px; margin: 8px 0; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
.item-info { flex-grow: 1; }
.item-name { font-weight: bold; font-size: 15px; color: #333; }
.item-data { font-size: 12px; color: #666; margin-top: 4px; }
.btn { padding: 6px 12px; margin-left: 5px; border: none; border-radius: 4px; cursor: pointer; color: white; font-size: 13px; }
.btn-edit { background: #ff9800; }
.btn-del { background: #f44336; }
.error-box { color: #c62828; background: #ffebee; padding: 15px; border-radius: 6px; margin-top: 10px; text-align: center; }
</style>
</head>
<body>
<div class="container">
<h2>📊 Saldo Rinnovi - DEBUG MODE</h2>
<div id="debug">Inizializzazione...</div>
<div id="lista"></div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

function log(msg) {
    const d = document.getElementById('debug');
    d.textContent += msg + '\n';
    d.scrollTop = d.scrollHeight;
    console.log(msg);
}

async function carica() {
    const lista = document.getElementById('lista');
    log('=== INIZIO TEST ===');
    
    try {
        log('1. Chiamata fetch...');
        const res = await fetch('/api/elenco_rinnovi?test=' + Date.now());
        log('2. Status: ' + res.status);
        
        const text = await res.text();
        log('3. Raw response (' + text.length + ' chars): ' + text.substring(0, 300));
        
        let data;
        try {
            data = JSON.parse(text);
            log('4. ✓ JSON parsato. Type: ' + typeof data + ', Array: ' + Array.isArray(data));
        } catch(e) {
            throw new Error('JSON invalid: ' + e.message);
        }
        
        // FIX: Gestione esplicita risposta non-array
        if (!Array.isArray(data)) {
            log('✗ ERRORE: Il server ha restituito un oggetto invece di un array!');
            log('Contenuto: ' + JSON.stringify(data));
            
            // Se è un oggetto error di FastAPI, mostralo
            if (data.detail) {
                lista.innerHTML = '<div class="error-box"><strong>Errore Backend:</strong><br>' + data.detail + '</div>';
            } else {
                lista.innerHTML = '<div class="error-box"><strong>Errore Formato Dati:</strong><br>Il server non ha restituito un array valido.</div>';
            }
            return;
        }
        
        log('5. Record ricevuti: ' + data.length);
        
        if (data.length > 0) {
            const first = data[0];
            log('6. Chiavi primo record: ' + Object.keys(first).join(', '));
            log('7. Primo record: ' + JSON.stringify(first));
            
            // Test accesso proprietà
            log('8. Test valori:');
            log('   id=' + first.id + ' (' + typeof first.id + ')');
            log('   nominativo=' + first.nominativo + ' (' + typeof first.nominativo + ')');
            log('   num_credito_rich=' + first.num_credito_rich + ' (' + typeof first.num_credito_rich + ')');
        }
        
        // RENDERING
        lista.innerHTML = '';
        if (data.length === 0) {
            lista.innerHTML = '<div style="text-align:center;color:#888;padding:20px;">Nessun dato trovato.</div>';
            return;
        }
        
        for (let i = 0; i < data.length; i++) {
            const r = data[i];
            
            const item = document.createElement('div');
            item.className = 'item';
            
            const info = document.createElement('div');
            info.className = 'item-info';
            
            const name = document.createElement('div');
            name.className = 'item-name';
            name.textContent = (r.nominativo || 'ID:' + r.nominativo_id);
            
            const dataDiv = document.createElement('div');
            dataDiv.className = 'item-data';
            
            // Lettura sicura valori
            const rich = (typeof r.num_credito_rich === 'number') ? r.num_credito_rich : 0;
            const dato = (typeof r.num_credito_dato === 'number') ? r.num_credito_dato : 0;
            const saldo = (typeof r.num_credito_dare === 'number') ? r.num_credito_dare : 0;
            
            dataDiv.textContent = 'Rich: ' + rich + ' | Dato: ' + dato + ' | Saldo: ' + saldo;
            
            info.appendChild(name);
            info.appendChild(dataDiv);
            
            const actions = document.createElement('div');
            const btnE = document.createElement('button');
            btnE.className = 'btn btn-edit';
            btnE.textContent = '✏️';
            btnE.onclick = () => log('Edit ID: ' + r.id);
            
            const btnD = document.createElement('button');
            btnD.className = 'btn btn-del';
            btnD.textContent = '🗑️';
            btnD.onclick = async () => {
                if (confirm('Eliminare ID ' + r.id + '?')) {
                    try {
                        await fetch('/api/rinnovo/' + r.id, { method: 'DELETE' });
                        log('✓ Eliminato');
                        carica();
                    } catch(e) {
                        log('✗ Errore delete: ' + e.message);
                    }
                }
            };
            
            actions.appendChild(btnE);
            actions.appendChild(btnD);
            
            item.appendChild(info);
            item.appendChild(actions);
            lista.appendChild(item);
        }
        
        log('9. ✓ Rendering completato');
        
    } catch(e) {
        log('✗ ERRORE FATALE: ' + e.message);
        lista.innerHTML = '<div class="error-box">' + e.message + '</div>';
    }
}

carica();
</script>
</body>
</html>
