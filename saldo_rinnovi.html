<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Saldo Rinnovi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/auth.js"></script>
<style>
body { font-family: -apple-system, Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 15px; }
.container { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); max-width: 600px; margin: 0 auto; }
h2 { text-align: center; color: #333; margin-top: 0; }
.counter-wrapper { text-align: center; margin-bottom: 15px; }
.counter { display: inline-block; background: #0088cc; color: white; padding: 6px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; }
.controls { display: flex; gap: 10px; margin-bottom: 15px; }
select { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
.btn-add { background: #4caf50; color: white; border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; }
.list-container { min-height: 200px; }
.item { background: #fff; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
.item-info { flex-grow: 1; }
.item-name { font-weight: bold; font-size: 15px; color: #333; }
.item-sub { font-size: 12px; color: #666; margin-top: 2px; }
.item-actions button { margin-left: 5px; padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
.btn-edit { background: #ff9800; color: white; }
.btn-del { background: #f44336; color: white; }
.empty { text-align: center; color: #888; padding: 30px; }

/* Modal Styles */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
.modal-overlay.active { display: flex; }
.modal { background: white; border-radius: 10px; padding: 20px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; position: relative; }
.modal h3 { text-align: center; margin-top: 0; color: #333; border-bottom: 1px solid #eee; padding-bottom: 10px; }
.close-modal { position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 24px; cursor: pointer; color: #999; }
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-weight: bold; font-size: 12px; margin-bottom: 4px; color: #555; }
.form-group input, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
.form-row { display: flex; gap: 10px; }
.form-row > div { flex: 1; }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.modal-actions button { flex: 1; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
.btn-cancel { background: #9e9e9e; color: white; }
.btn-save { background: #4caf50; color: white; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 6px; opacity: 0; transition: 0.3s; z-index: 200; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
    <h2>📊 Saldo Rinnovi</h2>
    
    <div class="counter-wrapper">
        <span class="counter" id="counter">Totale: 0</span>
    </div>

    <div class="controls">
        <select id="nominativo-filter">
            <option value="">-- Seleziona Rinnovo --</option>
        </select>
        <button class="btn-add" onclick="apriModal()">➕ Aggiungi</button>
    </div>

    <div class="list-container" id="lista">
        <div class="empty">Caricamento...</div>
    </div>
</div>

<!-- MODAL MODIFICA -->
<div class="modal-overlay" id="editModal">
    <div class="modal">
        <button class="close-modal" onclick="chiudiModal()">×</button>
        <h3>✏️ Modifica Saldo Rinnovo</h3>
        
        <div class="form-group">
            <label>Nominativo</label>
            <input type="text" id="m_nominativo" readonly style="background:#f0f0f0;">
            <input type="hidden" id="m_id">
        </div>

        <div class="form-row">
            <div class="form-group"><label>Num Credito Rich</label><input type="number" id="m_num_rich"></div>
            <div class="form-group"><label>Num Credito Dato</label><input type="number" id="m_num_dato"></div>
        </div>

        <div class="form-row">
            <div class="form-group"><label>Data Credito Rich</label><input type="date" id="m_data_rich"></div>
            <div class="form-group"><label>Data Credito Dato</label><input type="date" id="m_data_dato"></div>
        </div>

        <div class="form-group"><label>Val NC Rich (€)</label><input type="number" step="0.01" id="m_val_rich"></div>
        
        <div class="form-row">
            <div class="form-group"><label>Num Credito Saldo</label><input type="number" id="m_num_saldo"></div>
            <div class="form-group"><label>Data Credito Rinnovo Saldo</label><input type="date" id="m_data_saldo"></div>
        </div>

        <div class="form-row">
            <div class="form-group"><label>Val NC Dato (€)</label><input type="number" step="0.01" id="m_val_dato"></div>
            <div class="form-group"><label>Val NC Saldo (€)</label><input type="number" step="0.01" id="m_val_saldo"></div>
        </div>

        <div class="form-group"><label>Informazioni & Note</label><textarea id="m_note" rows="3"></textarea></div>

        <div class="modal-actions">
            <button class="btn-cancel" onclick="chiudiModal()">Annulla</button>
            <button class="btn-save" onclick="salvaModifica()">💾 Salva</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

function getHeaders(t) {
    const h = {};
    if(t) h['Content-Type'] = t;
    if(tg.initData) h['X-Telegram-Init-Data'] = tg.initData;
    return h;
}

let datiRinnovi = [];

async function caricaDati() {
    try {
        const res = await fetch('/api/elenco_rinnovi', { headers: getHeaders() });
        if (!res.ok) throw new Error('Errore server');
        datiRinnovi = await res.json();
        
        // Aggiorna contatore
        document.getElementById('counter').textContent = `Totale: ${datiRinnovi.length}`;
        
        // Popola select filtro
        const sel = document.getElementById('nominativo-filter');
        sel.innerHTML = '<option value="">-- Seleziona Rinnovo --</option>';
        const unici = [...new Set(datiRinnovi.map(r => r.nominativo))];
        unici.forEach(n => {
            sel.innerHTML += `<option value="${n}">${n}</option>`;
        });
        
        renderLista();
    } catch(e) {
        document.getElementById('lista').innerHTML = `<div class="empty" style="color:red">Errore: ${e.message}</div>`;
    }
}

function renderLista(filtro = '') {
    const container = document.getElementById('lista');
    const filtrati = filtro ? datiRinnovi.filter(r => r.nominativo === filtro) : datiRinnovi;
    
    if (filtrati.length === 0) {
        container.innerHTML = '<div class="empty">Nessun rinnovo trovato.</div>';
        return;
    }
    
    container.innerHTML = filtrati.map(r => `
        <div class="item">
            <div class="item-info">
                <div class="item-name">${r.nominativo || 'N/A'}</div>
                <div class="item-sub">Rich: ${r.num_credito_rich || 0} | Dato: ${r.num_credito_dato || 0} | Saldo: ${r.num_credito_dare || 0}</div>
            </div>
            <div class="item-actions">
                <button class="btn-edit" onclick="apriEdit(${r.id})">✏️</button>
                <button class="btn-del" onclick="elimina(${r.id})">🗑️</button>
            </div>
        </div>
    `).join('');
}

// Filtro select
document.getElementById('nominativo-filter').addEventListener('change', (e) => {
    renderLista(e.target.value);
});

// Modal functions
function apriModal() {
    // Per "Aggiungi" potremmo aprire un form vuoto o redirect a nuovo rinnovo
    alert("Funzione Aggiungi: reindirizza al modulo Nuovo Rinnovo");
}

function apriEdit(id) {
    const r = datiRinnovi.find(x => x.id === id);
    if (!r) return;
    
    document.getElementById('m_id').value = r.id;
    document.getElementById('m_nominativo').value = r.nominativo || '';
    document.getElementById('m_num_rich').value = r.num_credito_rich || 0;
    document.getElementById('m_num_dato').value = r.num_credito_dato || 0;
    document.getElementById('m_data_rich').value = r.data_credito_rinnovo_rich || '';
    document.getElementById('m_data_dato').value = r.data_credito_rinnovo_dato || '';
    document.getElementById('m_val_rich').value = r.val_nc_rich || 0;
    document.getElementById('m_num_saldo').value = r.num_credito_dare || 0; // Assumendo num_credito_dare sia il saldo
    document.getElementById('m_data_saldo').value = r.data_saldo || '';
    document.getElementById('m_val_dato').value = r.val_nc_dato || 0; // Campo da verificare nel DB
    document.getElementById('m_val_saldo').value = r.val_nc_saldo || 0; // Campo da verificare nel DB
    document.getElementById('m_note').value = r.note || '';
    
    document.getElementById('editModal').classList.add('active');
}

function chiudiModal() {
    document.getElementById('editModal').classList.remove('active');
}

async function salvaModifica() {
    const id = document.getElementById('m_id').value;
    const dati = {
        azione: 'modifica_rinnovo',
        id: parseInt(id),
        num_credito_rich: parseInt(document.getElementById('m_num_rich').value) || 0,
        num_credito_dato: parseInt(document.getElementById('m_num_dato').value) || 0,
        data_credito_rinnovo_rich: document.getElementById('m_data_rich').value,
        data_credito_rinnovo_dato: document.getElementById('m_data_dato').value,
        val_nc_rich: parseFloat(document.getElementById('m_val_rich').value) || 0,
        num_credito_dare: parseInt(document.getElementById('m_num_saldo').value) || 0,
        data_saldo: document.getElementById('m_data_saldo').value,
        val_nc_dato: parseFloat(document.getElementById('m_val_dato').value) || 0,
        val_nc_saldo: parseFloat(document.getElementById('m_val_saldo').value) || 0,
        note: document.getElementById('m_note').value
    };
    
    try {
        const res = await fetch('/api/rinnovo', {
            method: 'POST',
            headers: getHeaders('application/json'),
            body: JSON.stringify({ dati })
        });
        if (!res.ok) throw new Error('Errore salvataggio');
        
        showToast("✅ Salvato!");
        chiudiModal();
        caricaDati();
    } catch(e) {
        alert("❌ Errore: " + e.message);
    }
}

async function elimina(id) {
    if (!confirm("Eliminare questo rinnovo?")) return;
    try {
        await fetch(`/api/rinnovo/${id}`, { method: 'DELETE', headers: getHeaders() });
        showToast("🗑️ Eliminato");
        caricaDati();
    } catch(e) {
        alert("Errore eliminazione");
    }
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

caricaDati();
</script>
</body>
</html>
