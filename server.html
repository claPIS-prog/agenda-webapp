<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reseller</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; padding: 16px; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: var(--tg-theme-secondary-bg-color, #f9f9f9); }
    .name { font-weight: bold; font-size: 1.1em; }
    .empty { text-align: center; color: #999; margin-top: 40px; }
  </style>
</head>
<body>
  <h1>🏢 Reseller</h1>
  <div id="lista"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }
    const API_BASE = ""; 
    const listaDiv = document.getElementById("lista");

    async function carica() {
      try {
        listaDiv.innerHTML = "<div class='empty'>Caricamento...</div>";
        const r = await fetch(`${API_BASE}/api/server`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const lista = await r.json();
        render(lista);
      } catch (e) {
        listaDiv.innerHTML = `<div class='empty'>Errore: ${e.message}</div>`;
      }
    }

    function render(lista) {
      listaDiv.innerHTML = "";
      if (lista.length === 0) {
        listaDiv.innerHTML = "<div class='empty'>Nessun server trovato.</div>";
        return;
      }
      lista.forEach(item => {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `<div class="name">${item.nominativo}</div>`;
        listaDiv.appendChild(div);
      });
    }

    carica();
  </script>
</body>
</html>
