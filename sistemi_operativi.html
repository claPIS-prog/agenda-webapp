<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistemi Operativi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/auth.js"></script>
<style>
body { font-family: -apple-system, Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 15px; }
.container { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
h2 { text-align: center; margin-top: 0; color: #333; }
.counter { text-align: center; background: #0088cc; color: white; padding: 8px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; margin: 0 auto 15px; display: inline-block; }
.counter-wrapper { text-align: center; }
.input-row { display: flex; gap: 10px; margin-bottom: 15px; }
.input-row input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 15px; }
.btn-add { padding: 10px 20px; background: #4caf50; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
.btn-add:active { background: #388e3c; }
.item { background: #f9f9f9; padding: 12px; margin: 8px 0; border-radius: 6px; border-left: 4px solid #0088cc; display: flex; justify-content: space-between; align-items: center; }
.item strong { color: #222; font-size: 15px; }
.item-actions { display: flex; gap: 6px; }
.btn { padding: 6px 12px; border: none; border-radius: 4px; font-size: 13px; cursor: pointer; font-weight: bold; }
.btn-edit { background: #ff9800; color: white; }
.btn-del { background: #f44336; color: white; }
.empty { text-align: center; color: #888; padding: 30px; }
.error { text-align: center; color: #c62828; padding: 20px; background: #ffebee; border-radius: 6px; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
.modal-overlay.active { display: flex; }
.modal { background: white; border-radius: 10px; padding: 20px; width: 90%; max-width: 400px; }
.modal h3 { margin-top: 0; }
.modal input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 15px; margin: 10px 0; }
.modal-actions { display: flex; gap: 10px; }
.modal-actions button { flex: 1; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
.btn-save { background: #4caf50; color: white; }
.btn-cancel { background: #9e9e9e; color: white; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 6px; z-index: 200; opacity: 0; transition: opacity 0.3s; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
<h2>💻 Sistemi Operativi</h2>
<div class="counter-wrapper"><div class="counter" id="counter">Totale: 0</div></div>
<div class="input-row">
<input type="text" id="nuovo" placeholder="Nuovo sistema operativo...">
<button class="btn-add" onclick="aggiungi()">Aggiungi</button>
</div>
<div id="lista"><div class="empty">Caricamento...</div></div>
</div>
<div class="modal-overlay" id="modal"><div class="modal">
<h3>✏️ Modifica Sistema Operativo</h3>
<input type="text" id="m_nome">
<div class="modal-actions">
<button class="btn-cancel" onclick="chiudiModal()">Annulla</button>
<button class="btn-save" onclick="salvaModifica()">Salva</button>
</div>
</div></div>
<div class="toast" id="toast"></div>
<script>
const tg = window.Telegram.WebApp; tg.expand();
let items = []; let idModifica = null;

async function carica() {
  const box = document.getElementById('lista');
  try {
    const res = await fetch('/api/sistemi_operativi');
    if (!res.ok) { box.innerHTML = '<div class="error">Errore: HTTP ' + res.status + '</div>'; return; }
    items = await res.json();
    aggiornaContatore(items.length);
    render();
  } catch (e) { box.innerHTML = '<div class="error">Errore: ' + e.message + '</div>'; }
}

function aggiornaContatore(totale) { document.getElementById('counter').textContent = 'Totale: ' + totale; }

function render() {
  if (items.length === 0) { document.getElementById('lista').innerHTML = '<div class="empty">Nessun sistema operativo.</div>'; return; }
  document.getElementById('lista').innerHTML = items.map(i =>
    '<div class="item"><strong>' + (i.nome || i.nominativo) + '</strong>' +
    '<div class="item-actions"><button class="btn btn-edit" onclick="apriModifica(' + i.id + ')">✏️</button>' +
    '<button class="btn btn-del" onclick="cancella(' + i.id + ')">🗑️</button></div></div>'
  ).join('');
}

async function aggiungi() {
  const nome = document.getElementById('nuovo').value.trim();
  if (!nome) { mostraToast('⚠️ Inserisci un nome'); return; }
  try {
    const res = await fetch('/api/lista/nuovo', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nome: nome, tabella: 'sistemi_operativi' }) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    document.getElementById('nuovo').value = '';
    mostraToast('✅ Aggiunto'); await carica();
  } catch (e) { mostraToast('❌ Errore: ' + e.message); }
}

function apriModifica(id) {
  const i = items.find(x => x.id === id); if (!i) return;
  idModifica = id;
  document.getElementById('m_nome').value = i.nome || i.nominativo || '';
  document.getElementById('modal').classList.add('active');
}
function chiudiModal() { document.getElementById('modal').classList.remove('active'); idModifica = null; }

async function salvaModifica() {
  if (!idModifica) return;
  const nome = document.getElementById('m_nome').value.trim();
  if (!nome) { mostraToast('⚠️ Il nome è obbligatorio'); return; }
  try {
    const res = await fetch('/api/lista/modifica?id=' + idModifica + '&nome=' + encodeURIComponent(nome) + '&tabella=sistemi_operativi', { method: 'POST' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    chiudiModal(); mostraToast('✅ Modificato'); await carica();
  } catch (e) { mostraToast('❌ Errore: ' + e.message); }
}

async function cancella(id) {
  const i = items.find(x => x.id === id); if (!i) return;
  if (!confirm('Cancellare "' + (i.nome || i.nominativo) + '"?')) return;
  try {
    const res = await fetch('/api/lista/cancella/' + id + '?tabella=sistemi_operativi', { method: 'DELETE' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    mostraToast('🗑️ Cancellato'); await carica();
  } catch (e) { mostraToast('❌ Errore: ' + e.message); }
}

function mostraToast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
carica();
</script>
</body>
</html>
